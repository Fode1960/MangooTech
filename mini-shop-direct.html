<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Mini-Boutique</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .header {
            background-color: #1a5f3f;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        .container {
            padding: 2rem;
            max-width: 800px;
            margin: 0 auto;
        }
        .shop-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            text-align: center;
            margin-bottom: 2rem;
        }
        .shop-avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 4px solid #1a5f3f;
            margin-bottom: 1rem;
            object-fit: cover;
        }
        h1 { margin: 0; color: #2d3436; }
        .category {
            color: #636e72;
            font-size: 1.1rem;
            margin-top: 0.5rem;
            display: inline-block;
            background: #dfe6e9;
            padding: 0.2rem 0.8rem;
            border-radius: 1rem;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 2rem;
        }
        .product-item {
            background: white;
            border: 1px solid #eee;
            border-radius: 0.5rem;
            padding: 1rem;
            text-align: center;
        }
        .product-placeholder {
            width: 100%;
            height: 100px;
            background: #eee;
            border-radius: 0.5rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
        }
        .btn-live {
            background-color: #e17055;
            color: white;
            border: none;
            padding: 0.8rem 1.5rem;
            border-radius: 2rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1rem;
            transition: transform 0.2s;
        }
        .btn-live:hover { transform: scale(1.05); }
        
        .btn-back {
            display: inline-block;
            margin-bottom: 1rem;
            color: #1a5f3f;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <h3 style="margin:0;">🥭 Mangoo Market</h3>
    </div>

    <div class="container">
        <a href="mangoo-local.html" class="btn-back">← Retour à la carte</a>

        <div class="shop-card">
            <img id="sAvatar" src="" class="shop-avatar">
            <h1 id="sName">Chargement...</h1>
            <div id="sCategory" class="category">...</div>
            <p style="margin-top: 1rem; color: #636e72;">
                Bienvenue dans ma boutique officielle sur Mangoo.
                Commandez directement ici ou appelez-moi !
            </p>

            <a href="#" id="btnLive" class="btn-live">
                📹 Rejoindre le Live Shopping
            </a>
        </div>

        <h2 style="color: #1a5f3f;">Produits en vedette</h2>
        <div class="products-grid">
            <!-- Fake Products -->
            <div class="product-item">
                <div class="product-placeholder">�</div>
                <h4>Produit A</h4>
                <p style="color: #e17055; font-weight: bold;">5 000 FCFA</p>
            </div>
            <div class="product-item">
                <div class="product-placeholder">👕</div>
                <h4>Produit B</h4>
                <p style="color: #e17055; font-weight: bold;">12 000 FCFA</p>
            </div>
            <div class="product-item">
                <div class="product-placeholder">🥑</div>
                <h4>Produit C</h4>
                <p style="color: #e17055; font-weight: bold;">1 500 FCFA</p>
            </div>
        </div>
    </div>

    <script>
        // Parse URL params
        const params = new URLSearchParams(window.location.search);
        const name = params.get('name') || "Boutique Inconnue";
        const category = params.get('category') || "Divers";
        const avatar = params.get('avatar') || "https://ui-avatars.com/api/?name=Mangoo&background=random";
        const live = params.get('live') === 'true';
        const shopSlug = params.get('shopSlug') || params.get('slug') || '';

        // Update UI
        document.title = `🛍️ ${name}`;
        document.getElementById('sName').innerText = name;
        document.getElementById('sCategory').innerText = category;
        document.getElementById('sAvatar').src = avatar;

        const btnLive = document.getElementById('btnLive');
        if (live) {
            const roomId = String((shopSlug || name || 'live-demo-123')).trim() || 'live-demo-123';
            const qs = new URLSearchParams();
            qs.set('role', 'client');
            qs.set('ui', 'simple');
            qs.set('roomId', roomId);
            if (shopSlug) qs.set('shopSlug', shopSlug);
            btnLive.href = `${window.location.origin}/live-shopping?${qs.toString()}`;
            btnLive.style.display = 'inline-flex';
        } else {
            btnLive.style.display = 'none';
        }
    </script>

</body>
</html>

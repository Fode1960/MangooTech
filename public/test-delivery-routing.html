<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Test Livraison (Routing OSRM) - MangooTech</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: #0b1220; color: #f3f4f6; }
    .wrap { display: grid; grid-template-columns: 360px 1fr; height: 100vh; }
    .panel { padding: 16px; border-right: 1px solid rgba(255,255,255,0.12); background: rgba(17,24,39,0.9); }
    .h { font-weight: 900; font-size: 16px; margin-bottom: 10px; }
    .muted { color: #9ca3af; font-size: 12px; line-height: 1.35; }
    label { display:block; font-size: 12px; color: #d1d5db; margin-top: 12px; margin-bottom: 6px; font-weight: 800; }
    input { width: 100%; box-sizing: border-box; padding: 10px 12px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.15); background: rgba(2,6,23,0.7); color: #fff; }
    button { width: 100%; margin-top: 12px; padding: 12px 12px; border-radius: 12px; border: none; background: #22c55e; color: #06210f; font-weight: 900; cursor: pointer; }
    button.secondary { background: rgba(255,255,255,0.10); color: #fff; border: 1px solid rgba(255,255,255,0.15); }
    .box { margin-top: 12px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.10); }
    #map { height: 100%; }
    .row { display:flex; gap: 8px; }
    .row > * { flex:1; }
    a { color: #93c5fd; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="panel">
      <div class="h">🚚 Test Livraison (sans Google)</div>
      <div class="muted">
        Cette page utilise votre backend MangooTech → <code>/api/routing/route</code> (OSRM).
        <br/>Elle prend <b>lat,lng</b> départ & arrivée et trace la route sur OpenStreetMap.
      </div>

      <div class="box" id="status">Chargement…</div>

      <label>Départ (lat,lng)</label>
      <input id="from" placeholder="ex: 4.051056,9.767869" />

      <label>Arrivée (lat,lng)</label>
      <input id="to" placeholder="ex: 4.052000,9.768000" />

      <div class="row">
        <button class="secondary" id="btnMe">Mettre départ = ma position</button>
        <button class="secondary" id="btnNear">Arrivée proche (+0.01)</button>
      </div>
      <div class="row">
        <button class="secondary" id="btnArriveB">Arrivée = ma position (B)</button>
        <button class="secondary" id="btnCreateOrder">Créer une commande (livraison = arrivée)</button>
      </div>
      <button id="btnRoute">Calculer l’itinéraire</button>

      <div class="row">
        <button class="secondary" id="btnVoice">Guidage vocal (démo)</button>
        <button class="secondary" id="btnStopVoice">Stop voix</button>
      </div>

      <div class="box" id="result">—</div>
      <div class="box" id="stepsBox" style="display:block; max-height: 220px; overflow:auto;">—</div>
      <div class="muted" style="margin-top:10px;">
        Si vous auto‑hébergez OSRM, mettez <code>OSRM_BASE_URL</code> côté serveur.
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin="" defer></script>
  <script>
    const state = {
      map: null,
      routeLine: null,
      fromMarker: null,
      toMarker: null,
      me: null,
    };

    function readMe() {
      try {
        const raw = localStorage.getItem('user_geolocation_consent');
        const consent = raw ? JSON.parse(raw) : null;
        const loc = consent?.locationData || consent?.location_data;
        const lat = Number(loc?.latitude);
        const lng = Number(loc?.longitude);
        if (!Number.isNaN(lat) && !Number.isNaN(lng)) return { lat, lng };
      } catch {}
      return null;
    }

    function setStatus(html) {
      document.getElementById('status').innerHTML = html;
    }

    function fmtLatLng(p) {
      return `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
    }

    function parseLatLng(str) {
      const txt = String(str || '');
      const nums = txt.match(/-?\d+(?:\.\d+)?/g) || [];
      if (nums.length < 2) return null;
      const lat = Number(nums[0]);
      const lng = Number(nums[1]);
      if (!Number.isFinite(lat) || !Number.isFinite(lng)) return null;
      if (lat < -90 || lat > 90 || lng < -180 || lng > 180) return null;
      return { lat, lng };
    }

    async function getCurrentPosition() {
      if (!('geolocation' in navigator)) throw new Error('Géolocalisation non supportée');
      return new Promise((resolve, reject) => {
        navigator.geolocation.getCurrentPosition(
          (pos) => resolve({
            lat: pos.coords.latitude,
            lng: pos.coords.longitude,
            accuracy: pos.coords.accuracy,
            timestamp: new Date().toISOString(),
          }),
          (err) => reject(err),
          { enableHighAccuracy: false, timeout: 9000, maximumAge: 120000 }
        );
      });
    }

    function fmtStepMeters(m) {
      const n = Number(m);
      if (!Number.isFinite(n)) return '';
      if (n < 900) return `${Math.round(n)} m`;
      return `${(n / 1000).toFixed(1)} km`;
    }

    function stepToFrench(step) {
      const dist = fmtStepMeters(step?.distance);
      const man = step?.maneuver || {};
      const type = String(man.type || '').toLowerCase();
      const mod = String(man.modifier || '').toLowerCase();
      const road = String(step?.name || '').trim();

      const modMap = {
        left: 'à gauche',
        right: 'à droite',
        'slight left': 'légèrement à gauche',
        'slight right': 'légèrement à droite',
        'sharp left': 'fortement à gauche',
        'sharp right': 'fortement à droite',
        straight: 'tout droit',
        uturn: 'demi-tour',
      };
      const dir = modMap[mod] || '';
      const on = road ? ` sur ${road}` : '';

      if (type === 'depart') return `Départ${on}.`;
      if (type === 'arrive') return `Arrivée.`;
      if (type === 'roundabout' || type === 'rotary') {
        const exit = Number(man.exit);
        const exitText = Number.isFinite(exit) ? ` prenez la ${exit}e sortie` : ' prenez une sortie';
        return `${dist ? 'Dans ' + dist + ',' : 'Maintenant,'} au rond-point,${exitText}${on}.`;
      }
      if (type === 'turn' || type === 'end of road' || type === 'fork' || type === 'merge' || type === 'on ramp' || type === 'off ramp' || type === 'continue' || type === 'new name') {
        if (dir) {
          return `${dist ? 'Dans ' + dist + ',' : 'Maintenant,'} tournez ${dir}${on}.`;
        }
      }

      if (road) return `${dist ? 'Dans ' + dist + ',' : ''} continuez${on}.`;
      return `${dist ? 'Dans ' + dist + ',' : ''} continuez.`;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) throw new Error('Synthèse vocale non supportée');
      const u = new SpeechSynthesisUtterance(String(text || ''));
      u.lang = 'fr-FR';
      u.rate = 1.0;
      u.pitch = 1.0;
      window.speechSynthesis.speak(u);
      return u;
    }

    function stopSpeech() {
      try { window.speechSynthesis.cancel(); } catch {}
    }

    function setMarker(kind, p) {
      const icon = L.divIcon({
        className: '',
        html: `<div style="background:${kind==='from' ? '#22c55e' : '#f59e0b'}; width:14px; height:14px; border-radius:50%; border:3px solid white; box-shadow:0 0 12px rgba(0,0,0,0.35);"></div>`,
        iconSize: [20, 20],
        iconAnchor: [10, 10]
      });
      if (kind === 'from') {
        if (state.fromMarker) state.map.removeLayer(state.fromMarker);
        state.fromMarker = L.marker([p.lat, p.lng], { icon }).addTo(state.map).bindPopup('Départ');
      } else {
        if (state.toMarker) state.map.removeLayer(state.toMarker);
        state.toMarker = L.marker([p.lat, p.lng], { icon }).addTo(state.map).bindPopup('Arrivée');
      }
    }

    async function drawRoute(from, to, opts) {
      document.getElementById('result').textContent = 'Calcul…';

      const overview = opts?.overview || 'simplified';
      const steps = opts?.steps ? '1' : '0';
      const url = `/api/routing/route?from=${encodeURIComponent(fmtLatLng(from))}&to=${encodeURIComponent(fmtLatLng(to))}&overview=${encodeURIComponent(overview)}&steps=${steps}`;
      const res = await fetch(url);
      const data = await res.json();
      if (!res.ok || !data?.success || !data?.geometry) {
        throw new Error(data?.error || 'Erreur routing');
      }

      const coords = data.geometry.coordinates.map(c => [c[1], c[0]]);
      if (state.routeLine) state.map.removeLayer(state.routeLine);
      state.routeLine = L.polyline(coords, { color: '#60a5fa', weight: 5, opacity: 0.9 }).addTo(state.map);
      state.map.fitBounds(state.routeLine.getBounds().pad(0.2));

      const km = typeof data.distance_m === 'number' ? (data.distance_m / 1000).toFixed(2) : '?';
      const min = typeof data.duration_s === 'number' ? Math.round(data.duration_s / 60) : '?';
      const source = data.source || data.requested_source || 'OSRM';
      const region = data.region_label || data.region || '';
      document.getElementById('result').innerHTML = `✅ ${km} km • ~${min} min<br><span style="color:#9ca3af; font-size:12px;">${region ? ('Région: ' + region + ' • ') : ''}Source: ${source}${data.fallback ? ' (fallback)' : ''}</span>`;
      return data;
    }

    function init() {
      state.me = readMe();
      const center = state.me ? [state.me.lat, state.me.lng] : [4.051056, 9.767869];

      state.map = L.map('map', { zoomControl: true, preferCanvas: true }).setView(center, 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        updateWhenIdle: true,
        updateWhenZooming: false,
        keepBuffer: 2,
      }).addTo(state.map);

      if (state.me) {
        setStatus(`✅ Position trouvée: <b>${fmtLatLng(state.me)}</b>`);
        document.getElementById('from').value = fmtLatLng(state.me);
      } else {
        setStatus('⚠️ Aucune position enregistrée trouvée (localStorage: user_geolocation_consent).');
      }

      document.getElementById('btnMe').onclick = () => {
        if (!state.me) return;
        document.getElementById('from').value = fmtLatLng(state.me);
      };

      document.getElementById('btnNear').onclick = () => {
        const from = parseLatLng(document.getElementById('from').value) || state.me;
        if (!from) return;
        const to = { lat: from.lat + 0.01, lng: from.lng + 0.01 };
        document.getElementById('to').value = fmtLatLng(to);
      };

      const btnArriveB = document.getElementById('btnArriveB');
      if (btnArriveB) {
        btnArriveB.onclick = async () => {
          try {
            btnArriveB.disabled = true;
            btnArriveB.textContent = 'GPS…';
            const p = await getCurrentPosition();
            document.getElementById('to').value = `${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
            btnArriveB.textContent = 'Arrivée = ma position (B)';
            btnArriveB.disabled = false;
          } catch {
            btnArriveB.textContent = 'Arrivée = ma position (B)';
            btnArriveB.disabled = false;
          }
        };
      }

      const btnCreateOrder = document.getElementById('btnCreateOrder');
      if (btnCreateOrder) {
        btnCreateOrder.onclick = async () => {
          try {
            const to = parseLatLng(document.getElementById('to').value);
            if (!to) {
              document.getElementById('result').textContent = '❌ Arrivée invalide.';
              return;
            }
            const userRaw = localStorage.getItem('mangoo-current-user');
            const user = userRaw ? JSON.parse(userRaw) : null;
            const userId = String(user?.id || user?.email || 'guest').trim();

            btnCreateOrder.disabled = true;
            btnCreateOrder.textContent = 'Création…';

            const res = await fetch('/api/orders', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                userId,
                note: 'Commande démo depuis Test Livraison',
                delivery: {
                  source: 'current',
                  capturedAt: new Date().toISOString(),
                  position: {
                    latitude: to.lat,
                    longitude: to.lng,
                  }
                }
              })
            });
            const data = await res.json();
            if (!res.ok || !data?.success) throw new Error(data?.error || 'Erreur création commande');
            document.getElementById('result').innerHTML = `✅ Commande créée: <b>${data.order.id}</b><br><span style="color:#9ca3af; font-size:12px;">Livraison capturée à ${to.lat.toFixed(6)},${to.lng.toFixed(6)}</span>`;
            btnCreateOrder.textContent = 'Créer une commande (livraison = arrivée)';
            btnCreateOrder.disabled = false;
          } catch (e) {
            btnCreateOrder.textContent = 'Créer une commande (livraison = arrivée)';
            btnCreateOrder.disabled = false;
            document.getElementById('result').textContent = `❌ ${e.message || e}`;
          }
        };
      }

      let lastSteps = [];
      const btnVoice = document.getElementById('btnVoice');
      const btnStopVoice = document.getElementById('btnStopVoice');
      if (btnStopVoice) btnStopVoice.onclick = () => stopSpeech();

      if (btnVoice) {
        btnVoice.onclick = async () => {
          try {
            stopSpeech();
            const from = parseLatLng(document.getElementById('from').value);
            const to = parseLatLng(document.getElementById('to').value);
            if (!from || !to) {
              document.getElementById('result').textContent = '❌ Entrez des coordonnées valides (lat,lng).';
              return;
            }
            btnVoice.disabled = true;
            btnVoice.textContent = 'Préparation…';

            const data = await drawRoute(from, to, { overview: 'full', steps: true });
            const legs = Array.isArray(data?.legs) ? data.legs : [];
            const stepsAll = legs.flatMap((l) => Array.isArray(l?.steps) ? l.steps : []);
            lastSteps = stepsAll;
            if (!lastSteps.length) throw new Error('Aucune instruction disponible');

            const lines = lastSteps.map(stepToFrench).filter(Boolean);
            const box = document.getElementById('stepsBox');
            if (box) box.innerHTML = lines.map((t) => `<div style="padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.08);">${t}</div>`).join('');

            speak('Démarrage du guidage.');
            for (const line of lines) {
              await new Promise((resolve) => {
                const u = speak(line);
                u.onend = () => resolve();
                u.onerror = () => resolve();
              });
            }
            btnVoice.textContent = 'Guidage vocal (démo)';
            btnVoice.disabled = false;
          } catch (e) {
            btnVoice.textContent = 'Guidage vocal (démo)';
            btnVoice.disabled = false;
            document.getElementById('result').textContent = `❌ ${e.message || e}`;
          }
        };
      }

      document.getElementById('btnRoute').onclick = async () => {
        try {
          const from = parseLatLng(document.getElementById('from').value);
          const to = parseLatLng(document.getElementById('to').value);
          if (!from || !to) {
            document.getElementById('result').textContent = '❌ Entrez des coordonnées valides (lat,lng).';
            return;
          }
          setMarker('from', from);
          setMarker('to', to);
          const btn = document.getElementById('btnRoute');
          btn.disabled = true;
          btn.textContent = 'Calcul…';
          await drawRoute(from, to, { overview: 'simplified', steps: false });
          btn.textContent = 'Calculer l’itinéraire';
          btn.disabled = false;
        } catch (e) {
          const btn = document.getElementById('btnRoute');
          btn.textContent = 'Calculer l’itinéraire';
          btn.disabled = false;
          document.getElementById('result').textContent = `❌ ${e.message || e}`;
        }
      };
    }

    window.addEventListener('load', () => {
      if (typeof L === 'undefined') {
        setStatus('❌ Leaflet non chargé. Vérifiez votre connexion.');
        return;
      }
      init();
    });
  </script>
</body>
</html>

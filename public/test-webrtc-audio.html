<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appel Audio - Mangoo Connect+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mangoo: { 500: '#1a5f3f', 600: '#144a31' }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .hidden { display: none !important; }
        .visualizer-bar {
            width: 6px;
            background: #66bb6a;
            border-radius: 99px;
            animation: sound 0s -0.4s linear infinite alternate;
        }
        @keyframes sound {
            0% { height: 10px; opacity: 0.35; }
            100% { height: 60px; opacity: 1; }
        }
        .visualizer-bar:nth-child(1)  { animation-duration: 474ms; }
        .visualizer-bar:nth-child(2)  { animation-duration: 433ms; }
        .visualizer-bar:nth-child(3)  { animation-duration: 407ms; }
        .visualizer-bar:nth-child(4)  { animation-duration: 458ms; }
        .visualizer-bar:nth-child(5)  { animation-duration: 400ms; }
        .visualizer-bar:nth-child(6)  { animation-duration: 427ms; }
        .visualizer-bar:nth-child(7)  { animation-duration: 441ms; }
        .visualizer-bar:nth-child(8)  { animation-duration: 419ms; }
        .visualizer-bar:nth-child(9)  { animation-duration: 487ms; }
        .visualizer-bar:nth-child(10) { animation-duration: 442ms; }
        
        /* Simulated Live Camera Movement */
        @keyframes subtle-move {
            0% { transform: scale(1.05) translate(0, 0); }
            25% { transform: scale(1.08) translate(1%, 1%); }
            50% { transform: scale(1.05) translate(0, 2%); }
            75% { transform: scale(1.08) translate(-1%, 1%); }
            100% { transform: scale(1.05) translate(0, 0); }
        }
        .simulated-live {
            animation: subtle-move 20s ease-in-out infinite;
        }
    </style>
</head>
<body class="bg-[#f6faf3] dark:bg-[#102814] text-gray-800 dark:text-white h-screen flex flex-col items-center justify-between transition-colors duration-300">

    <!-- Header info -->
    <div class="mt-10 text-center px-6 w-full max-w-xl">
        <div class="rounded-3xl shadow-xl overflow-hidden border border-[#cfe0c8] dark:border-[#2e5d34]">
            <div class="bg-[#1b5e20] text-white px-6 py-5">
                <div class="text-xs uppercase tracking-widest opacity-95 mb-1" id="callTypeLabel">Appel Audio Mangoo</div>
                <h1 class="text-3xl font-extrabold" id="calleeName">Correspondant</h1>
                <div class="mt-2 text-xl font-mono text-white/95" id="timer">Connexion...</div>
            </div>
        </div>
    </div>

    <!-- Avatar & Visualizer -->
    <div class="relative flex flex-col items-center justify-center w-full flex-1">
        <!-- Pulse Rings -->
        <div class="absolute w-64 h-64 bg-[#1b5e20]/20 rounded-full animate-ping-slow pointer-events-none"></div>
        <div class="absolute w-48 h-48 bg-[#1b5e20]/30 rounded-full animate-pulse-slow pointer-events-none"></div>
        
        <!-- Avatar -->
        <div class="relative z-10 w-32 h-32 rounded-full border-4 border-[#eef6ea] dark:border-[#2e5d34] shadow-2xl overflow-hidden bg-gray-300">
            <img id="avatarImg" src="https://ui-avatars.com/api/?name=Mangoo&background=1a5f3f&color=fff" class="w-full h-full object-cover">
        </div>

        <!-- Visualizer -->
        <div class="flex items-center justify-center gap-1 h-16 mt-8" id="visualizer">
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
        </div>
        <div class="text-sm text-[#66bb6a] mt-4" id="statusText">Sonnerie en cours...</div>
    </div>

    <!-- Controls -->
    <div class="w-full max-w-sm px-8 pb-12">
        <div class="bg-white/95 dark:bg-[#17331c] rounded-3xl shadow-xl p-6 flex justify-between items-center border border-[#cfe0c8] dark:border-[#2e5d34]">
            
            <!-- Mute -->
            <button class="p-4 rounded-full bg-[#eef6ea] dark:bg-[#17331c] text-gray-600 dark:text-white hover:bg-[#cfe0c8] dark:hover:bg-[#2e5d34] transition" onclick="toggleMute(this)">
                <i class="fas fa-microphone text-xl"></i>
            </button>
            
            <!-- Video Switch (Upgrading to Video allowed) -->
            <button class="p-4 rounded-full bg-[#eef6ea] dark:bg-[#17331c] text-gray-600 dark:text-white hover:bg-[#cfe0c8] dark:hover:bg-[#2e5d34] transition" id="audioPageVideoBtn" onclick="toggleVideo(this)" title="Voir produit (vidéo)">
                <div class="flex flex-col items-center">
                    <i class="fas fa-video text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">Voir produit</span>
                </div>
            </button>

            <!-- Hangup -->
            <button class="w-16 h-16 rounded-full bg-red-500 text-white shadow-lg shadow-red-500/40 flex items-center justify-center transform hover:scale-105 transition" onclick="endCall()">
                <i class="fas fa-phone-slash text-2xl"></i>
            </button>

            <!-- Speaker -->
            <button class="p-4 rounded-full bg-[#eef6ea] dark:bg-[#17331c] text-gray-600 dark:text-white hover:bg-[#cfe0c8] dark:hover:bg-[#2e5d34] transition" onclick="toggleSpeaker(this)">
                <i class="fas fa-volume-up text-xl"></i>
            </button>
        </div>
    </div>
    
    <!-- Video Modal (Hidden by default) -->
    <div id="videoModal" class="fixed inset-0 bg-black z-50 hidden flex flex-col">
        <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
            <!-- Simulated Remote Video (Product) -->
            <img id="productVideoFeed" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&q=80" class="w-full h-full object-cover opacity-80 simulated-live" alt="Flux vidéo produit">
            
            <!-- Remote Label -->
            <div class="absolute top-4 left-4 flex items-center gap-2">
                <div class="bg-red-600 text-white px-2 py-1 rounded text-xs font-bold animate-pulse">🔴 EN DIRECT</div>
                <div class="bg-black/50 text-white px-2 py-1 rounded text-xs backdrop-blur-sm" id="productLabelBadge">📹 Caméra Vendeur (Produit)</div>
            </div>
            
            <!-- Local Video (User) -->
            <div class="absolute bottom-24 right-4 w-32 h-48 bg-[#17331c] rounded-xl border-2 border-[#eef6ea] overflow-hidden shadow-lg">
                <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <div class="absolute top-2 left-2 bg-black/50 text-white px-1.5 py-0.5 rounded text-[10px] backdrop-blur-sm">👤 Vous</div>
                <div class="absolute inset-0 flex items-center justify-center text-white text-xs pointer-events-none" id="noCamIcon">
                    <!-- Icon shown only if no video stream -->
                </div>
            </div>
        </div>
        
        <!-- Video Controls -->
        <div class="bg-[#102814] p-6 flex justify-center gap-6">
             <button class="p-4 rounded-full bg-[#17331c] text-white hover:bg-[#2e5d34] transition" onclick="toggleMute(this)">
                <i class="fas fa-microphone text-xl"></i>
            </button>
            <button class="w-16 h-16 rounded-full bg-red-500 text-white shadow-lg flex items-center justify-center hover:bg-red-600 transition" onclick="endCall()">
                <i class="fas fa-phone-slash text-2xl"></i>
            </button>
            <button class="p-4 rounded-full bg-white text-[#1b5e20] hover:bg-[#eef6ea] transition" onclick="toggleVideo(this)">
                <i class="fas fa-video text-xl"></i>
            </button>
        </div>
    </div>

    <script>
        // Init Params
        const params = new URLSearchParams(window.location.search);
        const name = params.get('callee') || 'Service Client';
        const theme = params.get('theme');
        const mode = params.get('mode');
        const autoConnect = params.get('autoConnect') === 'true';
        const productNameParam = params.get('productName');
        const productImgParam = params.get('productImg');

        // Apply Theme
        if (theme === 'dark') document.documentElement.classList.add('dark');

        // Set UI
        document.getElementById('calleeName').innerText = name;
        document.getElementById('avatarImg').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff`;

        function applyProductPreview() {
            try {
                const img = document.getElementById('productVideoFeed');
                if (!img) return;

                let productName = String(productNameParam || '').trim();
                let productImg = String(productImgParam || '').trim();

                try {
                    if ((!productName || !productImg) && localStorage) {
                        const raw = localStorage.getItem('lp_last_product')
                        if (raw) {
                            const p = JSON.parse(raw)
                            if (!productName) productName = String(p?.name || '').trim()
                            if (!productImg) productImg = String(p?.img || '').trim()
                        }
                    }
                } catch {
                }

                if (productImg) img.src = productImg;
                img.alt = productName ? `Produit: ${productName}` : 'Produit';

                const badge = document.getElementById('productLabelBadge');
                if (badge) badge.textContent = productName ? `📦 ${productName}` : '📹 Caméra Vendeur (Produit)'
            } catch {
            }
        }

        // Check for Video Mode
        if (mode === 'video') {
            setTimeout(() => {
                const btn = document.getElementById('audioPageVideoBtn');
                if(btn) toggleVideo(btn);
            }, 100);
        } 
        // Note: We keep the button visible in Audio mode to allow upgrading to Video call mid-stream
        // as per logical request. No 'else' block needed to hide it.

        // Timer Logic
        let seconds = 0;
        let callActive = false;
        let isProcessing = false;
        let timerInterval = null;
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('statusText');
        const visualizer = document.getElementById('visualizer');

        // Ringtone via Web Audio API
        let ringtoneCtx = null;
        let ringtoneInterval = null;
        let callConnected = false;

        function startRinging() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                ringtoneCtx = new AudioCtx();
                let beep = true;
                // Attendre la reprise du contexte avant de jouer
                const doResume = ringtoneCtx.state === 'suspended' ? ringtoneCtx.resume() : Promise.resolve();
                doResume.then(() => {
                    if (!ringtoneCtx) return;
                    ringtoneInterval = setInterval(() => {
                        try {
                            if (callConnected) { stopRinging(); return; }
                            if (!ringtoneCtx) { clearInterval(ringtoneInterval); return; }
                            if (ringtoneCtx.state === 'suspended') { ringtoneCtx.resume(); return; }
                            const osc = ringtoneCtx.createOscillator();
                            const gain = ringtoneCtx.createGain();
                            osc.connect(gain);
                            gain.connect(ringtoneCtx.destination);
                            osc.type = 'sine';
                            osc.frequency.value = beep ? 800 : 1000;
                            gain.gain.value = 0.3;
                            gain.gain.exponentialRampToValueAtTime(0.001, ringtoneCtx.currentTime + 0.4);
                            osc.start(ringtoneCtx.currentTime);
                            osc.stop(ringtoneCtx.currentTime + 0.4);
                            beep = !beep;
                        } catch {}
                    }, 800);
                }).catch(() => {});
            } catch {}
        }

        function stopRinging() {
            try {
                if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
                if (ringtoneCtx) {
                    try { ringtoneCtx.close(); } catch {}
                    ringtoneCtx = null;
                }
            } catch {}
        }

        function connectCall() {
            if (callConnected) return;
            callConnected = true;
            stopRinging();
            statusEl.innerText = "Appel en cours";
            timerEl.innerText = "00:00";
            callActive = true;
            startTimer();
        }

        function terminateCall() {
            stopRinging();
            callActive = false;
            callConnected = false;
            statusEl.innerText = "Appel terminé";
            timerEl.innerText = "Fin";
            if (visualizer) visualizer.style.opacity = '0';
            try {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
            } catch {}
            // Stop camera if active
            try {
                const localVideo = document.getElementById('localVideo');
                if (localVideo && localVideo.srcObject) {
                    localVideo.srcObject.getTracks().forEach(t => t.stop());
                    localVideo.srcObject = null;
                }
                const videoModal = document.getElementById('videoModal');
                if (videoModal) videoModal.classList.add('hidden');
            } catch {}
            try { if (navigator && navigator.vibrate) navigator.vibrate(0); } catch {}
        }

        // Start ringing on page load (sauf si autoConnect = appel déjà accepté)
        if (autoConnect) {
            console.log('[Call] autoConnect=true, connexion directe sans sonnerie');
            connectCall();
        } else {
            startRinging();
        }

        // Listen for messages from parent (mangoo-local.html)
        window.addEventListener('message', function(event) {
            try {
                const data = typeof event.data === 'string' ? event.data : event.data;
                if (data && data.type === 'call_accepted') {
                    console.log('[Call] call_accepted recu, connexion...');
                    if (!callConnected) connectCall();
                } else if (data && data.type === 'call_ended') {
                    console.log('[Call] call_ended recu, terminaison...');
                    terminateCall();
                    setTimeout(() => {
                        try { window.parent.postMessage('end_call', '*'); } catch {}
                    }, 350);
                } else if (data === 'call_accepted') {
                    if (!callConnected) connectCall();
                } else if (data === 'call_ended') {
                    terminateCall();
                }
            } catch {}
        });

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if(!callActive) return;
                seconds++;
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                timerEl.innerText = `${m}:${s}`;
            }, 1000);
        }

        function toggleMute(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-microphone')) {
                icon.className = 'fas fa-microphone-slash text-xl';
                if(btn.classList.contains('bg-[#17331c]')) {
                    btn.classList.remove('bg-[#17331c]', 'text-white');
                    btn.classList.add('bg-red-500', 'text-white');
                } else {
                    btn.classList.add('text-red-500');
                }
            } else {
                icon.className = 'fas fa-microphone text-xl';
                if(btn.classList.contains('bg-red-500')) {
                    btn.classList.remove('bg-red-500', 'text-white');
                    btn.classList.add('bg-[#17331c]', 'text-white');
                } else {
                    btn.classList.remove('text-red-500');
                }
            }
        }

        function toggleSpeaker(btn) {
            btn.classList.toggle('bg-[#eef6ea]');
            btn.classList.toggle('dark:bg-[#2e5d34]');
            btn.classList.toggle('text-[#1b5e20]');
            btn.classList.toggle('dark:text-white');
        }

        async function toggleVideo(btn) {
            if (isProcessing) return;

            const videoModal = document.getElementById('videoModal');
            const statusEl = document.getElementById('statusText');
            const label = document.getElementById('callTypeLabel');
            const primaryBtn = document.getElementById('audioPageVideoBtn') || btn;
            const noCamIcon = document.getElementById('noCamIcon');

            if (!videoModal) return;

            try { applyProductPreview(); } catch {}

            if (!videoModal.classList.contains('hidden')) {
                videoModal.classList.add('hidden');
                if(label) label.innerText = "Appel Audio Mangoo";

                if (noCamIcon) noCamIcon.innerHTML = '';

                const localVideo = document.getElementById('localVideo');
                if (localVideo && localVideo.srcObject) {
                    const tracks = localVideo.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    localVideo.srcObject = null;
                }
                return;
            }

            isProcessing = true;

            let originalStatusText = "Appel en cours";
            if (statusEl) {
                originalStatusText = String(statusEl.innerText || originalStatusText);
                statusEl.innerText = "Ouverture du produit...";
                statusEl.classList.add('animate-pulse', 'text-mangoo-500');
            }

            if (primaryBtn) {
                if (!primaryBtn.dataset.originalClass) primaryBtn.dataset.originalClass = primaryBtn.className;
                primaryBtn.className = primaryBtn.dataset.originalClass
                    .replace(/\bbg-\[#eef6ea\]\b/g, 'bg-[#1b5e20]')
                    .replace(/\bdark:bg-\[#17331c\]\b/g, 'dark:bg-[#17331c]')
                    .replace(/\btext-gray-600\b/g, 'text-white')
                    .replace(/\bdark:text-white\b/g, 'dark:text-white');
                const icon = primaryBtn.querySelector('i');
                if (icon) icon.className = 'fas fa-spinner fa-spin text-xl mb-1';
            }

            videoModal.classList.remove('hidden');
            if(label) label.innerText = "Appel Vidéo Mangoo";

            if (noCamIcon) {
                noCamIcon.innerHTML = '<div class="text-center px-2"><div class="text-2xl mb-1">⏳</div><div class="font-bold">Activation caméra…</div><div class="text-[10px] opacity-80">Autorisez la caméra si demandé</div></div>';
            }

            try {
                const localVideo = document.getElementById('localVideo');
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    if (localVideo) {
                        localVideo.srcObject = stream;
                        try { await localVideo.play(); } catch {}
                    }
                    if (noCamIcon) noCamIcon.innerHTML = '';
                } else {
                    if (noCamIcon) noCamIcon.innerHTML = '<div class="text-center px-2"><div class="text-2xl mb-1">🚫</div><div class="font-bold">Caméra indisponible</div><div class="text-[10px] opacity-80">Navigateur non supporté</div></div>';
                }
            } catch (err) {
                if (noCamIcon) noCamIcon.innerHTML = '<div class="text-center px-2"><div class="text-2xl mb-1">🚫</div><div class="font-bold">Caméra non autorisée</div><div class="text-[10px] opacity-80">Vous pouvez continuer en audio</div></div>';
            } finally {
                isProcessing = false;
                if (statusEl) {
                    statusEl.innerText = originalStatusText;
                    statusEl.classList.remove('animate-pulse', 'text-mangoo-500');
                }
                if (primaryBtn && primaryBtn.dataset.originalClass) {
                    primaryBtn.className = primaryBtn.dataset.originalClass;
                    const icon = primaryBtn.querySelector('i');
                    if (icon) icon.className = 'fas fa-video text-xl mb-1';
                }
            }
        }

        function endCall() {
            console.log('[Call] endCall() declenche dans iframe');
            callActive = false;
            try { statusEl.innerText = "Appel terminé"; } catch {}
            try { timerEl.innerText = "Fin"; } catch {}
            try { if (visualizer) visualizer.style.opacity = '0'; } catch {}

            try {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
            } catch {
            }
            
            try {
                const hangupBtns = document.querySelectorAll('button[onclick="endCall()"]');
                hangupBtns.forEach(btn => {
                    btn.disabled = true;
                    btn.style.backgroundColor = '#991b1b';
                    btn.style.cursor = 'not-allowed';
                });
                const otherBtns = document.querySelectorAll('button:not([onclick="endCall()"])');
                otherBtns.forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.55';
                    btn.style.cursor = 'not-allowed';
                });
            } catch {
            }
            
            // Stop camera if active
            const localVideo = document.getElementById('localVideo');
            if (localVideo && localVideo.srcObject) {
                const tracks = localVideo.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                localVideo.srcObject = null;
            }

            try {
                const videoModal = document.getElementById('videoModal');
                if (videoModal) videoModal.classList.add('hidden');
            } catch {
            }

            try { if (navigator && navigator.vibrate) navigator.vibrate(0); } catch {}

            setTimeout(() => {
                // Signaler au parent (mangoo-local.html) de fermer l'overlay
                try {
                    console.log('[Call] iframe envoie postMessage end_call au parent');
                    window.parent.postMessage('end_call', '*');
                } catch(e) { console.error('[Call] Erreur postMessage end_call:', e); }
                // NE PAS appeler window.close(), history.back() ou location.assign() !
                // Ces appels font disparaitre la page parente entiere.
            }, 350);
        }
    </script>
</body>
</html>

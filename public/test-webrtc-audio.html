        // Demande la camera en arriere-plan au moment de l'appel (geste utilisateur)
        // ⚠️ Sur Edge, le stream prewarm peut devenir stale. _startCameraBackground()
        //    obtient toujours un stream frais et ignore celui-ci.
        async function _prewarmCamera() {
            try {
                // Ne pas reutiliser un ancien stream
                if (videoStream) {
                    videoStream.getTracks().forEach(t => { try { t.stop(); } catch {} });
                    videoStream = null;
                }
                _prewarmPromise = navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                videoStream = await _prewarmPromise;
                _prewarmPromise = null;
                console.log('[WebRTC] Camera prechauffee (stream pret), tracks=' + videoStream.getVideoTracks().length);
            } catch(e) {
                console.warn('[WebRTC] Camera prewarm echoue: ' + (e.message || e));
                _prewarmPromise = null;
                videoStream = null;
            }
        }

        // Demarre la camera en arriere-plan
        // ⚠️ getUserMedia appele EN PREMIER car la fenetre de geste utilisateur est courte
        async function _startCameraBackground() {
            console.log('[WebRTC] Camera: DEMARRAGE');
            
            // === ETAPE 1 : getUserMedia IMMEDIATEMENT ===
            // (doit etre dans la fenetre de geste utilisateur ~1s)
            let stream;
            try {
                // Si la camera tourne deja, skip
                if (videoStream) {
                    const live = videoStream.getVideoTracks().filter(t => t.readyState === 'live');
                    if (live.length > 0) {
                        console.log('[WebRTC] Camera: deja active, skip');
                        _updateLocalVideo();
                        return;
                    }
                }
                
                console.log('[WebRTC] Camera: getUserMedia...');
                stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                console.log('[WebRTC] Camera: OK, ' + stream.getVideoTracks().length + ' piste(s)');
            } catch(e) {
                console.error('[WebRTC] Camera: ERREUR', e.name, e.message);
                const noCamIcon = document.getElementById('noCamIcon');
                if (noCamIcon) {
                    console.log('[WebRTC] Camera: affichage erreur noCamIcon, type=' + e.name);
                    noCamIcon.classList.remove('pointer-events-none');
                    noCamIcon.style.pointerEvents = 'auto';
                    noCamIcon.style.cursor = 'pointer';
                    noCamIcon.style.zIndex = '999';
                    noCamIcon.onclick = function(ev) {
                        console.log('[WebRTC] CLIC retry camera !');
                        ev.stopPropagation();
                        ev.preventDefault();
                        noCamIcon.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:rgba(0,0,0,0.75);border-radius:12px;"><div style="font-size:1.5rem;">⏳</div></div>';
                        noCamIcon.style.pointerEvents = 'none';
                        _startCameraBackground();
                    };
                    if (e.name === 'NotAllowedError') {
                        noCamIcon.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;width:100%;height:100%;background:rgba(0,0,0,0.75);border-radius:12px;cursor:pointer;box-sizing:border-box;animation:camPulse 2s infinite;"><div style="font-size:1.2rem;">🚫</div><div style="font-weight:bold;font-size:11px;text-align:center;color:white;">Caméra refusée</div><div style="font-size:9px;text-align:center;color:#ccc;">Tapotez</div></div>';
                    } else if (e.name === 'NotReadableError') {
                        noCamIcon.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;width:100%;height:100%;background:rgba(0,0,0,0.75);border-radius:12px;cursor:pointer;box-sizing:border-box;animation:camPulse 2s infinite;"><div style="font-size:1.2rem;">🔒</div><div style="font-weight:bold;font-size:11px;text-align:center;color:white;">Caméra occupée</div><div style="font-size:9px;text-align:center;color:#ccc;">Tapotez</div></div>';
                    } else {
                        noCamIcon.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px;width:100%;height:100%;background:rgba(0,0,0,0.75);border-radius:12px;cursor:pointer;box-sizing:border-box;animation:camPulse 2s infinite;"><div style="font-size:1.2rem;">⚠️</div><div style="font-weight:bold;font-size:10px;text-align:center;color:white;">' + (e.message || 'Erreur') + '</div><div style="font-size:9px;text-align:center;color:#ccc;">Tapotez</div></div>';
                    }
                }
                return;
            }
            
            // === ETAPE 1.5 : Toujours afficher le self-view "Vous" ===
            // Le self-view est independant du PC WebRTC — il doit s'afficher meme sans connexion etablie
            if (videoStream && videoStream !== stream) {
                videoStream.getTracks().forEach(t => { try { t.stop(); } catch {} });
            }
            videoStream = stream;
            _updateLocalVideo();
            console.log('[WebRTC] Camera: self-view affiche');
            
            // === ETAPE 2 : Attacher les pistes au PC (best-effort) ===
            try {
                if (!pc || pc.connectionState === 'closed' || pc.connectionState === 'failed') {
                    console.warn('[WebRTC] Camera: PC non disponible, self-view uniquement');
                    return;
                }
                
                // Attendre que le PC soit stable (max 3s)
                if (pc.signalingState !== 'stable') {
                    console.log('[WebRTC] Camera: PC pas stable (' + pc.signalingState + '), attente...');
                    let waited = 0;
                    while (pc.signalingState !== 'stable' && waited < 3000) {
                        await new Promise(r => setTimeout(r, 100));
                        waited += 100;
                    }
                    if (pc.signalingState !== 'stable') {
                        console.warn('[WebRTC] Camera: PC toujours pas stable, self-view uniquement');
                        return;
                    }
                }
                
                // Ajouter les pistes au PC
                const existingIds = new Set(pc.getSenders().map(s => s.track?.id).filter(Boolean));
                let added = 0;
                for (const track of videoStream.getVideoTracks()) {
                    if (!existingIds.has(track.id)) {
                        pc.addTrack(track, videoStream);
                        added++;
                    }
                }
                console.log('[WebRTC] Camera: ' + added + ' piste(s) ajoutee(s) au PC');
                
            } catch(e) {
                console.error('[WebRTC] Camera: erreur attachement PC (self-view preserve):', e);
                // Ne pas liberer le stream — le self-view fonctionne deja
            }
        }
        
        // Met a jour localVideo avec le stream courant + nettoie noCamIcon
        function _updateLocalVideo() {
            const localVideo = document.getElementById('localVideo');
            const noCamIcon = document.getElementById('noCamIcon');
            if (localVideo && videoStream && localVideo.srcObject !== videoStream) {
                localVideo.srcObject = videoStream;
                localVideo.muted = true;
                try { localVideo.play(); } catch {}
            }
            if (noCamIcon) {
                noCamIcon.innerHTML = '';
                noCamIcon.style.pointerEvents = 'none';
                noCamIcon.style.cursor = 'default';
                noCamIcon.onclick = null;
            }
        }

        async function toggleVideo(btn) {
            if (isProcessing) return;

            const videoModal = document.getElementById('videoModal');
            const statusEl = document.getElementById('statusText');
            const label = document.getElementById('callTypeLabel');
            const primaryBtn = document.getElementById('audioPageVideoBtn') || btn;
            const noCamIcon = document.getElementById('noCamIcon');

            if (!videoModal) return;

            const isActivating = videoModal.classList.contains('hidden');
            
            // Si activation, toujours afficher le selecteur (meme sans produit)
            // pour eviter de tomber sur l'ancien flux camera avec un produit fallback
            if (isActivating) {
                const hasProducts = window._availableProducts && window._availableProducts.length > 0;
                console.log('[WebRTC] toggleVideo: activation, ' + (hasProducts ? window._availableProducts.length + ' produit(s) dispo' : 'aucun produit'));
                showProductPicker();
                // NE PAS demarrer la camera ici : le modal video n'est pas encore ouvert.
                // Sur Edge, un <video> dans un conteneur display:none ne se rend pas.
                // La camera sera demarree dans openVideoModalForProduct() APRES ouverture du modal.
                return;
            }
            
            try { applyProductPreview(); } catch {}

            // Partager le produit uniquement a l'ACTIVATION (pas a la desactivation)
            if (isActivating) {
                try {
                    let productName = String(productNameParam || '').trim();
                    let productImg = String(productImgParam || '').trim();
                    console.log('[WebRTC] Debug produit: URL name="' + productName + '" img="' + productImg + '" localStorage=' + (typeof localStorage !== 'undefined'));
                    if ((!productName || !productImg) && typeof localStorage !== 'undefined') {
                        try {
                            const raw = localStorage.getItem('lp_last_product');
                            console.log('[WebRTC] Debug localStorage lp_last_product=' + (raw ? ('present (' + raw.length + ' chars)') : 'null'));
                            if (raw) {
                                const p = JSON.parse(raw);
                                if (!productName) productName = String(p?.name || '').trim();
                                if (!productImg) productImg = String(p?.img || '').trim();
                                console.log('[WebRTC] Debug produit depuis localStorage: name="' + productName + '" img="' + productImg + '"');
                            }
                        } catch(lsErr) { console.error('[WebRTC] Debug localStorage error:', lsErr); }
                    }
                    // Fallback: produit recu du parent (mangoo-local.html) via postMessage
                    if ((!productName || !productImg) && window._callProduct) {
                        productName = String(window._callProduct.name || '').trim();
                        productImg = String(window._callProduct.img || '').trim();
                        console.log('[WebRTC] Debug produit depuis window._callProduct: name="' + productName + '" img="' + productImg + '"');
                    }
                    if (productName || productImg) {
                        window.parent.postMessage({
                            type: 'share-product',
                            roomId: roomId,
                            product: { name: productName, img: productImg }
                        }, '*');
                        console.log('[WebRTC] Produit partage: ' + productName);
                    } else {
                        console.warn('[WebRTC] Produit NON partage: name et img vides');
                    }
                } catch(e) { console.error('[WebRTC] Erreur partage produit:', e); }
            }

            if (!videoModal.classList.contains('hidden')) {
                // === DESACTIVER LA VIDEO ===
                videoModal.classList.add('hidden');
                videoModal.style.display = 'none';
                if(label) label.innerText = "Appel Audio Mangoo";

                if (noCamIcon) noCamIcon.innerHTML = '';

                // Retirer les pistes video du RTCPeerConnection
                if (pc && videoStream) {
                    const senders = pc.getSenders();
                    for (const sender of senders) {
                        if (sender.track && sender.track.kind === 'video') {
                            pc.removeTrack(sender);
                            console.log('[WebRTC] Piste video retiree du PC');
                        }
                    }
                    // S'assurer que l'audio est toujours actif après retrait vidéo
                    if (localStream) {
                        localStream.getAudioTracks().forEach(t => { t.enabled = true; });
                    }
                    if (remoteAudio && remoteAudio.srcObject) {
                        remoteAudio.muted = false;
                        remoteAudio.volume = 1.0;
                        remoteAudio.play().catch(() => {});
                    }
                }

                // Arreter les pistes video locales
                const localVideo = document.getElementById('localVideo');
                if (localVideo && localVideo.srcObject) {
                    const tracks = localVideo.srcObject.getTracks();
                    tracks.forEach(track => track.stop());
                    localVideo.srcObject = null;
                }
                if (videoStream) {
                    videoStream.getTracks().forEach(t => t.stop());
                    videoStream = null;
                }
                return;
            }

            // === ACTIVER LA VIDEO ===
            isProcessing = true;

            let originalStatusText = "Appel en cours";
            if (statusEl) {
                originalStatusText = String(statusEl.innerText || originalStatusText);
                statusEl.innerText = "Ouverture du produit...";
                statusEl.classList.add('animate-pulse', 'text-mangoo-500');
            }

            if (primaryBtn) {
                if (!primaryBtn.dataset.originalClass) primaryBtn.dataset.originalClass = primaryBtn.className;
                primaryBtn.className = primaryBtn.dataset.originalClass
                    .replace(/\bbg-\[#eef6ea\]\b/g, 'bg-[#1b5e20]')
                    .replace(/\bdark:bg-\[#17331c\]\b/g, 'dark:bg-[#17331c]')
                    .replace(/\btext-gray-600\b/g, 'text-white')
                    .replace(/\bdark:text-white\b/g, 'dark:text-white');
                const icon = primaryBtn.querySelector('i');
                if (icon) icon.className = 'fas fa-spinner fa-spin text-xl mb-1';
            }

            videoModal.classList.remove('hidden');
            videoModal.style.display = 'flex';
            if(label) label.innerText = "Appel Vidéo Mangoo";

            if (noCamIcon) {
                noCamIcon.innerHTML = '<div class="text-center px-2"><div class="text-2xl mb-1">⏳</div><div class="font-bold">Activation caméra…</div><div class="text-[10px] opacity-80">Autorisez la caméra si demandé</div></div>';
            }

            try {
                const localVideo = document.getElementById('localVideo');
                if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    // Attendre que le PC soit en état stable avant d'ajouter des pistes
                    if (pc && pc.signalingState !== 'stable') {
                        console.log('[WebRTC] PC pas stable (' + pc.signalingState + '), attente...');
                        // Forcer le retour à stable si bloqué
                        try {
                            if (pc.signalingState === 'have-local-offer' && pc.localDescription) {
                                console.log('[WebRTC] PC bloqué en have-local-offer, tentative de restauration');
                            }
                        } catch {}
                        // Attendre jusqu'à 3 secondes que le PC redevienne stable
                        let waited = 0;
                        while (pc.signalingState !== 'stable' && waited < 3000) {
                            await new Promise(r => setTimeout(r, 100));
                            waited += 100;
                        }
                        if (pc.signalingState !== 'stable') {
                            console.warn('[WebRTC] PC toujours pas stable apres attente: ' + pc.signalingState);
                        }
                    }

                    // NE PAS recréer getUserMedia pour l'audio — on garde le stream existant intact
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    videoStream = stream;
                    if (localVideo) {
                        localVideo.srcObject = stream;
                        localVideo.muted = true;
                        try { await localVideo.play(); } catch {}
                    }
                    if (noCamIcon) noCamIcon.innerHTML = '';

                    // REACQUERIR l'audio SYSTEMATIQUEMENT apres getUserMedia(video)
                    // Bug Chrome/Windows : ouvrir la camera tue le micro meme avec audio:false
                    // Et parfois readyState reste 'live' mais la piste ne transmet plus rien
                    if (localStream && pc && pc.connectionState !== 'closed') {
                        const audioState = localStream.getAudioTracks().map(t => t.id + ':' + t.readyState + ':enabled=' + t.enabled).join(', ');
                        console.log('[WebRTC] Audio local avant reacquisition: ' + audioState);
                        try {
                            const recoveryStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                            const newTrack = recoveryStream.getAudioTracks()[0];
                            if (newTrack) {
                                console.log('[WebRTC] Nouveau micro obtenu: ' + newTrack.id + ' label=' + newTrack.label);
                                const senders = pc.getSenders();
                                const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                                if (audioSender) {
                                    await audioSender.replaceTrack(newTrack);
                                    console.log('[WebRTC] Audio remplace via replaceTrack');
                                } else {
                                    pc.addTrack(newTrack, recoveryStream);
                                    console.log('[WebRTC] Audio ajoute via addTrack (sender absent)');
                                }
                                // Nettoyer l'ancienne piste audio du localStream
                                localStream.getAudioTracks().forEach(t => { try { t.stop(); } catch {} });
                                // Ajouter la nouvelle piste audio au localStream EXISTANT
                                // (ne pas remplacer localStream, les pistes video de videoStream sont independantes)
                                localStream.addTrack(newTrack);
                                console.log('[WebRTC] Audio local restaure dans localStream, readyState=' + newTrack.readyState);
                            }
                        } catch (recErr) {
                            console.error('[WebRTC] Echec reacquisition audio:', recErr);
                        }
                    }

                    // Ajouter les pistes video a la connexion WebRTC existante
                    if (pc && pc.connectionState !== 'closed' && pc.connectionState !== 'failed') {
                        // Verrouiller pour eviter double renégociation
                        if (isRenegotiating) {
                            console.log('[WebRTC] Renegociation deja en cours, attente...');
                            let waited = 0;
                            while (isRenegotiating && waited < 5000) {
                                await new Promise(r => setTimeout(r, 100));
                                waited += 100;
                            }
                        }
                        const videoTracks = stream.getVideoTracks();
                        for (const track of videoTracks) {
                            pc.addTrack(track, stream);
                            console.log('[WebRTC] Piste video ajoutee au PC: ' + track.label);
                        }
                        console.log('[WebRTC] ' + videoTracks.length + ' piste(s) video ajoutee(s), renegociation en cours...');
                        // S'assurer que la piste audio est toujours active
                        if (localStream) {
                            const audioTracks = localStream.getAudioTracks();
                            audioTracks.forEach(t => console.log('[WebRTC] Audio local track: ' + t.id + ' enabled=' + t.enabled + ' muted=' + t.muted + ' readyState=' + t.readyState));
                        }
                    } else {
                        console.warn('[WebRTC] PC non disponible pour ajouter la video (state=' + (pc ? pc.connectionState : 'null') + ')');
                    }
                } else {
                    if (noCamIcon) noCamIcon.innerHTML = '<div class="text-center px-2"><div class="text-2xl mb-1">🚫</div><div class="font-bold">Caméra indisponible</div><div class="text-[10px] opacity-80">Navigateur non supporté</div></div>';
                }
            } catch (err) {
                console.error('[WebRTC] Erreur activation video:', err);
                if (noCamIcon) noCamIcon.innerHTML = '<div class="text-center px-2"><div class="text-2xl mb-1">🚫</div><div class="font-bold">Caméra non autorisée</div><div class="text-[10px] opacity-80">Vous pouvez continuer en audio</div></div>';
                // Même si la caméra échoue, réacquérir l'audio systématiquement
                if (localStream && pc && pc.connectionState !== 'closed') {
                    console.warn('[WebRTC] Echec camera, reacquisition audio systematique...');
                    try {
                        const recoveryStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                        const newTrack = recoveryStream.getAudioTracks()[0];
                        if (newTrack) {
                            const senders = pc.getSenders();
                            const audioSender = senders.find(s => s.track && s.track.kind === 'audio');
                            if (audioSender) {
                                await audioSender.replaceTrack(newTrack);
                            } else {
                                pc.addTrack(newTrack, recoveryStream);
                            }
                            localStream.getAudioTracks().forEach(t => { try { t.stop(); } catch {} });
                            localStream.addTrack(newTrack);
                            console.log('[WebRTC] Audio local restaure apres echec camera');
                        }
                    } catch (recErr) {
                        console.error('[WebRTC] Echec recuperation audio apres echec camera:', recErr);
                    }
                }
            } finally {
                isProcessing = false;
                if (statusEl) {
                    statusEl.innerText = originalStatusText;
                    statusEl.classList.remove('animate-pulse', 'text-mangoo-500');
                }
                if (primaryBtn && primaryBtn.dataset.originalClass) {
                    primaryBtn.className = primaryBtn.dataset.originalClass;
                    const icon = primaryBtn.querySelector('i');
                    if (icon) icon.className = 'fas fa-video text-xl mb-1';
                }
            }
        }

        function endCall() {
            // Garde anti-clic accidentel : ignorer tout endCall dans les 3 premieres secondes
            if (Date.now() - pageLoadTime < 3000) {
                console.warn('[Call] endCall() ignore (trop tot apres chargement, ' + (Date.now() - pageLoadTime) + 'ms)');
                return;
            }
            console.log('[Call] endCall() declenche dans iframe');
            console.log('[Call] Stack trace:', new Error().stack);
            callActive = false;
            try { statusEl.innerText = "Appel terminé"; } catch {}
            try { timerEl.innerText = "Fin"; } catch {}
            try { if (visualizer) visualizer.style.opacity = '0'; } catch {}

            try {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
            } catch {
            }
            
            try {
                const hangupBtns = document.querySelectorAll('button[onclick="endCall()"]');
                hangupBtns.forEach(btn => {
                    btn.disabled = true;
                    btn.style.backgroundColor = '#991b1b';
                    btn.style.cursor = 'not-allowed';
                });
                const otherBtns = document.querySelectorAll('button:not([onclick="endCall()"])');
                otherBtns.forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.55';
                    btn.style.cursor = 'not-allowed';
                });
            } catch {
            }
            
            // Stop camera if active
            const localVideo = document.getElementById('localVideo');
            if (localVideo && localVideo.srcObject) {
                const tracks = localVideo.srcObject.getTracks();
                tracks.forEach(track => track.stop());
                localVideo.srcObject = null;
            }

            try {
                const videoModal = document.getElementById('videoModal');
                if (videoModal) { videoModal.classList.add('hidden'); videoModal.style.display = 'none'; }
            } catch {
            }

            try { if (navigator && navigator.vibrate) navigator.vibrate(0); } catch {}

            setTimeout(() => {
                // Signaler au parent (mangoo-local.html) de fermer l'overlay
                try {
                    console.log('[Call] iframe envoie postMessage end_call au parent');
                    window.parent.postMessage('end_call', '*');
                } catch(e) { console.error('[Call] Erreur postMessage end_call:', e); }
                // NE PAS appeler window.close(), history.back() ou location.assign() !
                // Ces appels font disparaitre la page parente entiere.
            }, 350);
        }
    </script>
</body>
</html>

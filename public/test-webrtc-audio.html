<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Appel Audio - Mangoo Connect+</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        mangoo: { 500: '#1a5f3f', 600: '#144a31' }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'ping-slow': 'ping 2s cubic-bezier(0, 0, 0.2, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        .hidden { display: none !important; }
        .visualizer-bar {
            width: 6px;
            background: #66bb6a;
            border-radius: 99px;
            animation: sound 0s -0.4s linear infinite alternate;
        }
        @keyframes sound {
            0% { height: 10px; opacity: 0.35; }
            100% { height: 60px; opacity: 1; }
        }
        .visualizer-bar:nth-child(1)  { animation-duration: 474ms; }
        .visualizer-bar:nth-child(2)  { animation-duration: 433ms; }
        .visualizer-bar:nth-child(3)  { animation-duration: 407ms; }
        .visualizer-bar:nth-child(4)  { animation-duration: 458ms; }
        .visualizer-bar:nth-child(5)  { animation-duration: 400ms; }
        .visualizer-bar:nth-child(6)  { animation-duration: 427ms; }
        .visualizer-bar:nth-child(7)  { animation-duration: 441ms; }
        .visualizer-bar:nth-child(8)  { animation-duration: 419ms; }
        .visualizer-bar:nth-child(9)  { animation-duration: 487ms; }
        .visualizer-bar:nth-child(10) { animation-duration: 442ms; }
        
        /* Simulated Live Camera Movement */
        @keyframes subtle-move {
            0% { transform: scale(1.05) translate(0, 0); }
            25% { transform: scale(1.08) translate(1%, 1%); }
            50% { transform: scale(1.05) translate(0, 2%); }
            75% { transform: scale(1.08) translate(-1%, 1%); }
            100% { transform: scale(1.05) translate(0, 0); }
        }
        .simulated-live {
            animation: subtle-move 20s ease-in-out infinite;
        }
        @keyframes camPulse {
            0%, 100% { opacity: 0.7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }
    </style>
</head>
<body class="bg-[#f6faf3] dark:bg-[#102814] text-gray-800 dark:text-white h-screen flex flex-col items-center justify-between transition-colors duration-300">

    <!-- Audio element cache pour le flux distant WebRTC -->
    <audio id="remoteAudio" autoplay playsinline style="display:none;"></audio>

    <!-- Video PiP pour recevoir le flux video distant (produit vendeur) -->
    <div id="remoteVideoContainer" class="hidden fixed bottom-24 left-4 w-40 h-56 bg-[#102814] rounded-2xl border-2 border-[#eef6ea] dark:border-[#2e5d34] overflow-hidden shadow-2xl" style="z-index:120;">
        <style>
            @media (max-width: 640px) {
                #remoteVideoContainer { bottom: 160px !important; left: 8px !important; width: 120px !important; height: 160px !important; }
            }
        </style>
        <video id="remoteVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div id="remoteVideoStatus" class="absolute inset-0 flex items-center justify-center bg-[#102814]/90 text-white text-[11px] text-center px-2 pointer-events-none">
            <div><span class="text-xl block mb-1">⏳</span>Réception vidéo...</div>
        </div>
        <div id="remoteVideoLabel" class="absolute top-2 left-2 bg-red-600 text-white px-1.5 py-0.5 rounded text-[10px] font-bold flex items-center gap-1">
            <span class="w-1.5 h-1.5 bg-white rounded-full animate-pulse"></span> EN DIRECT
        </div>
    </div>

    <!-- Header info -->
    <div class="mt-10 text-center px-6 w-full max-w-xl">
        <div class="rounded-3xl shadow-xl overflow-hidden border border-[#cfe0c8] dark:border-[#2e5d34]">
            <div class="bg-[#1b5e20] text-white px-6 py-5">
                <div class="text-xs uppercase tracking-widest opacity-95 mb-1" id="callTypeLabel">Appel Audio Mangoo</div>
                <h1 class="text-3xl font-extrabold" id="calleeName">Correspondant</h1>
                <div class="mt-2 text-xl font-mono text-white/95" id="timer">Connexion...</div>
            </div>
        </div>
    </div>

    <!-- Avatar & Visualizer -->
    <div class="relative flex flex-col items-center justify-center w-full flex-1">
        <!-- Pulse Rings -->
        <div class="absolute w-64 h-64 bg-[#1b5e20]/20 rounded-full animate-ping-slow pointer-events-none"></div>
        <div class="absolute w-48 h-48 bg-[#1b5e20]/30 rounded-full animate-pulse-slow pointer-events-none"></div>
        
        <!-- Avatar -->
        <div class="relative z-10 w-32 h-32 rounded-full border-4 border-[#eef6ea] dark:border-[#2e5d34] shadow-2xl overflow-hidden bg-gray-300">
            <img id="avatarImg" src="https://ui-avatars.com/api/?name=Mangoo&background=1a5f3f&color=fff" class="w-full h-full object-cover">
        </div>

        <!-- Visualizer -->
        <div class="flex items-center justify-center gap-1 h-16 mt-8" id="visualizer">
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div><div class="visualizer-bar"></div>
        </div>
        <div class="text-sm text-[#66bb6a] mt-4" id="statusText">Sonnerie en cours...</div>
    </div>

    <!-- Controls -->
    <div class="w-full max-w-sm px-8 pb-12">
        <div class="bg-white/95 dark:bg-[#17331c] rounded-3xl shadow-xl p-6 flex justify-between items-center border border-[#cfe0c8] dark:border-[#2e5d34]">
            
            <!-- Mute -->
            <button class="p-4 rounded-full bg-[#eef6ea] dark:bg-[#17331c] text-gray-600 dark:text-white hover:bg-[#cfe0c8] dark:hover:bg-[#2e5d34] transition" onclick="toggleMute(this)">
                <i class="fas fa-microphone text-xl"></i>
            </button>
            
            <!-- Video Switch (Upgrading to Video allowed) -->
            <button class="p-4 rounded-full bg-[#eef6ea] dark:bg-[#17331c] text-gray-600 dark:text-white hover:bg-[#cfe0c8] dark:hover:bg-[#2e5d34] transition" id="audioPageVideoBtn" onclick="toggleVideo(this)" title="Voir produit (vidéo)">
                <div class="flex flex-col items-center">
                    <i class="fas fa-video text-xl mb-1"></i>
                    <span class="text-[10px] font-bold">Voir produit</span>
                </div>
            </button>

            <!-- Hangup -->
            <button class="w-16 h-16 rounded-full bg-red-500 text-white shadow-lg shadow-red-500/40 flex items-center justify-center transform hover:scale-105 transition" onclick="endCall()">
                <i class="fas fa-phone-slash text-2xl"></i>
            </button>

            <!-- Speaker -->
            <button class="p-4 rounded-full bg-[#eef6ea] dark:bg-[#17331c] text-gray-600 dark:text-white hover:bg-[#cfe0c8] dark:hover:bg-[#2e5d34] transition" onclick="toggleSpeaker(this)">
                <i class="fas fa-volume-up text-xl"></i>
            </button>
        </div>
    </div>
    
    <!-- Video Modal (Hidden by default) -->
    <div id="videoModal" class="fixed inset-0 bg-black hidden flex flex-col" style="z-index:110;">
        <div class="relative flex-1 bg-black flex items-center justify-center overflow-hidden">
            <!-- Simulated Remote Video (Product) -->
            <img id="productVideoFeed" src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=800&q=80" class="w-full h-full object-contain opacity-80 simulated-live" alt="Flux vidéo produit">
            
            <!-- Remote Label -->
            <div class="absolute top-4 left-4 flex items-center gap-2">
                <div class="bg-red-600 text-white px-2 py-1 rounded text-xs font-bold animate-pulse">🔴 EN DIRECT</div>
                <div class="bg-black/50 text-white px-2 py-1 rounded text-xs backdrop-blur-sm" id="productLabelBadge">📹 Caméra Vendeur (Produit)</div>
            </div>
            
            <!-- Local Video (User) -->
            <div class="fixed bottom-24 right-4 w-32 h-48 bg-[#17331c] rounded-xl border-2 border-[#eef6ea] overflow-hidden shadow-lg" style="z-index:125;">
                <style>
                    @media (max-width: 640px) {
                        #videoModal .fixed.bottom-24.right-4 { bottom: 160px !important; right: 4px !important; width: 96px !important; height: 128px !important; }
                    }
                </style>
                <video id="localVideo" autoplay muted playsinline class="w-full h-full object-cover"></video>
                <div class="absolute top-2 left-2 bg-black/50 text-white px-1.5 py-0.5 rounded text-[10px] backdrop-blur-sm">👤 Vous</div>
                <div class="absolute inset-0 flex items-center justify-center text-white text-xs pointer-events-none" id="noCamIcon">
                    <!-- Icon shown only if no video stream -->
                </div>
            </div>
        </div>
        
        <!-- Video Controls -->
        <div class="bg-[#102814] p-6 flex justify-center gap-6">
             <button class="p-4 rounded-full bg-[#17331c] text-white hover:bg-[#2e5d34] transition" onclick="toggleMute(this)">
                <i class="fas fa-microphone text-xl"></i>
            </button>
            <button class="w-16 h-16 rounded-full bg-red-500 text-white shadow-lg flex items-center justify-center hover:bg-red-600 transition" onclick="endCall()">
                <i class="fas fa-phone-slash text-2xl"></i>
            </button>
            <button class="p-4 rounded-full bg-white text-[#1b5e20] hover:bg-[#eef6ea] transition" onclick="toggleVideo(this)">
                <i class="fas fa-video text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Product Picker Modal -->
    <div id="productPicker" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:100; align-items:flex-end; justify-content:center; backdrop-filter:blur(4px);">
        <div class="bg-white dark:bg-[#1a1a2e] w-full max-w-md rounded-t-2xl p-5 animate-slide-up max-h-[70vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white">📦 Choisir un produit</h3>
                <button onclick="closeProductPicker()" class="text-gray-500 hover:text-gray-700 text-xl">&times;</button>
            </div>
            <div id="productPickerList" class="flex flex-col gap-3"></div>
            <button onclick="closeProductPicker()" class="w-full mt-4 py-3 rounded-xl bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 font-medium">Annuler</button>
        </div>
    </div>

    <style>
        @keyframes slide-up {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .animate-slide-up { animation: slide-up 0.3s ease-out; }
        .product-picker-item {
            display: flex; align-items: center; gap: 12px; padding: 12px;
            border-radius: 12px; cursor: pointer; transition: all 0.2s;
            border: 2px solid transparent;
        }
        .product-picker-item:hover { border-color: #1b5e20; }
        .product-picker-thumb {
            width: 56px; height: 56px; border-radius: 10px; background-size: cover;
            background-position: center; background-color: #f1f2f6; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
        }
    </style>

    <script>
        // Init Params
        const params = new URLSearchParams(window.location.search);
        const name = params.get('callee') || 'Service Client';
        const theme = params.get('theme');
        const mode = params.get('mode');
        const autoConnect = params.get('autoConnect') === 'true';
        const role = params.get('role') || 'caller'; // 'caller' ou 'callee'
        const roomId = params.get('roomId') || '';
        const productNameParam = params.get('productName');
        const productImgParam = params.get('productImg');

        // Apply Theme
        if (theme === 'dark') document.documentElement.classList.add('dark');

        // Set UI
        document.getElementById('calleeName').innerText = name;
        document.getElementById('avatarImg').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=random&color=fff`;

        function applyProductPreview() {
            try {
                const img = document.getElementById('productVideoFeed');
                if (!img) return;

                let productName = String(productNameParam || '').trim();
                let productImg = String(productImgParam || '').trim();

                try {
                    if ((!productName || !productImg) && localStorage) {
                        const raw = localStorage.getItem('lp_last_product')
                        if (raw) {
                            const p = JSON.parse(raw)
                            if (!productName) productName = String(p?.name || '').trim()
                            if (!productImg) productImg = String(p?.img || '').trim()
                        }
                    }
                } catch {
                }
                // Fallback: produit recu du parent via postMessage
                if ((!productName || !productImg) && window._callProduct) {
                    if (!productName) productName = String(window._callProduct.name || '').trim();
                    if (!productImg) productImg = String(window._callProduct.img || '').trim();
                }

                if (productImg) img.src = productImg;
                img.alt = productName ? `Produit: ${productName}` : 'Produit';

                const badge = document.getElementById('productLabelBadge');
                if (badge) badge.textContent = productName ? `📦 ${productName}` : '📹 Caméra Vendeur (Produit)'
            } catch {
            }
        }

        function displaySharedProduct(product) {
            try {
                const img = document.getElementById('productVideoFeed');
                const badge = document.getElementById('productLabelBadge');
                if (img && product.img) {
                    img.src = product.img;
                    console.log('[WebRTC] Image produit mise a jour: ' + product.img.substring(0, 60) + '...');
                } else if (img && !product.img) {
                    console.warn('[WebRTC] Produit sans image: ' + (product.name || 'sans nom'));
                }
                if (badge) badge.textContent = product.name ? `📦 ${product.name}` : '📹 Caméra Vendeur (Produit)';
                if (img) img.alt = product.name ? `Produit partagé: ${product.name}` : 'Produit partagé';
                console.log('[WebRTC] Produit affiche: ' + (product.name || 'sans nom') + ' img=' + (product.img ? 'oui' : 'NON'));
            } catch(e) { console.error('[WebRTC] Erreur displaySharedProduct:', e); }
        }

        // Check for Video Mode
        if (mode === 'video') {
            setTimeout(() => {
                const btn = document.getElementById('audioPageVideoBtn');
                if(btn) toggleVideo(btn);
            }, 100);
        } 
        // Note: We keep the button visible in Audio mode to allow upgrading to Video call mid-stream
        // as per logical request. No 'else' block needed to hide it.

        // Timer Logic
        let seconds = 0;
        let callActive = false;
        let isProcessing = false;
        let timerInterval = null;
        const timerEl = document.getElementById('timer');
        const statusEl = document.getElementById('statusText');
        const visualizer = document.getElementById('visualizer');

        // Ringtone via Web Audio API
        let ringtoneCtx = null;
        let ringtoneInterval = null;
        let callConnected = false;

        // === WebRTC ===
        let pc = null;               // RTCPeerConnection
        let localStream = null;      // MediaStream local (audio)
        let videoStream = null;      // MediaStream video (produit)
        let remoteAudioStream = null; // Stream audio distant persistant (jamais detruit)
        let remoteVideoStream = null; // Stream video distant persistant
        let isRenegotiating = false;    // Verrou pour eviter renegociations simultanees
        let initialSetupComplete = false; // Bloque onnegotiationneeded pendant l'init
        let _prewarmPromise = null;       // Promesse du prewarm en cours (evite conflit getUserMedia)
        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
        const pageLoadTime = Date.now();

        function startRinging() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                ringtoneCtx = new AudioCtx();
                let beep = true;
                // Attendre la reprise du contexte avant de jouer
                const doResume = ringtoneCtx.state === 'suspended' ? ringtoneCtx.resume() : Promise.resolve();
                doResume.then(() => {
                    if (!ringtoneCtx) return;
                    ringtoneInterval = setInterval(() => {
                        try {
                            if (callConnected) { stopRinging(); return; }
                            if (!ringtoneCtx) { clearInterval(ringtoneInterval); return; }
                            if (ringtoneCtx.state === 'suspended') { ringtoneCtx.resume(); return; }
                            const osc = ringtoneCtx.createOscillator();
                            const gain = ringtoneCtx.createGain();
                            osc.connect(gain);
                            gain.connect(ringtoneCtx.destination);
                            osc.type = 'sine';
                            osc.frequency.value = beep ? 800 : 1000;
                            gain.gain.value = 0.3;
                            gain.gain.exponentialRampToValueAtTime(0.001, ringtoneCtx.currentTime + 0.4);
                            osc.start(ringtoneCtx.currentTime);
                            osc.stop(ringtoneCtx.currentTime + 0.4);
                            beep = !beep;
                        } catch {}
                    }, 800);
                }).catch(() => {});
            } catch {}
        }

        function stopRinging() {
            try {
                if (ringtoneInterval) { clearInterval(ringtoneInterval); ringtoneInterval = null; }
                if (ringtoneCtx) {
                    try { ringtoneCtx.close(); } catch {}
                    ringtoneCtx = null;
                }
            } catch {}
        }

        function connectCall() {
            if (callConnected) return;
            callConnected = true;
            stopRinging();
            statusEl.innerText = "Connexion audio...";
            timerEl.innerText = "00:00";
            callActive = true;
            startTimer();
            console.log('[WebRTC] connectCall, role=' + role + ', roomId=' + roomId);
            // Lancer le WebRTC selon le role
            if (role === 'caller') {
                startWebRTCCaller();
            } else {
                // Le callee attend l'offre via postMessage
                statusEl.innerText = "En attente du correspondant...";
            }
        }

        // === WEBRTC CALLER : cree l'offre ===
        async function startWebRTCCaller() {
            try {
                console.log('[WebRTC] Caller: demarrage WebRTC...');
                statusEl.innerText = "Activation microphone...";
                
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                console.log('[WebRTC] Caller: microphone obtenu');

                pc = new RTCPeerConnection(rtcConfig);

                // Log de l'etat de connexion
                pc.onconnectionstatechange = () => console.log('[WebRTC] Caller: connection state =', pc.connectionState);
                pc.oniceconnectionstatechange = () => console.log('[WebRTC] Caller: ICE connection state =', pc.iceConnectionState);
                pc.onsignalingstatechange = () => console.log('[WebRTC] Caller: signaling state =', pc.signalingState);
                // Renegociation (ajout/retrait piste video) — actif seulement APRES l'init
                pc.onnegotiationneeded = async () => {
                    if (!initialSetupComplete) {
                        console.log('[WebRTC] Caller: onnegotiationneeded ignore (init en cours)');
                        return;
                    }
                    if (isRenegotiating) return;
                    if (pc.signalingState !== 'stable') {
                        console.warn('[WebRTC] Caller: renegociation ignoree, signaling=' + pc.signalingState);
                        return;
                    }
                    isRenegotiating = true;
                    try {
                        console.log('[WebRTC] Caller: renegociation declenchee, transceivers:');
                        pc.getTransceivers().forEach((t, i) => {
                            console.log('[WebRTC]   transceiver[' + i + '] mid=' + t.mid + ' dir=' + t.direction + ' cur=' + t.currentDirection + ' kind=' + (t.sender.track ? t.sender.track.kind : 'none'));
                        });
                        // Créer l'offre en incluant tous les transceivers existants
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        const sdp = pc.localDescription.sdp;
                        const hasAudio = sdp.indexOf('m=audio') !== -1;
                        const hasVideo = sdp.indexOf('m=video') !== -1;
                        console.log('[WebRTC] Caller: offre de renegociation envoyee, audio=' + hasAudio + ' video=' + hasVideo);
                        window.parent.postMessage({ type: 'webrtc-signal', signal: { type: 'offer', roomId, data: pc.localDescription.toJSON() } }, '*');
                    } catch (err) {
                        console.error('[WebRTC] Caller: erreur renegociation:', err);
                    } finally {
                        isRenegotiating = false;
                    }
                };

                // Ajouter les pistes audio locales
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // ICE candidates → parent → WebSocket
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('[WebRTC] Caller: ICE candidate');
                        window.parent.postMessage({
                            type: 'webrtc-signal',
                            signal: { type: 'ice-candidate', roomId: roomId, data: event.candidate.toJSON() }
                        }, '*');
                    }
                };

                // Quand la piste distante arrive, la jouer
                pc.ontrack = (event) => {
                    console.log('[WebRTC] Caller: piste distante recue, kind=' + event.track.kind + ' id=' + event.track.id + ' readyState=' + event.track.readyState);
                    const track = event.track;
                    if (!track) return;

                    if (track.kind === 'audio') {
                        // Audio : creer un stream persistant UNE SEULE FOIS, ne jamais le modifier
                        if (!remoteAudioStream) {
                            remoteAudioStream = new MediaStream();
                            remoteAudioStream.addTrack(track);
                            const remoteAudio = document.getElementById('remoteAudio');
                            if (remoteAudio) {
                                remoteAudio.srcObject = remoteAudioStream;
                                remoteAudio.play().catch(e => console.warn('[WebRTC] Caller: autoplay audio bloque...', e));
                            }
                            console.log('[WebRTC] Caller: audio distant initialise');
                        } else {
                            // Renegociation : NE PAS toucher au stream audio. Remplacer la piste silencieusement
                            const existingTracks = remoteAudioStream.getAudioTracks();
                            if (existingTracks.length > 0 && existingTracks[0].id !== track.id) {
                                existingTracks.forEach(t => remoteAudioStream.removeTrack(t));
                                remoteAudioStream.addTrack(track);
                                console.log('[WebRTC] Caller: piste audio mise a jour (renegociation)');
                            }
                            // S'assurer que l'audio est toujours en cours de lecture
                            const remoteAudio = document.getElementById('remoteAudio');
                            if (remoteAudio) {
                                remoteAudio.muted = false;
                                remoteAudio.volume = 1.0;
                                remoteAudio.play().catch(() => {});
                            }
                        }
                    } else if (track.kind === 'video') {
                        // Video : stream persistant, gerer les pistes
                        const remoteVideo = document.getElementById('remoteVideo');
                        const remoteVideoContainer = document.getElementById('remoteVideoContainer');
                        const remoteVideoStatus = document.getElementById('remoteVideoStatus');
                        if (!remoteVideoStream) {
                            remoteVideoStream = new MediaStream();
                            if (remoteVideo) remoteVideo.srcObject = remoteVideoStream;
                        }
                        // Remplacer les pistes video existantes
                        remoteVideoStream.getVideoTracks().forEach(t => {
                            if (t.id !== track.id) remoteVideoStream.removeTrack(t);
                        });
                        if (!remoteVideoStream.getVideoTracks().some(t => t.id === track.id)) {
                            remoteVideoStream.addTrack(track);
                        }
                        console.log('[WebRTC] Caller: piste video distante ajoutee au stream persistant, nbTracks=' + remoteVideoStream.getVideoTracks().length);

                        // Detecter quand la video est coupee cote distant
                        track.onended = () => {
                            console.log('[WebRTC] Caller: piste video distante terminee, masquage PiP');
                            const rvc = document.getElementById('remoteVideoContainer');
                            if (rvc) rvc.classList.add('hidden');
                            const rvs = document.getElementById('remoteVideoStatus');
                            if (rvs) { rvs.classList.add('hidden'); rvs.innerHTML = ''; }
                        };

                        // Afficher le PiP video
                        if (remoteVideoContainer) {
                            remoteVideoContainer.classList.remove('hidden');
                            // Si la video a deja des donnees, cacher le statut immediatement
                            if (remoteVideo.readyState >= 2 && remoteVideo.videoWidth > 0) {
                                if (remoteVideoStatus) remoteVideoStatus.classList.add('hidden');
                            } else if (remoteVideoStatus) {
                                remoteVideoStatus.classList.remove('hidden');
                                remoteVideoStatus.innerHTML = '<div><span class="text-xl block mb-1">⏳</span>Réception vidéo...</div>';
                            }
                            const vidFallback = setTimeout(() => {
                                if (remoteVideoStatus && !remoteVideoStatus.classList.contains('hidden')) {
                                    remoteVideoStatus.innerHTML = '<div><span class="text-xl block mb-1">📶</span>Vidéo en attente...</div>';
                                }
                            }, 5000);
                            remoteVideo.onloadeddata = () => {
                                clearTimeout(vidFallback);
                                console.log('[WebRTC] Caller: video distante - metadonnees chargees, dimensions=' + remoteVideo.videoWidth + 'x' + remoteVideo.videoHeight);
                                if (remoteVideoStatus) remoteVideoStatus.classList.add('hidden');
                                remoteVideo.onloadeddata = null;
                            };
                            remoteVideo.play().catch(e => {
                                clearTimeout(vidFallback);
                                console.warn('[WebRTC] Caller: video autoplay bloque...', e);
                                if (remoteVideoStatus) {
                                    remoteVideoStatus.innerHTML = '<div><span class="text-xl block mb-1">▶️</span>Appuyez pour voir</div>';
                                }
                            });
                        }
                    }
                    statusEl.innerText = "Appel en cours";
                };

                // Creer l'offre
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);
                console.log('[WebRTC] Caller: offre creee, envoi au callee');
                
                // Envoyer l'offre via postMessage → parent → WebSocket
                window.parent.postMessage({
                    type: 'webrtc-signal',
                    signal: { type: 'offer', roomId: roomId, data: pc.localDescription.toJSON() }
                }, '*');

                // Activer la renegociation seulement APRES l'init
                initialSetupComplete = true;
                console.log('[WebRTC] Caller: init terminee, renegociation activee');

                statusEl.innerText = "Sonnerie...";
            } catch (err) {
                console.error('[WebRTC] Caller: erreur:', err);
                statusEl.innerText = "Erreur microphone";
                showWebRTCError(err);
            }
        }

        // === WEBRTC CALLEE : recoit l'offre et repond ===
        async function handleWebRTCOffer(offerData) {
            try {
                // Renegociation : si on a deja un pc, on repond sans re-creer getUserMedia
                if (pc && pc.signalingState !== 'closed') {
                    console.log('[WebRTC] Renegociation: offre recue sur pc existant, transceivers:');
                    pc.getTransceivers().forEach((t, i) => {
                        console.log('[WebRTC]   transceiver[' + i + '] mid=' + t.mid + ' dir=' + t.direction + ' cur=' + t.currentDirection + ' kind=' + (t.sender.track ? t.sender.track.kind : 'none'));
                    });
                    await pc.setRemoteDescription(new RTCSessionDescription(offerData));
                    console.log('[WebRTC] Renegociation: remote description definie, signaling=' + pc.signalingState);
                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    const sdp = pc.localDescription.sdp;
                    const hasAudio = sdp.indexOf('m=audio') !== -1;
                    const hasVideo = sdp.indexOf('m=video') !== -1;
                    console.log('[WebRTC] Renegociation: reponse envoyee, audio=' + hasAudio + ' video=' + hasVideo);
                    window.parent.postMessage({ type: 'webrtc-signal', signal: { type: 'answer', roomId, data: pc.localDescription.toJSON() } }, '*');
                    // Réactiver l'audio si nécessaire
                    if (remoteAudio && remoteAudio.srcObject) {
                        remoteAudio.muted = false;
                        remoteAudio.volume = 1.0;
                        remoteAudio.play().catch(e => console.warn('[WebRTC] Renegociation: echec relecture audio:', e));
                        console.log('[WebRTC] Renegociation: audio distant reactive');
                    }
                    return;
                }

                console.log('[WebRTC] Callee: offre recue, demarrage WebRTC...');
                statusEl.innerText = "Activation microphone...";

                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                console.log('[WebRTC] Callee: microphone obtenu');

                pc = new RTCPeerConnection(rtcConfig);

                // Log de l'etat de connexion
                pc.onconnectionstatechange = () => console.log('[WebRTC] Callee: connection state =', pc.connectionState);
                pc.oniceconnectionstatechange = () => console.log('[WebRTC] Callee: ICE connection state =', pc.iceConnectionState);
                pc.onsignalingstatechange = () => console.log('[WebRTC] Callee: signaling state =', pc.signalingState);
                // Renegociation (ajout/retrait piste video) — actif seulement APRES l'init
                pc.onnegotiationneeded = async () => {
                    if (!initialSetupComplete) {
                        console.log('[WebRTC] Callee: onnegotiationneeded ignore (init en cours)');
                        return;
                    }
                    if (isRenegotiating) return;
                    if (pc.signalingState !== 'stable') {
                        console.warn('[WebRTC] Callee: renegociation ignoree, signaling=' + pc.signalingState);
                        return;
                    }
                    isRenegotiating = true;
                    try {
                        console.log('[WebRTC] Callee: renegociation declenchee, transceivers:');
                        pc.getTransceivers().forEach((t, i) => {
                            console.log('[WebRTC]   transceiver[' + i + '] mid=' + t.mid + ' dir=' + t.direction + ' cur=' + t.currentDirection + ' kind=' + (t.sender.track ? t.sender.track.kind : 'none'));
                        });
                        const offer = await pc.createOffer();
                        await pc.setLocalDescription(offer);
                        const sdp = pc.localDescription.sdp;
                        const hasAudio = sdp.indexOf('m=audio') !== -1;
                        const hasVideo = sdp.indexOf('m=video') !== -1;
                        console.log('[WebRTC] Callee: offre de renegociation envoyee, audio=' + hasAudio + ' video=' + hasVideo);
                        window.parent.postMessage({ type: 'webrtc-signal', signal: { type: 'offer', roomId, data: pc.localDescription.toJSON() } }, '*');
                    } catch (err) {
                        console.error('[WebRTC] Callee: erreur renegociation:', err);
                    } finally {
                        isRenegotiating = false;
                    }
                };

                // Ajouter les pistes audio locales
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

                // ICE candidates → parent → WebSocket
                pc.onicecandidate = (event) => {
                    if (event.candidate) {
                        console.log('[WebRTC] Callee: ICE candidate');
                        window.parent.postMessage({
                            type: 'webrtc-signal',
                            signal: { type: 'ice-candidate', roomId: roomId, data: event.candidate.toJSON() }
                        }, '*');
                    }
                };

                // Quand la piste distante arrive, la jouer
                pc.ontrack = (event) => {
                    console.log('[WebRTC] Callee: piste distante recue, kind=' + event.track.kind + ' id=' + event.track.id + ' readyState=' + event.track.readyState);
                    const track = event.track;
                    if (!track) return;

                    if (track.kind === 'audio') {
                        // Audio : creer un stream persistant UNE SEULE FOIS, ne jamais le modifier
                        if (!remoteAudioStream) {
                            remoteAudioStream = new MediaStream();
                            remoteAudioStream.addTrack(track);
                            const remoteAudio = document.getElementById('remoteAudio');
                            if (remoteAudio) {
                                remoteAudio.srcObject = remoteAudioStream;
                                remoteAudio.play().catch(e => console.warn('[WebRTC] Callee: autoplay audio bloque...', e));
                            }
                            console.log('[WebRTC] Callee: audio distant initialise');
                        } else {
                            // Renegociation : remplacer la piste silencieusement
                            const existingTracks = remoteAudioStream.getAudioTracks();
                            if (existingTracks.length > 0 && existingTracks[0].id !== track.id) {
                                existingTracks.forEach(t => remoteAudioStream.removeTrack(t));
                                remoteAudioStream.addTrack(track);
                                console.log('[WebRTC] Callee: piste audio mise a jour (renegociation)');
                            }
                            // S'assurer que l'audio est toujours en cours de lecture
                            const remoteAudio = document.getElementById('remoteAudio');
                            if (remoteAudio) {
                                remoteAudio.muted = false;
                                remoteAudio.volume = 1.0;
                                remoteAudio.play().catch(() => {});
                            }
                        }
                    } else if (track.kind === 'video') {
                        const remoteVideo = document.getElementById('remoteVideo');
                        const remoteVideoContainer = document.getElementById('remoteVideoContainer');
                        const remoteVideoStatus = document.getElementById('remoteVideoStatus');
                        if (!remoteVideoStream) {
                            remoteVideoStream = new MediaStream();
                            if (remoteVideo) remoteVideo.srcObject = remoteVideoStream;
                        }
                        remoteVideoStream.getVideoTracks().forEach(t => {
                            if (t.id !== track.id) remoteVideoStream.removeTrack(t);
                        });
                        if (!remoteVideoStream.getVideoTracks().some(t => t.id === track.id)) {
                            remoteVideoStream.addTrack(track);
                        }
                        console.log('[WebRTC] Callee: piste video distante ajoutee au stream persistant, nbTracks=' + remoteVideoStream.getVideoTracks().length);

                        // Detecter quand la video est coupee cote distant
                        track.onended = () => {
                            console.log('[WebRTC] Callee: piste video distante terminee, masquage PiP');
                            const rvc = document.getElementById('remoteVideoContainer');
                            if (rvc) rvc.classList.add('hidden');
                            const rvs = document.getElementById('remoteVideoStatus');
                            if (rvs) { rvs.classList.add('hidden'); rvs.innerHTML = ''; }
                        };

                        if (remoteVideoContainer) {
                            remoteVideoContainer.classList.remove('hidden');
                            // Si la video a deja des donnees, cacher le statut immediatement
                            if (remoteVideo.readyState >= 2 && remoteVideo.videoWidth > 0) {
                                if (remoteVideoStatus) remoteVideoStatus.classList.add('hidden');
                            } else if (remoteVideoStatus) {
                                remoteVideoStatus.classList.remove('hidden');
                                remoteVideoStatus.innerHTML = '<div><span class="text-xl block mb-1">⏳</span>Réception vidéo...</div>';
                            }
                            const vidFallback = setTimeout(() => {
                                if (remoteVideoStatus && !remoteVideoStatus.classList.contains('hidden')) {
                                    remoteVideoStatus.innerHTML = '<div><span class="text-xl block mb-1">📶</span>Vidéo en attente...</div>';
                                }
                            }, 5000);
                            remoteVideo.onloadeddata = () => {
                                clearTimeout(vidFallback);
                                console.log('[WebRTC] Callee: video distante - metadonnees chargees, dimensions=' + remoteVideo.videoWidth + 'x' + remoteVideo.videoHeight);
                                if (remoteVideoStatus) remoteVideoStatus.classList.add('hidden');
                                remoteVideo.onloadeddata = null;
                            };
                            remoteVideo.play().catch(e => {
                                clearTimeout(vidFallback);
                                console.warn('[WebRTC] Callee: video autoplay bloque...', e);
                                if (remoteVideoStatus) {
                                    remoteVideoStatus.innerHTML = '<div><span class="text-xl block mb-1">▶️</span>Appuyez pour voir</div>';
                                }
                            });
                        }
                    }
                    statusEl.innerText = "Appel en cours";
                };

                // Appliquer l'offre recue
                await pc.setRemoteDescription(new RTCSessionDescription(offerData));
                console.log('[WebRTC] Callee: remote description definie');

                // Creer la reponse
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                console.log('[WebRTC] Callee: reponse creee, envoi au caller');

                // Envoyer la reponse via postMessage → parent → WebSocket
                window.parent.postMessage({
                    type: 'webrtc-signal',
                    signal: { type: 'answer', roomId: roomId, data: pc.localDescription.toJSON() }
                }, '*');

                // Activer la renegociation seulement APRES l'init
                initialSetupComplete = true;
                console.log('[WebRTC] Callee: init terminee, renegociation activee');

                statusEl.innerText = "Appel en cours";
            } catch (err) {
                console.error('[WebRTC] Callee: erreur:', err);
                statusEl.innerText = "Erreur microphone";
                showWebRTCError(err);
            }
        }

        function showWebRTCError(err) {
            const msg = err && err.name === 'NotAllowedError' ? 'Micro refusé. Autorisez-le dans les paramètres du navigateur.'
                : err && err.name === 'NotFoundError' ? 'Aucun microphone détecté.'
                : 'Erreur audio: ' + (err ? err.message : 'inconnue');
            try { statusEl.innerText = msg; } catch {}
            // Laisser le bouton raccrocher fonctionner meme en cas d'erreur
        }

        function closeWebRTC() {
            try {
                if (pc) {
                    pc.onicecandidate = null;
                    pc.ontrack = null;
                    pc.close();
                    pc = null;
                }
            } catch(e) { console.error('[WebRTC] Erreur fermeture pc:', e); }
            try {
                if (localStream) {
                    localStream.getTracks().forEach(t => t.stop());
                    localStream = null;
                }
                if (videoStream) {
                    videoStream.getTracks().forEach(t => t.stop());
                    videoStream = null;
                }
            } catch(e) { console.error('[WebRTC] Erreur arret pistes:', e); }
            try {
                const remoteVideo = document.getElementById('remoteVideo');
                const remoteVideoContainer = document.getElementById('remoteVideoContainer');
                const remoteVideoStatus = document.getElementById('remoteVideoStatus');
                if (remoteVideo) { remoteVideo.srcObject = null; remoteVideo.onloadeddata = null; }
                if (remoteVideoContainer) remoteVideoContainer.classList.add('hidden');
                if (remoteVideoStatus) { remoteVideoStatus.classList.add('hidden'); remoteVideoStatus.innerHTML = ''; }
                const remoteAudio = document.getElementById('remoteAudio');
                if (remoteAudio) remoteAudio.srcObject = null;
            } catch {}
            // Nettoyer les streams persistants
            try {
                if (remoteAudioStream) {
                    remoteAudioStream.getTracks().forEach(t => t.stop());
                    remoteAudioStream = null;
                }
                if (remoteVideoStream) {
                    remoteVideoStream.getTracks().forEach(t => t.stop());
                    remoteVideoStream = null;
                }
            } catch(e) { console.error('[WebRTC] Erreur nettoyage streams persistants:', e); }
            isRenegotiating = false;
            initialSetupComplete = false;
            _prewarmPromise = null;
        }

        function terminateCall() {
            stopRinging();
            closeWebRTC();
            callActive = false;
            callConnected = false;
            statusEl.innerText = "Appel terminé";
            timerEl.innerText = "Fin";
            if (visualizer) visualizer.style.opacity = '0';
            try {
                if (timerInterval) clearInterval(timerInterval);
                timerInterval = null;
            } catch {}
            // Stop camera if active
            try {
                const localVideo = document.getElementById('localVideo');
                if (localVideo && localVideo.srcObject) {
                    localVideo.srcObject.getTracks().forEach(t => t.stop());
                    localVideo.srcObject = null;
                }
                const videoModal = document.getElementById('videoModal');
                if (videoModal) { videoModal.classList.add('hidden'); videoModal.style.display = 'none'; }
            } catch {}
            try { if (navigator && navigator.vibrate) navigator.vibrate(0); } catch {}
        }

        // Start ringing on page load (sauf si autoConnect = appel déjà accepté)
        if (autoConnect) {
            console.log('[Call] autoConnect=true, connexion directe sans sonnerie');
            connectCall();
        } else {
            startRinging();
        }

        // Listen for messages from parent (mangoo-local.html)
        window.addEventListener('message', function(event) {
            try {
                const data = typeof event.data === 'string' ? event.data : event.data;
                if (data && data.type === 'call_accepted') {
                    console.log('[Call] call_accepted recu, connexion...');
                    if (!callConnected) connectCall();
                } else if (data && data.type === 'call_ended') {
                    console.log('[Call] call_ended recu, terminaison...');
                    terminateCall();
                    setTimeout(() => {
                        try { window.parent.postMessage('end_call', '*'); } catch {}
                    }, 350);
                } else if (data === 'call_accepted') {
                    if (!callConnected) connectCall();
                } else if (data === 'call_ended') {
                    terminateCall();
                } else if (data && data.type === 'webrtc-signal') {
                    // Relai WebRTC du parent (offer / answer / ice-candidate / product-preview)
                    handleWebRTCSignal(data.signal);
                } else if (data && data.type === 'init-product') {
                    // Produit recu du parent (mangoo-local.html) a l'init de l'appel
                    if (data.product) {
                        console.log('[WebRTC] Produit recu du parent: ' + (data.product.name || 'sans nom') + ' img=' + (data.product.img ? 'oui' : 'non'));
                        window._callProduct = data.product;
                        displaySharedProduct(data.product);
                    }
                }
                // Liste complete des produits pour le selecteur
                if (data.type === 'init-products' && Array.isArray(data.products)) {
                    console.log('[WebRTC] Liste de ' + data.products.length + ' produit(s) recue du parent');
                    window._availableProducts = data.products;
                    // Pre-charger le 1er produit comme fallback
                    if (data.products.length > 0) {
                        window._callProduct = data.products[0];
                    }
                }
            } catch {}
        });

        // Signaler au parent que l'iframe est prete a recevoir les signaux WebRTC
        console.log('[Call] Iframe prete, envoi call-iframe-ready au parent (role=' + role + ')');
        window.parent.postMessage({ type: 'call-iframe-ready', role: role }, '*');

        function handleWebRTCSignal(signal) {
            if (!signal) return;
            console.log('[WebRTC] Signal recu du parent:', signal.type);
            try {
                if (signal.type === 'offer') {
                    // Callee recoit l'offre initiale
                    if (role === 'callee' && !callConnected) {
                        connectCall();
                    }
                    // Ignorer notre propre offre relayee par le WebSocket
                    if (pc && pc.signalingState === 'have-local-offer') {
                        console.log('[WebRTC] Offer ignoree (relai de ma propre offre), signaling=' + pc.signalingState + ' role=' + role);
                        return;
                    }
                    handleWebRTCOffer(signal.data);
                } else if (signal.type === 'answer') {
                    // Ignorer l'answer si on est deja stable (relai de notre propre reponse)
                    // Accepter seulement si on est en have-local-offer (on attend une reponse a notre offre)
                    if (pc && pc.signalingState === 'stable') {
                        console.log('[WebRTC] Answer ignoree (deja stable, relai de ma propre reponse), role=' + role);
                        return;
                    }
                    if (!pc || !signal.data) return;
                    if (pc.signalingState !== 'have-local-offer') {
                        console.warn('[WebRTC] Answer recue dans un etat inattendu: ' + pc.signalingState + ', ignoree');
                        return;
                    }
                    console.log('[WebRTC] Answer acceptee (signaling=' + pc.signalingState + ', role=' + role + ')');
                    pc.setRemoteDescription(new RTCSessionDescription(signal.data))
                            .then(() => {
                                console.log('[WebRTC] Remote description (answer) definie, signaling=' + pc.signalingState);
                                // Vérifier l'état des transceivers après renégociation
                                pc.getTransceivers().forEach((t, i) => {
                                    console.log('[WebRTC]   transceiver[' + i + '] mid=' + t.mid + ' dir=' + t.direction + ' cur=' + t.currentDirection + ' kind=' + (t.sender.track ? t.sender.track.kind : 'none'));
                                });
                                // Réactiver l'audio distant si nécessaire
                                if (remoteAudio && remoteAudio.srcObject) {
                                    remoteAudio.muted = false;
                                    remoteAudio.volume = 1.0;
                                    remoteAudio.play().catch(e => console.warn('[WebRTC] echec relecture audio:', e));
                                    console.log('[WebRTC] Audio distant reactive apres answer');
                                }
                                // Vérifier que la piste audio locale est toujours active
                                if (localStream) {
                                    localStream.getAudioTracks().forEach(t => {
                                        if (!t.enabled) { t.enabled = true; console.log('[WebRTC] Audio local reactive'); }
                                        console.log('[WebRTC] Audio local: enabled=' + t.enabled + ' muted=' + t.muted + ' readyState=' + t.readyState);
                                    });
                                }
                            })
                            .catch(e => console.error('[WebRTC] Erreur setRemoteDescription answer:', e));
                } else if (signal.type === 'ice-candidate') {
                    // Ajouter le candidat ICE
                    if (pc && signal.data) {
                        pc.addIceCandidate(new RTCIceCandidate(signal.data))
                            .catch(e => console.error('[WebRTC] Erreur addIceCandidate:', e));
                    }
                } else if (signal.type === 'product-preview') {
                    // Produit partage par le correspondant
                    if (signal.product) {
                        console.log('[WebRTC] Produit recu du correspondant: ' + (signal.product.name || 'sans nom'));
                        displaySharedProduct(signal.product);
                        // Ajouter a la liste disponible si pas deja present
                        if (!window._availableProducts) window._availableProducts = [];
                        const exists = window._availableProducts.some(p => p.name === signal.product.name && p.img === signal.product.img);
                        if (!exists) {
                            window._availableProducts.push(signal.product);
                            console.log('[WebRTC] Produit ajoute a la liste disponible (' + window._availableProducts.length + ' total)');
                        }
                        // Auto-ouvrir le modal video pour afficher le produit recu
                        openVideoModalForProduct(signal.product);
                    }
                } else if (signal.type === 'products-list') {
                    // Liste complete des produits recue du correspondant (vendeur → client)
                    if (Array.isArray(signal.products)) {
                        console.log('[WebRTC] Liste de ' + signal.products.length + ' produit(s) recue du correspondant');
                        window._availableProducts = signal.products;
                        if (signal.products.length > 0) {
                            window._callProduct = signal.products[0];
                        }
                    }
                }
            } catch(e) {
                console.error('[WebRTC] Erreur traitement signal:', e);
            }
        }

        function startTimer() {
            if (timerInterval) return;
            timerInterval = setInterval(() => {
                if(!callActive) return;
                seconds++;
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                timerEl.innerText = `${m}:${s}`;
            }, 1000);
        }

        function toggleMute(btn) {
            const icon = btn.querySelector('i');
            if (icon.classList.contains('fa-microphone')) {
                icon.className = 'fas fa-microphone-slash text-xl';
                if(btn.classList.contains('bg-[#17331c]')) {
                    btn.classList.remove('bg-[#17331c]', 'text-white');
                    btn.classList.add('bg-red-500', 'text-white');
                } else {
                    btn.classList.add('text-red-500');
                }
                // Couper la piste audio locale
                if (localStream) {
                    localStream.getAudioTracks().forEach(t => { t.enabled = false; });
                }
            } else {
                icon.className = 'fas fa-microphone text-xl';
                if(btn.classList.contains('bg-red-500')) {
                    btn.classList.remove('bg-red-500', 'text-white');
                    btn.classList.add('bg-[#17331c]', 'text-white');
                } else {
                    btn.classList.remove('text-red-500');
                }
                // Reactiver la piste audio locale
                if (localStream) {
                    localStream.getAudioTracks().forEach(t => { t.enabled = true; });
                }
            }
        }

        // === PRODUCT PICKER (selecteur de produit pour "Voir produit") ===
        function openVideoModalForProduct(product, autoStartCamera) {
            if (!product) return;
            const videoModal = document.getElementById('videoModal');
            if (!videoModal) return;
            
            // ⚠️ OUVRIR LE MODAL AVANT TOUT (obligatoire pour Edge :
            //    un <video> dans un conteneur display:none ne se rend pas)
            videoModal.classList.remove('hidden');
            videoModal.style.display = 'flex';
            
            // Mettre à jour l'image et le badge
            displaySharedProduct(product);
            
            const label = document.getElementById('callTypeLabel');
            if (label) label.innerText = 'Vue Produit 📦';
            const statusEl = document.getElementById('statusText');
            if (statusEl) statusEl.innerText = product.name || 'Produit';
            // NOTE: ne pas appeler applyProductPreview() ici car elle ecraserait
            // l'image avec les params URL ou window._callProduct (1er produit)
            
            // Afficher le PiP video distant si un flux video est actif
            try {
                const rvc = document.getElementById('remoteVideoContainer');
                if (rvc && remoteVideoStream && remoteVideoStream.getVideoTracks().length > 0) {
                    rvc.classList.remove('hidden');
                    rvc.style.zIndex = '120';
                }
            } catch {}
            
            // Afficher un indicateur dans le self-view "Vous"
            // Si autoStartCamera=true (geste utilisateur dispo), afficher chargement (la camera demarre automatiquement)
            // Sinon (pas de geste utilisateur), afficher un prompt cliquable
            const noCamIcon = document.getElementById('noCamIcon');
            const hasActiveCamera = videoStream && videoStream.getVideoTracks().some(t => t.readyState === 'live');
            if (noCamIcon && !hasActiveCamera) {
                noCamIcon.style.zIndex = '999';
                if (autoStartCamera) {
                    // Auto-demarrage : afficher un indicateur de chargement ET lancer la camera
                    noCamIcon.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:rgba(0,0,0,0.75);border-radius:12px;"><div style="font-size:1.5rem;animation:camPulse 1s infinite;">📷</div></div>';
                    noCamIcon.style.pointerEvents = 'none';
                    // Lancer la camera en arriere-plan (async, non-bloquant)
                    _startCameraBackground();

<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MangooTech Vendor Dashboard ISOLATED</title>
    <!-- React et ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel pour JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="bg-gray-50">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;
      
      // Icônes simplifiées (SVG direct pour éviter les dépendances)
      const PackageIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m7.5 4.27 9 5.15"/><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22v-10"/></svg>;
      const LogOutIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>;

      const VendorDashboardIsolated = () => {
        const [isLoggedIn, setIsLoggedIn] = useState(false);
        const [products, setProducts] = useState([
          { id: 1, name: 'Produit Test 1', price: 10000 },
          { id: 2, name: 'Produit Test 2', price: 20000 }
        ]);

        if (!isLoggedIn) {
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-white p-8 rounded-xl shadow-lg max-w-md w-full text-center">
                <h2 className="text-2xl font-bold mb-4 text-green-600">ISOLATED MODE</h2>
                <p className="mb-6">Si vous voyez cet écran, le problème venait du Router ou de l'App.</p>
                <button 
                  onClick={() => setIsLoggedIn(true)}
                  className="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700"
                >
                  Entrer dans le Dashboard
                </button>
              </div>
            </div>
          );
        }

        return (
          <div className="min-h-screen">
            <header className="bg-white shadow p-4 flex justify-between items-center">
              <h1 className="text-xl font-bold">Dashboard Vendeur Isolé</h1>
              <button onClick={() => setIsLoggedIn(false)} className="flex items-center gap-2 text-red-600">
                <LogOutIcon /> Déconnexion
              </button>
            </header>
            <main className="container mx-auto p-4">
              <div className="bg-white rounded-lg shadow p-6">
                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                  <PackageIcon /> Mes Produits
                </h2>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {products.map(p => (
                    <div key={p.id} className="border p-4 rounded bg-gray-50">
                      <h3 className="font-bold">{p.name}</h3>
                      <p className="text-green-600">{p.price} FCFA</p>
                    </div>
                  ))}
                </div>
              </div>
            </main>
          </div>
        );
      };

      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<VendorDashboardIsolated />);
    </script>
  </body>
</html>

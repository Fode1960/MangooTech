<!DOCTYPE html>
<html lang="fr" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ===== MangooTech Brand Design Tokens ===== */
/* Palette: dark green (primary) + orange (CTA accent) + light green (success) */

:root {
  /* --- Radius Scale (root-level for preflight) --- */
  --mgt-radius-sm: 4px;
  --mgt-radius-md: 8px;
  --mgt-radius-lg: 16px;
  --mgt-radius-full: 9999px;
}

:root,
html.light {
  /* --- Brand Primary: Dark Green --- */
  --mgt-primary: 26 92 42;
  --mgt-primary-50: 232 245 233;
  --mgt-primary-100: 200 230 201;
  --mgt-primary-200: 165 214 168;
  --mgt-primary-300: 129 199 134;
  --mgt-primary-400: 102 183 108;
  --mgt-primary-500: 76 168 82;
  --mgt-primary-600: 56 142 60;
  --mgt-primary-700: 38 112 42;
  --mgt-primary-800: 26 92 42;
  --mgt-primary-900: 13 71 18;
  --mgt-primary-foreground: 255 255 255;

  /* --- Orange Accent (CTAs, highlights) --- */
  --mgt-accent: 232 97 12;
  --mgt-accent-50: 255 243 224;
  --mgt-accent-100: 255 224 178;
  --mgt-accent-200: 255 204 128;
  --mgt-accent-300: 255 183 77;
  --mgt-accent-400: 255 153 31;
  --mgt-accent-500: 232 97 12;
  --mgt-accent-600: 209 78 0;
  --mgt-accent-700: 163 61 0;
  --mgt-accent-800: 130 49 0;
  --mgt-accent-900: 97 36 0;
  --mgt-accent-foreground: 255 255 255;

  /* --- Neutral Surface & Text Scale --- */
  --mgt-background: 255 255 255;
  --mgt-foreground: 15 23 42;
  --mgt-card: 255 255 255;
  --mgt-card-foreground: 15 23 42;
  --mgt-popover: 255 255 255;
  --mgt-popover-foreground: 15 23 42;
  --mgt-muted: 248 250 252;
  --mgt-muted-foreground: 100 116 139;
  --mgt-border: 226 232 240;
  --mgt-input: 226 232 240;
  --mgt-ring: 26 92 42;

  /* --- State Colors --- */
  --mgt-success: 129 199 134;
  --mgt-success-foreground: 255 255 255;
  --mgt-warning: 255 183 77;
  --mgt-warning-foreground: 15 23 42;
  --mgt-error: 239 68 68;
  --mgt-error-foreground: 255 255 255;
  --mgt-info: 59 130 246;
  --mgt-info-foreground: 255 255 255;

  /* --- Shadows --- */
  --mgt-shadow-sm: 0 1px 2px rgba(15 23 42 / .05), 0 1px 1px rgba(15 23 42 / .03);
  --mgt-shadow-md: 0 8px 24px -8px rgba(15 23 42 / .18);
  --mgt-shadow-lg: 0 24px 60px -20px rgba(15 23 42 / .30);

  /* --- Typography --- */
  --mgt-font-sans: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  --mgt-font-mono: 'JetBrains Mono', 'Fira Code', monospace;
}

/* --- Semantic Tailwind Aliases --- */
:root {
  --background: 255 255 255;
  --foreground: 15 23 42;
  --card: 255 255 255;
  --card-foreground: 15 23 42;
  --popover: 255 255 255;
  --popover-foreground: 15 23 42;
  --primary: 26 92 42;
  --primary-foreground: 255 255 255;
  --muted: 248 250 252;
  --muted-foreground: 100 116 139;
  --border: 226 232 240;
  --input: 226 232 240;
  --ring: 26 92 42;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 16px;
  --radius-full: 9999px;

  --state-success: 129 199 134;
  --state-success-foreground: 255 255 255;
  --state-warning: 255 183 77;
  --state-warning-foreground: 15 23 42;
  --state-error: 239 68 68;
  --state-error-foreground: 255 255 255;
  --state-info: 59 130 246;
  --state-info-foreground: 255 255 255;
}

html.dark {
  --mgt-background: 11 11 15;
  --mgt-foreground: 248 250 252;
  --mgt-card: 20 20 26;
  --mgt-card-foreground: 248 250 252;
  --mgt-popover: 20 20 26;
  --mgt-popover-foreground: 248 250 252;
  --mgt-muted: 30 30 38;
  --mgt-muted-foreground: 148 163 184;
  --mgt-border: 40 40 50;
  --mgt-input: 40 40 50;
  --mgt-ring: 76 168 82;

  --background: 11 11 15;
  --foreground: 248 250 252;
  --card: 20 20 26;
  --card-foreground: 248 250 252;
  --popover: 20 20 26;
  --popover-foreground: 248 250 252;
  --primary: 76 168 82;
  --primary-foreground: 255 255 255;
  --muted: 30 30 38;
  --muted-foreground: 148 163 184;
  --border: 40 40 50;
  --input: 40 40 50;
  --ring: 76 168 82;
}

/* --- Typography Classes --- */
.h-display {
  font-family: var(--mgt-font-sans);
  font-size: clamp(40px, 6vw, 88px);
  line-height: 1.02;
  font-weight: 600;
  letter-spacing: -0.03em;
  text-wrap: balance;
}
.h1 {
  font-family: var(--mgt-font-sans);
  font-size: clamp(28px, 3.5vw, 48px);
  line-height: 1.1;
  font-weight: 600;
  letter-spacing: -0.02em;
  text-wrap: balance;
}
.h2 {
  font-family: var(--mgt-font-sans);
  font-size: clamp(22px, 2.4vw, 32px);
  line-height: 1.2;
  font-weight: 600;
  letter-spacing: -0.015em;
}
.h3 {
  font-family: var(--mgt-font-sans);
  font-size: 20px;
  line-height: 1.3;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.body-l {
  font-family: var(--mgt-font-sans);
  font-size: 18px;
  line-height: 1.55;
  font-weight: 400;
}
.body {
  font-family: var(--mgt-font-sans);
  font-size: 15px;
  line-height: 1.6;
  font-weight: 400;
}
.caption {
  font-family: var(--mgt-font-sans);
  font-size: 13px;
  line-height: 1.5;
  font-weight: 400;
  letter-spacing: 0.005em;
}
.tabular-nums {
  font-variant-numeric: tabular-nums;
}

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-background: var(--background);
    --color-foreground: var(--foreground);
    --color-card: var(--card);
    --color-card-foreground: var(--card-foreground);
    --color-popover: var(--popover);
    --color-popover-foreground: var(--popover-foreground);
    --color-primary: var(--primary);
    --color-primary-foreground: var(--primary-foreground);
    --color-muted: var(--muted);
    --color-muted-foreground: var(--muted-foreground);
    --color-border: var(--border);
    --color-input: var(--input);
    --color-ring: var(--ring);
    --radius-sm: var(--mgt-radius-sm);
    --radius-md: var(--mgt-radius-md);
    --radius-lg: var(--mgt-radius-lg);
  }
  @layer base {
    body { background: var(--background); color: var(--foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>

    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Appel Vidéo Complet - WebRTC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .status {
            display: inline-block;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .status.stopped {
            background: #ff4757;
            color: white;
        }

        .status.active {
            background: #2ed573;
            color: white;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .videos-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
            min-height: 400px;
        }

        .video-wrapper {
            position: relative;
            background: #000;
            border-radius: 15px;
            overflow: hidden;
            aspect-ratio: 16/9;
        }

        .video-wrapper.local {
            border: 2px solid #3742fa;
        }

        .video-wrapper.remote {
            border: 2px solid #2ed573;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-placeholder {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(45deg, #2c2c54, #40407a);
        }

        .video-placeholder .icon {
            font-size: 48px;
            margin-bottom: 15px;
            opacity: 0.7;
        }

        .video-placeholder .text {
            font-size: 16px;
            opacity: 0.8;
        }

        .video-label {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .control-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            padding: 15px 20px;
            border: none;
            border-radius: 15px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 100px;
        }

        .control-btn .icon {
            font-size: 24px;
        }

        .control-btn.start {
            background: #2ed573;
            color: white;
        }

        .control-btn.start:hover {
            background: #26d065;
            transform: translateY(-2px);
        }

        .control-btn.stop {
            background: #ff4757;
            color: white;
        }

        .control-btn.stop:hover {
            background: #ff3838;
            transform: translateY(-2px);
        }

        .control-btn.mute {
            background: #ffa502;
            color: white;
        }

        .control-btn.mute:hover {
            background: #ff9500;
            transform: translateY(-2px);
        }

        .control-btn.mute.active {
            background: #ff6348;
        }

        .control-btn.video {
            background: #3742fa;
            color: white;
        }

        .control-btn.video:hover {
            background: #2f3542;
            transform: translateY(-2px);
        }

        .control-btn.video.active {
            background: #ff4757;
        }

        .control-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .info-item .label {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .info-item .value {
            font-size: 16px;
            font-weight: 600;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 768px) {
            .videos-container {
                grid-template-columns: 1fr;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            .control-btn {
                width: 100%;
                max-width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="status stopped" id="status">Arrêté</div>
            <h1>Test Appel Vidéo WebRTC Complet</h1>
        </div>

        <div class="videos-container">
            <div class="video-wrapper local">
                <div class="video-label">Vous</div>
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="video-placeholder" id="localPlaceholder">
                    <div class="icon">📹</div>
                    <div class="text">Caméra locale désactivée</div>
                </div>
            </div>
            
            <div class="video-wrapper remote">
                <div class="video-label">Participant à distance</div>
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="video-placeholder" id="remotePlaceholder">
                    <div class="icon">👤</div>
                    <div class="text">En attente du participant</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="control-btn start" id="startCall">
                <span class="icon">📞</span>
                <span>Démarrer l'appel</span>
            </button>
            
            <button class="control-btn stop hidden" id="endCall">
                <span class="icon">📵</span>
                <span>Terminer l'appel</span>
            </button>
            
            <button class="control-btn mute" id="muteAudio" disabled>
                <span class="icon">🎤</span>
                <span>Mettre en sourdine</span>
            </button>
            
            <button class="control-btn video" id="muteVideo" disabled>
                <span class="icon">📹</span>
                <span>Arrêter la vidéo</span>
            </button>
        </div>

        <div class="info-panel">
            <h3 style="text-align: center; margin-bottom: 20px;">Statistiques Techniques</h3>
            <div class="info-grid">
                <div class="info-item">
                    <div class="label">État de WebRTC</div>
                    <div class="value" id="webrtcStatus">Prêt</div>
                </div>
                <div class="info-item">
                    <div class="label">Pistes audio</div>
                    <div class="value" id="audioTracks">0</div>
                </div>
                <div class="info-item">
                    <div class="label">Pistes vidéo</div>
                    <div class="value" id="videoTracks">0</div>
                </div>
                <div class="info-item">
                    <div class="label">Connexion</div>
                    <div class="value" id="connectionStatus">Non connecté</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class VideoCallManager {
            constructor() {
                this.localStream = null;
                this.remoteStream = null;
                this.isAudioMuted = false;
                this.isVideoMuted = false;
                this.isCallActive = false;
                
                this.initializeElements();
                this.bindEvents();
            }

            initializeElements() {
                this.localVideo = document.getElementById('localVideo');
                this.remoteVideo = document.getElementById('remoteVideo');
                this.localPlaceholder = document.getElementById('localPlaceholder');
                this.remotePlaceholder = document.getElementById('remotePlaceholder');
                this.status = document.getElementById('status');
                
                this.startCallBtn = document.getElementById('startCall');
                this.endCallBtn = document.getElementById('endCall');
                this.muteAudioBtn = document.getElementById('muteAudio');
                this.muteVideoBtn = document.getElementById('muteVideo');
                
                this.webrtcStatus = document.getElementById('webrtcStatus');
                this.audioTracks = document.getElementById('audioTracks');
                this.videoTracks = document.getElementById('videoTracks');
                this.connectionStatus = document.getElementById('connectionStatus');
            }

            bindEvents() {
                this.startCallBtn.addEventListener('click', () => this.startCall());
                this.endCallBtn.addEventListener('click', () => this.endCall());
                this.muteAudioBtn.addEventListener('click', () => this.toggleAudio());
                this.muteVideoBtn.addEventListener('click', () => this.toggleVideo());
            }

            async startCall() {
                try {
                    this.updateStatus('Connexion en cours...', 'active');
                    this.webrtcStatus.textContent = 'Connexion...';

                    // Demander l'accès aux médias
                    this.localStream = await navigator.mediaDevices.getUserMedia({
                        video: true,
                        audio: true
                    });

                    // Afficher la vidéo locale
                    this.localVideo.srcObject = this.localStream;
                    this.localPlaceholder.classList.add('hidden');
                    this.localVideo.classList.remove('hidden');

                    // Créer une vidéo simulée pour le participant distant
                    await this.createRemoteStream();

                    // Mettre à jour l'interface
                    this.isCallActive = true;
                    this.startCallBtn.classList.add('hidden');
                    this.endCallBtn.classList.remove('hidden');
                    this.muteAudioBtn.disabled = false;
                    this.muteVideoBtn.disabled = false;

                    this.updateStatus('Appel actif', 'active');
                    this.webrtcStatus.textContent = 'Connecté';
                    this.connectionStatus.textContent = 'Établie';
                    
                    this.updateTrackInfo();

                } catch (error) {
                    console.error('Erreur lors du démarrage de l\'appel:', error);
                    
                    if (error.name === 'NotAllowedError') {
                        this.updateStatus('Accès refusé - Mode démo activé', 'active');
                        this.webrtcStatus.textContent = 'Mode démo';
                        // Essayer le mode démo
                        await this.startDemoMode();
                    } else if (error.name === 'NotFoundError') {
                        this.updateStatus('Aucun périphérique trouvé - Mode démo', 'active');
                        this.webrtcStatus.textContent = 'Mode démo';
                        await this.startDemoMode();
                    } else {
                        this.updateStatus('Erreur média - ' + error.message, 'stopped');
                        this.webrtcStatus.textContent = 'Erreur';
                    }
                }
            }

            async createRemoteStream() {
                // Créer une vidéo simulée avec canvas
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');

                // Animation simple
                const animate = () => {
                    ctx.fillStyle = '#2c3e50';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    // Dessiner des formes animées
                    const time = Date.now() * 0.002;
                    
                    // Cercles animés
                    for (let i = 0; i < 5; i++) {
                        const x = (Math.sin(time + i) + 1) * canvas.width / 2;
                        const y = (Math.cos(time * 0.7 + i) + 1) * canvas.height / 2;
                        const radius = 20 + Math.sin(time + i) * 10;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = `hsl(${(time * 50 + i * 60) % 360}, 70%, 60%)`;
                        ctx.fill();
                    }
                    
                    // Texte
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('Participant Distant', canvas.width / 2, canvas.height / 2);
                    ctx.font = '16px Arial';
                    ctx.fillText('Vidéo simulée', canvas.width / 2, canvas.height / 2 + 30);
                    
                    if (this.isCallActive) {
                        requestAnimationFrame(animate);
                    }
                };
                
                animate();

                // Créer un flux vidéo depuis le canvas
                this.remoteStream = canvas.captureStream(30);
                this.remoteVideo.srcObject = this.remoteStream;
                this.remotePlaceholder.classList.add('hidden');
                this.remoteVideo.classList.remove('hidden');
            }

            async startDemoMode() {
                // Mode démo sans accès réel à la caméra
                const canvas = document.createElement('canvas');
                canvas.width = 640;
                canvas.height = 480;
                const ctx = canvas.getContext('2d');

                const animate = () => {
                    ctx.fillStyle = '#34495e';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    
                    const time = Date.now() * 0.003;
                    
                    // Animation plus complexe pour le mode démo
                    for (let i = 0; i < 8; i++) {
                        const x = (Math.sin(time + i * 0.5) + 1) * canvas.width / 2;
                        const y = (Math.cos(time * 0.8 + i * 0.3) + 1) * canvas.height / 2;
                        const radius = 15 + Math.sin(time * 2 + i) * 8;
                        
                        ctx.beginPath();
                        ctx.arc(x, y, radius, 0, Math.PI * 2);
                        ctx.fillStyle = `hsl(${(time * 60 + i * 45) % 360}, 80%, 70%)`;
                        ctx.fill();
                    }
                    
                    ctx.fillStyle = '#ffffff';
                    ctx.font = '20px Arial';
                    ctx.textAlign = 'center';
                    ctx.fillText('Mode Démonstration', canvas.width / 2, 50);
                    ctx.font = '16px Arial';
                    ctx.fillText('Caméra non disponible', canvas.width / 2, canvas.height - 30);
                    
                    if (this.isCallActive) {
                        requestAnimationFrame(animate);
                    }
                };
                
                animate();

                // Créer le flux local
                this.localStream = canvas.captureStream(30);
                this.localVideo.srcObject = this.localStream;
                this.localPlaceholder.classList.add('hidden');
                this.localVideo.classList.remove('hidden');

                // Créer le flux distant
                await this.createRemoteStream();

                // Mettre à jour l'interface
                this.isCallActive = true;
                this.startCallBtn.classList.add('hidden');
                this.endCallBtn.classList.remove('hidden');
                this.muteAudioBtn.disabled = false;
                this.muteVideoBtn.disabled = false;

                this.updateStatus('Mode démo actif', 'active');
                this.connectionStatus.textContent = 'Démo';
                
                this.updateTrackInfo();
            }

            endCall() {
                // Arrêter tous les flux
                if (this.localStream) {
                    this.localStream.getTracks().forEach(track => track.stop());
                    this.localStream = null;
                }
                
                if (this.remoteStream) {
                    this.remoteStream.getTracks().forEach(track => track.stop());
                    this.remoteStream = null;
                }

                // Réinitialiser les vidéos
                this.localVideo.srcObject = null;
                this.remoteVideo.srcObject = null;
                this.localPlaceholder.classList.remove('hidden');
                this.remotePlaceholder.classList.remove('hidden');

                // Réinitialiser l'interface
                this.isCallActive = false;
                this.isAudioMuted = false;
                this.isVideoMuted = false;
                
                this.startCallBtn.classList.remove('hidden');
                this.endCallBtn.classList.add('hidden');
                this.muteAudioBtn.disabled = true;
                this.muteVideoBtn.disabled = true;
                
                this.muteAudioBtn.classList.remove('active');
                this.muteVideoBtn.classList.remove('active');

                this.updateStatus('Arrêté', 'stopped');
                this.webrtcStatus.textContent = 'Prêt';
                this.connectionStatus.textContent = 'Non connecté';
                
                this.updateTrackInfo();
            }

            toggleAudio() {
                if (!this.localStream) return;
                
                this.isAudioMuted = !this.isAudioMuted;
                this.localStream.getAudioTracks().forEach(track => {
                    track.enabled = !this.isAudioMuted;
                });
                
                this.muteAudioBtn.classList.toggle('active');
                this.muteAudioBtn.querySelector('span:last-child').textContent = 
                    this.isAudioMuted ? 'Réactiver audio' : 'Mettre en sourdine';
                
                this.updateTrackInfo();
            }

            toggleVideo() {
                if (!this.localStream) return;
                
                this.isVideoMuted = !this.isVideoMuted;
                this.localStream.getVideoTracks().forEach(track => {
                    track.enabled = !this.isVideoMuted;
                });
                
                this.muteVideoBtn.classList.toggle('active');
                this.muteVideoBtn.querySelector('span:last-child').textContent = 
                    this.isVideoMuted ? 'Réactiver vidéo' : 'Arrêter la vidéo';
                
                this.updateTrackInfo();
            }

            updateStatus(text, className) {
                this.status.textContent = text;
                this.status.className = `status ${className}`;
            }

            updateTrackInfo() {
                if (this.localStream) {
                    const audioTracks = this.localStream.getAudioTracks().filter(track => track.enabled).length;
                    const videoTracks = this.localStream.getVideoTracks().filter(track => track.enabled).length;
                    
                    this.audioTracks.textContent = audioTracks;
                    this.videoTracks.textContent = videoTracks;
                } else {
                    this.audioTracks.textContent = '0';
                    this.videoTracks.textContent = '0';
                }
            }
        }

        // Initialiser l'application
        document.addEventListener('DOMContentLoaded', () => {
            new VideoCallManager();
        });
    </script>
</body>
</html>

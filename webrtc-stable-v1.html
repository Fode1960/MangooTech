<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Live Shopping - VERSION ULTIME</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #1a1c2c 0%, #4a192c 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER & STATUS */
        .header {
            text-align: center;
            margin-bottom: 20px;
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
            margin-top: 5px;
        }
        .status-ok { background: #4CAF50; color: white; }
        .status-wait { background: #FF9800; color: white; }
        .status-err { background: #F44336; color: white; }

        /* VIDEO GRID - FLEXBOX ROBUSTE */
        .video-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .video-card {
            background: #2d3436;
            border-radius: 12px;
            padding: 10px;
            width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s;
            position: relative;
        }

        .video-card:hover { transform: translateY(-5px); }

        .video-card h3 {
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .connection-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ccc;
        }
        .dot-green { background: #00b894; box-shadow: 0 0 5px #00b894; }
        .dot-red { background: #d63031; }

        video {
            width: 100%;
            height: 200px;
            background: black;
            border-radius: 8px;
            object-fit: cover;
        }

        /* AUDIO METER */
        .audio-track {
            height: 6px;
            background: #636e72;
            border-radius: 3px;
            margin-top: 8px;
            overflow: hidden;
        }
        .audio-level {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #00b894, #00cec9);
            transition: width 0.05s;
        }

        /* CONTROLS */
        .control-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        button:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(100%); }
        
        .btn-cam { background: #0984e3; }
        .btn-call { background: #00b894; }
        .btn-private { background: #e17055; }
        .btn-hangup { background: #d63031; }
        .btn-reset { background: #636e72; }
        
        /* Bouton demande client */
        .btn-ask { background: #6c5ce7; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

        /* CHAT & LOGS */
        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 250px;
        }

        .panel-box {
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            padding: 15px;
            display: flex;
            flex-direction: column;
        }

        .chat-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .chat-msg { margin-bottom: 5px; padding: 4px 8px; background: rgba(255,255,255,0.05); border-radius: 4px; }
        .chat-msg b { color: #74b9ff; }
        .chat-private { background: rgba(253, 203, 110, 0.2); border-left: 3px solid #fdcb6e; }

        .chat-input-group { display: flex; gap: 5px; align-items: center; }
        .chat-input-group input[type="text"] {
            flex-grow: 1;
            padding: 8px;
            border-radius: 4px;
            border: none;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        
        .btn-send {
            padding: 5px 15px;
            background: #0984e3;
            color: white;
            border-radius: 4px;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-send:hover { background: #00cec9; }

        .logs {
            font-family: monospace;
            font-size: 11px;
            color: #dfe6e9;
            overflow-y: auto;
        }

        /* MODAL */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: #2d3436;
            padding: 25px;
            border-radius: 15px;
            width: 90%; max-width: 400px;
            text-align: center;
            border: 1px solid #74b9ff;
        }
        .user-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px;
            margin: 20px 0;
        }
        .user-btn {
            background: #636e72; padding: 15px; border-radius: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .user-btn:hover { background: #74b9ff; }
        .user-btn.selected { background: #0984e3; border: 2px solid white; }
        
        .hidden { display: none !important; }
        
        /* Checkbox custom */
        .private-check {
            display: flex; align-items: center; gap: 5px; font-size: 12px; cursor: pointer;
            background: rgba(255,255,255,0.1); padding: 5px 10px; border-radius: 15px;
        }
        .private-check input { accent-color: #fdcb6e; }

        @media(max-width: 768px) {
            .info-panel { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🛍️ Live Shopping - Ultimate</h1>
        <div id="userInfo">Connexion...</div>
        <div id="globalStatus" class="status-badge status-wait">En attente</div>
    </div>

    <!-- ZONE VIDÉO -->
    <div class="video-container" id="videoGrid">
        <!-- Ma Vidéo -->
        <div class="video-card">
            <h3>
                <span>📷 MOI (<span id="myId">...</span>)</span>
                <span class="connection-dot dot-green"></span>
            </h3>
            <video id="localVideo" autoplay muted playsinline></video>
            <div class="audio-track"><div id="localAudio" class="audio-level"></div></div>
        </div>
        <!-- Les vidéos distantes s'ajouteront ici -->
    </div>

    <!-- CONTRÔLES -->
    <div class="control-bar">
        <button id="btnCam" class="btn-cam">📷 1. Activer Caméra</button>
        <button id="btnConnect" class="btn-cam" disabled>🔗 2. Connexion Room</button>
        <div style="width: 1px; background: rgba(255,255,255,0.3); margin: 0 10px;"></div>
        <button id="btnGroup" class="btn-call" disabled>📞 Appel Groupe</button>
        <button id="btnPrivate" class="btn-private" disabled>🔒 Appel Privé</button>
        <button id="btnHangup" class="btn-hangup" disabled>📴 Raccrocher</button>
        <button id="btnReset" class="btn-reset">⚠️ Reset Système</button>
    </div>

    <!-- INFOS & CHAT -->
    <div class="info-panel">
        <div class="panel-box">
            <h3>💬 Chat Live</h3>
            <div id="chatBox" class="chat-list"></div>
            <div class="chat-input-group">
                <label class="private-check" title="Message visible uniquement par le vendeur">
                    <input type="checkbox" id="checkPrivate"> 🔒 Privé
                </label>
                <!-- Sélecteur pour le Vendeur -->
                <select id="chatTarget" style="display:none; padding: 5px; border-radius: 4px; background: #dfe6e9; color: #2d3436; font-size: 11px;">
                    <option value="all">Tous</option>
                </select>

                <input type="text" id="chatInput" placeholder="Message..." autocomplete="off">
                <button onclick="sendChat()" class="btn-send">Envoyer</button>
            </div>
        </div>
        <div class="panel-box">
            <h3>📟 Logs Système</h3>
            <div id="logBox" class="logs"></div>
        </div>
    </div>
</div>

<!-- MODAL SÉLECTION -->
<div id="userModal" class="modal-overlay hidden">
    <div class="modal-box">
        <h3>👤 Qui appeler ?</h3>
        <p style="font-size: 12px; color: #aaa; margin-top: 5px;">Sélectionnez un client connecté :</p>
        <div id="userGrid" class="user-grid"></div>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button onclick="confirmPrivateCall()" class="btn-call">Lancer Appel</button>
            <button onclick="closeModal()" class="btn-hangup">Annuler</button>
        </div>
    </div>
</div>

<script>
    // === CONFIGURATION ===
    const params = new URLSearchParams(window.location.search);
    const ROOM_ID = params.get('roomId') || 'demo';
    const USER_ID = params.get('userId') || 'user_' + Math.floor(Math.random() * 1000);
    const ROLE = params.get('role') || 'viewer';
    
    // === ÉTAT ===
    let localStream = null;
    let peerConnections = {}; 
    let audioContext = null;
    let processedSignals = new Set();
    let connectedUsers = new Set();
    let currentPrivatePeer = null; // Variable pour suivre le mode privé

    // === DOM ===
    const els = {
        videoGrid: document.getElementById('videoGrid'),
        localVideo: document.getElementById('localVideo'),
        myId: document.getElementById('myId'),
        status: document.getElementById('globalStatus'),
        logs: document.getElementById('logBox'),
        chat: document.getElementById('chatBox'),
        chatInput: document.getElementById('chatInput'),
        checkPrivate: document.getElementById('checkPrivate'),
        chatTarget: document.getElementById('chatTarget'),
        modal: document.getElementById('userModal'),
        userGrid: document.getElementById('userGrid'),
        // Boutons
        btnCam: document.getElementById('btnCam'),
        btnConnect: document.getElementById('btnConnect'),
        btnGroup: document.getElementById('btnGroup'),
        btnPrivate: document.getElementById('btnPrivate'),
        btnHangup: document.getElementById('btnHangup')
    };

    // === INIT ===
    document.getElementById('userInfo').innerText = `${USER_ID} (${ROLE}) | Room: ${ROOM_ID}`;
    els.myId.innerText = USER_ID;
    
    // Configuration UI selon rôle
    if (ROLE === 'viewer') {
        els.btnPrivate.innerText = "✋ Demander Privé";
        els.btnPrivate.classList.remove('btn-private');
        els.btnPrivate.classList.add('btn-ask');
        els.btnGroup.style.display = 'none'; // Client ne lance pas d'appel groupe
    } else {
        els.checkPrivate.parentElement.style.display = 'none'; // Vendeur n'a pas besoin de cocher privé (il répond)
        els.chatTarget.style.display = 'block'; // Affiche le sélecteur pour le vendeur
    }
    
    // === UTILITAIRES (LOGS & STATUS) ===
    function log(msg) {
        console.log(msg);
        const div = document.createElement('div');
        div.innerText = `[${new Date().toLocaleTimeString()}] ${msg}`;
        els.logs.prepend(div);
    }

    function setStatus(msg, type) {
        els.status.innerText = msg;
        els.status.className = `status-badge status-${type}`;
    }

    localStorage.clear();
    log("🚀 Système démarré. LocalStorage nettoyé.");

    // === SIGNALING ===
    function sendSignal(type, data, to = 'all') {
        const id = Math.random().toString(36).substr(2, 9);
        const packet = { id, type, from: USER_ID, to, room: ROOM_ID, data, time: Date.now() };
        const key = `wsig_${ROOM_ID}_${id}`;
        localStorage.setItem(key, JSON.stringify(packet));
        processedSignals.add(id);
        setTimeout(() => localStorage.removeItem(key), 3000);
    }

    setInterval(() => {
        try {
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (!key.startsWith(`wsig_${ROOM_ID}_`)) continue;
                const msg = JSON.parse(localStorage.getItem(key));
                
                if (processedSignals.has(msg.id)) continue;
                if (Date.now() - msg.time > 5000) continue;
                processedSignals.add(msg.id);

                if (msg.from === USER_ID) continue;
                // Filtrage destinataire
                if (msg.to !== 'all' && msg.to !== USER_ID && msg.to !== 'vendor') continue;
                if (msg.to === 'vendor' && ROLE !== 'vendor') continue; // Seul le vendeur voit les messages pour 'vendor'

                handleSignal(msg);
            }
        } catch (e) {}
    }, 200);

    async function handleSignal(msg) {
        if (!connectedUsers.has(msg.from)) connectedUsers.add(msg.from);

        switch (msg.type) {
            case 'chat':
                // Gestion Chat Privé
                if (msg.data.private) {
                    if (ROLE === 'vendor') {
                         // Le vendeur voit tout ce qui est privé
                         displayChat(msg.from, msg.data.text, true);
                    } else if (msg.to === USER_ID) {
                         // Le client ne voit que si c'est pour lui
                         displayChat(msg.from, msg.data.text, true);
                    }
                    // Les autres clients ne voient RIEN (c'est ici que ça bloquait)
                } else {
                    // Message public : tout le monde voit
                    displayChat(msg.from, msg.data.text, false);
                }
                break;
                
            case 'ask-private':
                if (ROLE === 'vendor') {
                    log(`🔔 ${msg.from} demande un appel privé !`);
                    // Notification dans le chat aussi pour être plus visible
                    displayChat('SYSTÈME', `🔔 <b>${msg.from}</b> demande un appel privé !`, true);
                    // On pourrait aussi faire clignoter le bouton privé
                    els.btnPrivate.classList.add('btn-ask');
                    setTimeout(() => els.btnPrivate.classList.remove('btn-ask'), 3000);
                }
                break;

            case 'who-is-there':
                 if (ROLE !== 'vendor') sendSignal('presence', { status: 'ready' });
                 break;

            case 'presence':
                 if (!connectedUsers.has(msg.from)) {
                     connectedUsers.add(msg.from);
                     log(`👋 Nouveau participant détecté : ${msg.from}`);
                     updateChatTarget();
                 }
                 break;

            case 'call-request':
                // NETTOYAGE FORCE AVANT TOUT NOUVEL APPEL
                if (msg.to === USER_ID || (msg.to === 'all' && ROLE === 'viewer')) {
                    log(`🔄 Réception appel de ${msg.from}. Nettoyage des connexions...`);
                    Object.keys(peerConnections).forEach(closePeer);
                }

                if (msg.data.mode === 'private') {
                     // Mode Privé activé
                     if (msg.to === USER_ID) {
                         currentPrivatePeer = 'vendor'; // Je suis le client, mon privé c'est le vendeur
                         els.checkPrivate.checked = true; // Auto-check UI
                         setStatus(`🔒 PRIVÉ avec ${msg.from}`, 'ok');
                     } else if (ROLE === 'vendor') {
                         // C'est moi (vendeur) qui ai lancé, géré dans confirmPrivateCall
                     }
                } else {
                     // Mode Groupe
                     currentPrivatePeer = null;
                     els.checkPrivate.checked = false;
                }

        // Réception appel de vendeur
                if (ROLE === 'viewer') {
                    if (msg.from.includes('vendeur') || msg.from.includes('vendor')) {
                        log(`📞 Appel entrant du VENDEUR. Acceptation...`);
                        setStatus(`En ligne avec ${msg.from}`, 'ok');
                        startPeerConnection(msg.from, true);
                    }
                } 
                // Vendeur reçoit appel des clients (si initiator inversé ou reconnect)
                else if (ROLE === 'vendor') {
                    if (msg.from === USER_ID) return;
                    // En appel groupe, on accepte tout le monde
                    if (!currentPrivatePeer || currentPrivatePeer === msg.from) {
                         log(`📞 Appel entrant de ${msg.from}. Acceptation...`);
                         startPeerConnection(msg.from, true);
                    }
                }
                break;

            case 'offer':
                await handleOffer(msg.from, msg.data);
                break;
            case 'answer':
                await handleAnswer(msg.from, msg.data);
                break;
            case 'ice':
                await handleIce(msg.from, msg.data);
                break;
        }
    }

    // === WEBRTC CORE ===
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function getPeer(targetId) {
        if (peerConnections[targetId]) return peerConnections[targetId];
        const pc = new RTCPeerConnection(rtcConfig);
        if (localStream) localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
        
        pc.onicecandidate = e => { if (e.candidate) sendSignal('ice', e.candidate, targetId); };
        pc.onconnectionstatechange = () => {
            if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') closePeer(targetId);
        };
        pc.ontrack = e => createRemoteVideo(targetId, e.streams[0]);
        
        peerConnections[targetId] = pc;
        return pc;
    }

    async function startPeerConnection(targetId, initiator = false) {
        const pc = getPeer(targetId);
        if (initiator) {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            sendSignal('offer', offer, targetId);
        }
    }

    async function handleOffer(targetId, offer) {
        // Sécurité : si on a déjà une connexion active qui n'est pas celle-ci, on reset ? 
        // Non, WebRTC gère les renégociations. Mais le closePeer avant l'appel aide.
        const pc = getPeer(targetId);
        await pc.setRemoteDescription(offer);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        sendSignal('answer', answer, targetId);
    }

    async function handleAnswer(targetId, answer) {
        const pc = getPeer(targetId);
        await pc.setRemoteDescription(answer);
    }

    async function handleIce(targetId, candidate) {
        const pc = getPeer(targetId);
        try { await pc.addIceCandidate(candidate); } catch(e){}
    }

    function closePeer(targetId) {
        if (peerConnections[targetId]) {
            peerConnections[targetId].close();
            delete peerConnections[targetId];
        }
        const vid = document.getElementById(`card-${targetId}`);
        if (vid) vid.remove();
        log(`❌ Connexion fermée avec ${targetId}`);
    }

    function createRemoteVideo(id, stream) {
        if (document.getElementById(`card-${id}`)) return;
        const card = document.createElement('div');
        card.className = 'video-card';
        card.id = `card-${id}`;
        card.innerHTML = `<h3><span>👤 ${id}</span><span class="connection-dot dot-green"></span></h3><video id="vid-${id}" autoplay playsinline></video><div class="audio-track"><div id="aud-${id}" class="audio-level"></div></div>`;
        els.videoGrid.appendChild(card);
        const vid = document.getElementById(`vid-${id}`);
        vid.srcObject = stream;
        forceAudioOutput(vid);
        setupAudioMeter(stream, `aud-${id}`);
    }

    // === UTILS AUDIO ===
    async function forceAudioOutput(element) {
        try {
            const devices = await navigator.mediaDevices.enumerateDevices();
            const headset = devices.find(d => d.kind === 'audiooutput' && /headphone|casque|headset|bluetooth/i.test(d.label));
            if (headset && typeof element.setSinkId === 'function') {
                await element.setSinkId(headset.deviceId);
                log(`🎧 Audio -> ${headset.label}`);
            }
        } catch (e) {}
    }

    function setupAudioMeter(stream, elemId) {
        if (!audioContext) return;
        try {
            const src = audioContext.createMediaStreamSource(stream);
            const analyzer = audioContext.createAnalyser();
            analyzer.fftSize = 64;
            src.connect(analyzer);
            const data = new Uint8Array(analyzer.frequencyBinCount);
            const bar = document.getElementById(elemId);
            function draw() {
                if (!document.getElementById(elemId)) return;
                analyzer.getByteFrequencyData(data);
                const val = data.reduce((a,b)=>a+b) / data.length;
                bar.style.width = Math.min(100, val * 2) + '%';
                requestAnimationFrame(draw);
            }
            draw();
        } catch(e) {}
    }

    // === UI ACTIONS ===
    els.btnCam.onclick = async () => {
        try {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            els.localVideo.srcObject = localStream;
            setupAudioMeter(localStream, 'localAudio');
            els.btnCam.disabled = true;
            els.btnConnect.disabled = false;
        } catch (e) { alert("Erreur caméra: " + e.message); }
    };

    els.btnConnect.onclick = () => {
        setStatus("En ligne", "ok");
        els.btnConnect.disabled = true;
        if (ROLE === 'vendor') {
            els.btnGroup.disabled = false;
            els.btnPrivate.disabled = false;
            // On demande qui est là pour remplir la liste dynamique
            sendSignal('who-is-there', {});
            // Au cas où le signal est perdu, on force l'ajout après coup
            setTimeout(() => {
                 if (connectedUsers.size === 0) {
                     // Fallback simu ou attente
                     log("⚠️ Aucune réponse immédiate, attente des signaux de présence...");
                 }
                 updateChatTarget(); // Force update au cas où
            }, 2000);
        } else {
            els.btnPrivate.disabled = false; // Activer bouton demande
        }
        sendSignal('presence', { status: 'ready' });
    };

    els.btnGroup.onclick = () => {
        log("📢 Lancement Appel Groupe (Reset total)");
        Object.keys(peerConnections).forEach(closePeer); // Reset vendeur
        sendSignal('call-request', { mode: 'group' }, 'all');
        currentPrivatePeer = null; // Reset mode privé
        els.checkPrivate.checked = false;
        els.chatTarget.value = 'all';
        els.btnHangup.disabled = false;
        setStatus("Appel Groupe", "ok");
    };

    els.btnPrivate.onclick = () => {
        if (ROLE === 'viewer') {
            log("✋ Envoi demande appel privé...");
            sendSignal('ask-private', {});
            alert("Demande envoyée au vendeur !");
        } else {
            els.userGrid.innerHTML = '';
            connectedUsers.forEach(user => {
                const div = document.createElement('div');
                div.className = 'user-btn';
                div.innerText = user;
                div.onclick = () => {
                    document.querySelectorAll('.user-btn').forEach(b => b.classList.remove('selected'));
                    div.classList.add('selected');
                };
                els.userGrid.appendChild(div);
            });
            els.modal.classList.remove('hidden');
        }
    };

    window.confirmPrivateCall = () => {
        const selected = document.querySelector('.user-btn.selected');
        if (!selected) return alert("Sélectionnez un client !");
        const target = selected.innerText;
        
        log(`🔒 Appel Privé vers ${target} (Reset autres)`);
        Object.keys(peerConnections).forEach(closePeer); // Reset vendeur
        sendSignal('call-request', { mode: 'private' }, target);
        
        // ACTIVATION MODE PRIVÉ VENDEUR
        currentPrivatePeer = target;
        els.checkPrivate.checked = true;
        els.chatTarget.value = target; // Synchro sélecteur
        setStatus(`🔒 PRIVÉ avec ${target}`, 'ok');

        els.btnHangup.disabled = false;
        closeModal();
    };

    window.closeModal = () => els.modal.classList.add('hidden');
    els.btnHangup.onclick = () => { Object.keys(peerConnections).forEach(closePeer); setStatus("Raccroché", "ok"); };
    document.getElementById('btnReset').onclick = () => window.location.reload();

    // === CHAT ===
    window.sendChat = () => {
        const txt = els.chatInput.value.trim();
        if (!txt) return;
        
        let isPrivate = els.checkPrivate.checked;
        let target = isPrivate ? 'vendor' : 'all';

        // FORCE PRIVÉ si en appel privé
        if (currentPrivatePeer) {
            isPrivate = true;
            target = currentPrivatePeer;
            // Pour le client en privé, target = 'vendor' (déjà le cas avec isPrivate)
            // Pour le vendeur en privé, target = currentPrivatePeer (le client)
        } 
        // GESTION SÉLECTEUR VENDEUR (si pas en appel privé mais veut chatter privé)
        else if (ROLE === 'vendor') {
            const selected = els.chatTarget.value;
            if (selected !== 'all') {
                isPrivate = true;
                target = selected;
                // Auto-cocher la case privé si on sélectionne un client spécifique
                els.checkPrivate.checked = true;
            } else {
                // Si on est sur "Tous", on force public sauf si la case est cochée manuellement (cas rare)
                if (!isPrivate) target = 'all';
            }
        }
        
        sendSignal('chat', { text: txt, private: isPrivate }, target);
        displayChat(USER_ID, txt, isPrivate);
        els.chatInput.value = '';
    };

    els.chatInput.onkeypress = (e) => { if(e.key === 'Enter') sendChat(); };

    function displayChat(sender, txt, isPrivate) {
        const div = document.createElement('div');
        div.className = `chat-msg ${isPrivate ? 'chat-private' : ''}`;
        div.innerHTML = `<b>${sender} ${isPrivate ? '(PRIVÉ)' : ''}:</b> ${txt}`;
        els.chat.appendChild(div);
        els.chat.scrollTop = els.chat.scrollHeight;
    }

    function updateChatTarget() {
        if (ROLE !== 'vendor') return;
        
        const current = els.chatTarget.value;
        // On vide et on remet l'option par défaut
        els.chatTarget.innerHTML = '<option value="all">Tous</option>';
        
        // On ajoute les clients connectés
        connectedUsers.forEach(user => {
            // On exclut le vendeur lui-même au cas où
            if (user === USER_ID) return;
            
            const opt = document.createElement('option');
            opt.value = user;
            opt.innerText = user;
            els.chatTarget.appendChild(opt);
        });

        // Restaurer la sélection si elle existe encore, sinon revenir à "Tous"
        if (Array.from(els.chatTarget.options).some(o => o.value === current)) {
             els.chatTarget.value = current;
        } else {
             els.chatTarget.value = 'all';
        }
    }

</script>
</body>

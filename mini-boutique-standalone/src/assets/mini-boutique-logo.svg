<svg width="200" height="60" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Fond dégradé du logo -->
  <defs>
    <linearGradient id="mangooGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FF8A5B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4ECDC4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF8A5B;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ombre portée -->
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Icône boutique stylisée -->
  <g filter="url(#shadow)">
    <!-- Bâtiment principal -->
    <rect x="15" y="15" width="30" height="30" rx="4" fill="url(#mangooGradient)" opacity="0.9"/>
    
    <!-- Toit -->
    <path d="M10 15 L30 5 L50 15 Z" fill="url(#mangooGradient)" opacity="0.8"/>
    
    <!-- Porte -->
    <rect x="22" y="25" width="8" height="12" rx="2" fill="#FFFFFF" opacity="0.9"/>
    
    <!-- Fenêtres -->
    <rect x="18" y="18" width="6" height="6" rx="1" fill="#FFFFFF" opacity="0.7"/>
    <rect x="36" y="18" width="6" height="6" rx="1" fill="#FFFFFF" opacity="0.7"/>
    
    <!-- Panneau "OUVERT" -->
    <rect x="55" y="20" width="25" height="8" rx="4" fill="#4ECDC4" opacity="0.8"/>
    <text x="67.5" y="25.5" font-family="Arial, sans-serif" font-size="5" fill="#FFFFFF" text-anchor="middle" font-weight="bold">OUVERT</text>
  </g>
  
  <!-- Texte "Mini-Boutique" -->
  <text x="90" y="28" font-family="Arial, sans-serif" font-size="18" fill="url(#textGradient)" font-weight="bold" letter-spacing="1">
    Mini-Boutique
  </text>
  
  <!-- Slogan -->
  <text x="90" y="42" font-family="Arial, sans-serif" font-size="10" fill="#4ECDC4" opacity="0.8" letter-spacing="0.5">
    Votre commerce en ligne
  </text>
  
  <!-- Éléments décoratifs -->
  <circle cx="185" cy="15" r="3" fill="#FF6B35" opacity="0.6"/>
  <circle cx="190" cy="45" r="2" fill="#4ECDC4" opacity="0.6"/>
  <circle cx="180" cy="50" r="1.5" fill="#FF8A5B" opacity="0.7"/>
</svg>
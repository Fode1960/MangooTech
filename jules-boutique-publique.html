<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jules Boutique - Page Publique</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f8f9fa;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem 0;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        
        .boutique-info {
            background: white;
            margin: 2rem auto;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .boutique-header {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            padding-bottom: 2rem;
            border-bottom: 2px solid #f0f0f0;
        }
        
        .logo {
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
            color: white;
        }
        
        .boutique-details h2 {
            color: #2c3e50;
            margin-bottom: 0.5rem;
        }
        
        .contact-info {
            display: flex;
            gap: 2rem;
            margin-top: 1rem;
        }
        
        .contact-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #666;
        }
        
        .products-section {
            margin-top: 2rem;
        }
        
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-top: 2rem;
        }
        
        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        
        .product-card:hover {
            transform: translateY(-5px);
        }
        
        .product-image {
            height: 200px;
            background: linear-gradient(45deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        
        .product-info {
            padding: 1.5rem;
        }
        
        .product-name {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #2c3e50;
        }
        
        .product-price {
            font-size: 1.5rem;
            color: #e74c3c;
            font-weight: bold;
        }
        
        .status-badge {
            display: inline-block;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
            margin-top: 1rem;
        }
        
        .status-approved {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .no-products {
            text-align: center;
            padding: 3rem;
            color: #666;
        }
        
        .footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 2rem 0;
            margin-top: 3rem;
        }
        
        .loading {
            text-align: center;
            padding: 2rem;
        }
        
        .error {
            background-color: #f8d7da;
            color: #721c24;
            padding: 1rem;
            border-radius: 5px;
            margin: 1rem 0;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>🏪 Jules Boutique</h1>
            <p>Page publique de la boutique</p>
        </div>
    </div>

    <div class="container">
        <div id="content">
            <div class="loading">
                <h3>Chargement des informations...</h3>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="container">
            <p>© 2024 Jules Boutique - Propulsé par MangooTech</p>
        </div>
    </div>

    <script>
        // Configuration
        const BOUTIQUE_SLUG = 'jules-boutique-mksbfsb8';
        const API_URL = 'http://localhost:3010';

        // Charger les données de la boutique
        async function loadBoutiqueData() {
            try {
                console.log('🔄 Chargement des données de la boutique...');
                
                // Récupérer les données de la boutique
                const response = await fetch(`${API_URL}/api/shops/simple/shops/simple`);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Erreur lors du chargement');
                }
                
                // Trouver la boutique Jules
                const boutique = data.data.find(shop => shop.slug === BOUTIQUE_SLUG);
                
                if (!boutique) {
                    throw new Error(`Boutique avec le slug "${BOUTIQUE_SLUG}" non trouvée`);
                }
                
                console.log('✅ Boutique trouvée:', boutique.name);
                displayBoutique(boutique);
                
                // Charger les produits
                await loadProducts(boutique.id);
                
            } catch (error) {
                console.error('❌ Erreur:', error);
                displayError(error.message);
            }
        }

        // Afficher les informations de la boutique
        function displayBoutique(boutique) {
            const content = document.getElementById('content');
            
            content.innerHTML = `
                <div class="boutique-info">
                    <div class="boutique-header">
                        <div class="logo">
                            ${boutique.name.charAt(0).toUpperCase()}
                        </div>
                        <div class="boutique-details">
                            <h2>${boutique.name}</h2>
                            <p>${boutique.description || 'Boutique de qualité proposant une sélection exceptionnelle de produits.'}</p>
                            
                            <div class="contact-info">
                                ${boutique.contact_phone ? `
                                    <div class="contact-item">
                                        <span>📞</span>
                                        <span>${boutique.contact_phone}</span>
                                    </div>
                                ` : ''}
                                ${boutique.contact_email ? `
                                    <div class="contact-item">
                                        <span>✉️</span>
                                        <span>${boutique.contact_email}</span>
                                    </div>
                                ` : ''}
                                ${boutique.address ? `
                                    <div class="contact-item">
                                        <span>📍</span>
                                        <span>${boutique.address}</span>
                                    </div>
                                ` : ''}
                            </div>
                            
                            <div class="status-badge status-${boutique.status}">
                                ${boutique.status === 'approved' ? '✅ Boutique Approuvée' : 
                                  boutique.status === 'pending' ? '⏳ En Attente de Validation' : 
                                  '❌ Boutique Non Disponible'}
                            </div>
                        </div>
                    </div>
                    
                    <div class="products-section">
                        <h3>🛍️ Nos Produits</h3>
                        <div id="products-container">
                            <div class="loading">
                                <p>Chargement des produits...</p>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Charger les produits
        async function loadProducts(shopId) {
            try {
                console.log('🔄 Chargement des produits...');
                
                // Simulation de produits (dans une vraie application, vous appelleriez l'API)
                const mockProducts = [
                    {
                        id: 1,
                        name: 'Produit Premium',
                        price: 25000,
                        description: 'Un produit de qualité exceptionnelle'
                    },
                    {
                        id: 2,
                        name: 'Article Deluxe',
                        price: 45000,
                        description: 'L\'élégance à son paroxysme'
                    },
                    {
                        id: 3,
                        name: 'Accessoire Chic',
                        price: 15000,
                        description: 'Le complément parfait pour votre style'
                    }
                ];
                
                displayProducts(mockProducts);
                
            } catch (error) {
                console.error('❌ Erreur chargement produits:', error);
                document.getElementById('products-container').innerHTML = `
                    <div class="no-products">
                        <p>Aucun produit disponible pour le moment.</p>
                    </div>
                `;
            }
        }

        // Afficher les produits
        function displayProducts(products) {
            const container = document.getElementById('products-container');
            
            if (products.length === 0) {
                container.innerHTML = `
                    <div class="no-products">
                        <p>Aucun produit disponible pour le moment.</p>
                    </div>
                `;
                return;
            }
            
            const productsHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">
                        📦
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price.toLocaleString('fr-FR')} FCFA</div>
                        <p style="color: #666; font-size: 0.9rem; margin-top: 0.5rem;">${product.description}</p>
                    </div>
                </div>
            `).join('');
            
            container.innerHTML = `<div class="products-grid">${productsHTML}</div>`;
        }

        // Afficher une erreur
        function displayError(message) {
            const content = document.getElementById('content');
            content.innerHTML = `
                <div class="error">
                    <h3>❌ Erreur</h3>
                    <p>${message}</p>
                    <p style="margin-top: 1rem;">
                        <strong>Solutions possibles :</strong><br>
                        • Vérifiez que le serveur est démarré (localhost:3010)<br>
                        • Vérifiez que la boutique existe dans la base de données<br>
                        • Essayez de rafraîchir la page<br>
                    </p>
                </div>
            `;
        }

        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            console.log('🚀 Page de boutique chargée');
            loadBoutiqueData();
        });
    </script>
</body>
</html>

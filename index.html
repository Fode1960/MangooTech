<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>MangooTech - La Plateforme E-commerce Africaine</title>
    <script>
      // Initialize theme immediately to prevent flash
      const initTheme = () => {
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      };
      initTheme();

      try {
        const host = String(location.hostname || '')
        const isDevHost = host === 'localhost' || host === '127.0.0.1' || host.startsWith('192.168.') || host.startsWith('10.') || host.startsWith('172.')
        if (isDevHost && 'serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations()
            .then((regs) => Promise.all((regs || []).map((r) => r.unregister().catch(() => false))))
            .catch(() => {})
          if (window.caches && typeof window.caches.keys === 'function') {
            window.caches.keys()
              .then((keys) => Promise.all((keys || []).map((k) => window.caches.delete(k).catch(() => false))))
              .catch(() => {})
          }
        }
      } catch {
      }

      const showBootError = (title, detail) => {
        try {
          const existing = document.getElementById('boot-error-overlay');
          if (existing) return;

          const overlay = document.createElement('div');
          overlay.id = 'boot-error-overlay';
          overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.92);color:#fff;z-index:99999;display:flex;align-items:flex-start;justify-content:center;padding:24px;box-sizing:border-box;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;';

          const box = document.createElement('div');
          box.style.cssText = 'max-width:980px;width:100%;border:1px solid rgba(255,255,255,0.15);border-radius:12px;padding:16px;background:rgba(255,255,255,0.06);';

          const header = document.createElement('div');
          header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;';

          const h = document.createElement('div');
          h.textContent = title;
          h.style.cssText = 'font-weight:800;font-size:14px;';

          const close = document.createElement('button');
          close.type = 'button';
          close.textContent = 'Fermer';
          close.style.cssText = 'background:transparent;color:#fff;border:1px solid rgba(255,255,255,0.25);border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer;';
          close.onclick = () => {
            try { overlay.remove(); } catch {}
          };

          header.appendChild(h);
          header.appendChild(close);

          const pre = document.createElement('pre');
          pre.textContent = String(detail || '');
          pre.style.cssText = 'white-space:pre-wrap;line-height:1.35;font-size:12px;margin:0;';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = 'Recharger';
          btn.style.cssText = 'margin-top:12px;background:#f97316;color:#111;border:none;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer;';
          btn.onclick = () => window.location.reload();

          box.appendChild(header);
          box.appendChild(pre);
          box.appendChild(btn);
          overlay.appendChild(box);
          document.body.appendChild(overlay);
        } catch {
        }
      };

      try {
        window.showBootError = showBootError;
      } catch {
      }

      window.addEventListener('error', (e) => {
        try {
          const err = e?.error;
          const name = String(err?.name || '');
          const msg0 = String(err?.message || e?.message || '');
          if (name === 'AbortError' || msg0.includes('signal is aborted') || msg0.includes('aborted')) {
            e.preventDefault();
            return;
          }
        } catch {
        }

        const msg = e?.error?.stack || e?.message || 'Erreur JavaScript au démarrage.';
        showBootError('Erreur au démarrage (JavaScript)', msg);
      });

      window.addEventListener('unhandledrejection', (e) => {
        try {
          const reason = e?.reason;
          const name = String(reason?.name || '');
          const msg0 = String(reason?.message || '');
          if (name === 'AbortError' || msg0.includes('signal is aborted') || msg0.includes('aborted')) {
            e.preventDefault();
            return;
          }
        } catch {
        }

        const reason = e?.reason;
        const msg = reason?.stack || reason?.message || String(reason || 'Promesse rejetée au démarrage.');
        showBootError('Erreur au démarrage (Promise)', msg);
      });

    </script>
  </head>
  <body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
    <div id="root" style="min-height: 100vh; box-sizing:border-box;">
      <style>
        #boot-fallback {
          max-width: 560px;
          width: 100%;
          text-align: center;
          color: #111827;
          font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
          margin: 96px auto;
          padding: 0 24px;
          box-sizing: border-box;
        }
        html.dark #boot-fallback { color: #f9fafb; }
        .boot-card {
          border-radius: 24px;
          padding: 22px 18px;
          background: rgba(255, 255, 255, 0.92);
          border: 1px solid rgba(17, 24, 39, 0.08);
          box-shadow: 0 18px 40px rgba(0, 0, 0, 0.08);
          backdrop-filter: blur(8px);
        }
        html.dark .boot-card {
          background: rgba(17, 24, 39, 0.65);
          border: 1px solid rgba(255, 255, 255, 0.10);
          box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
        }
        .boot-brand {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          width: 56px;
          height: 56px;
          border-radius: 16px;
          background: linear-gradient(135deg, #f97316 0%, #10b981 100%);
          color: #0b1220;
          font-weight: 900;
          letter-spacing: -0.02em;
          font-size: 18px;
          margin-bottom: 14px;
          box-shadow: 0 14px 28px rgba(0, 0, 0, 0.12);
        }
        .boot-title {
          font-weight: 900;
          font-size: 18px;
          margin: 0;
        }
        .boot-subtitle {
          font-size: 13px;
          opacity: 0.82;
          margin: 6px 0 0 0;
        }
        .boot-row {
          margin-top: 16px;
          display: inline-flex;
          align-items: center;
          gap: 12px;
        }
        .boot-spinner {
          width: 34px;
          height: 34px;
          border-radius: 999px;
          border: 3px solid rgba(249, 115, 22, 0.18);
          border-top-color: #f97316;
          border-right-color: #10b981;
          animation: boot-spin 0.9s linear infinite;
        }
        .boot-dots {
          display: inline-flex;
          gap: 6px;
        }
        .boot-dot {
          width: 7px;
          height: 7px;
          border-radius: 999px;
          background: rgba(16, 185, 129, 0.9);
          animation: boot-bounce 1.2s ease-in-out infinite;
        }
        .boot-dot:nth-child(2) { animation-delay: 0.12s; opacity: 0.85; }
        .boot-dot:nth-child(3) { animation-delay: 0.24s; opacity: 0.7; }
        @keyframes boot-spin {
          from { transform: rotate(0deg); }
          to { transform: rotate(360deg); }
        }
        @keyframes boot-bounce {
          0%, 80%, 100% { transform: translateY(0); }
          40% { transform: translateY(-6px); }
        }
        @media (prefers-reduced-motion: reduce) {
          .boot-spinner, .boot-dot { animation: none; }
        }
      </style>
      <div id="boot-fallback" role="status" aria-live="polite" aria-label="Chargement de MangooTech">
        <div class="boot-card">
          <div class="boot-brand">MT</div>
          <p class="boot-title">Chargement de MangooTech</p>
          <p class="boot-subtitle">Selon votre réseau (2G/3G/4G), cela peut prendre quelques secondes.</p>
          <div class="boot-row" aria-hidden="true">
            <div class="boot-spinner"></div>
            <div class="boot-dots">
              <span class="boot-dot"></span>
              <span class="boot-dot"></span>
              <span class="boot-dot"></span>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>

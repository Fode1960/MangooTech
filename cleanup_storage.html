<!DOCTYPE html>
<html>
<head>
    <title>Nettoyage du localStorage</title>
</head>
<body>
    <h1>Nettoyage du localStorage</h1>
    <button onclick="cleanupLocalStorage()">Nettoyer le localStorage</button>
    <div id="result"></div>

    <script>
        function cleanupLocalStorage() {
            try {
                // Afficher ce qui sera supprimé
                const itemsToRemove = [];
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key.includes('shop') || key.includes('boutique') || key.includes('offline')) {
                        itemsToRemove.push(key);
                    }
                }
                
                document.getElementById('result').innerHTML = `<p>Éléments trouvés: ${itemsToRemove.join(', ')}</p>`;
                
                // Supprimer les éléments
                itemsToRemove.forEach(key => {
                    localStorage.removeItem(key);
                });
                
                document.getElementById('result').innerHTML += '<p style="color: green;">✅ LocalStorage nettoyé avec succès !</p>';
                
                // Afficher le localStorage restant
                const remainingItems = [];
                for (let i = 0; i < localStorage.length; i++) {
                    remainingItems.push(localStorage.key(i));
                }
                document.getElementById('result').innerHTML += `<p>Éléments restants: ${remainingItems.join(', ')}</p>`;
                
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">Erreur: ${error.message}</p>`;
            }
        }
        
        // Afficher le contenu actuel du localStorage
        window.onload = function() {
            const currentItems = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                currentItems.push(`${key}: ${localStorage.getItem(key)}`);
            }
            if (currentItems.length > 0) {
                document.getElementById('result').innerHTML = `<p>Contenu actuel: ${currentItems.join(', ')}</p>`;
            } else {
                document.getElementById('result').innerHTML = '<p>LocalStorage vide</p>';
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test VoIP Audio Simple - MangooTech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.2em;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .user-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            border-left: 5px solid #ff6b35;
        }
        
        .user-id {
            font-size: 1.3em;
            font-weight: bold;
            color: #ff6b35;
            margin: 15px 0;
            padding: 10px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 30px 0;
            flex-wrap: wrap;
        }
        
        button {
            padding: 15px 25px;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .audio-visualizer {
            margin: 30px 0;
            padding: 25px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e9ecef;
        }
        
        .audio-bar {
            width: 100%;
            height: 35px;
            background: #e0e0e0;
            border-radius: 18px;
            overflow: hidden;
            margin: 15px 0;
            position: relative;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .audio-level {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A, #CDDC39, #FFC107, #FF5722);
            border-radius: 18px;
            transition: width 0.1s ease;
            width: 0%;
        }
        
        .audio-percentage {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            color: #333;
            font-size: 14px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }
        
        .status-display {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            font-weight: bold;
            text-align: center;
            font-size: 1.1em;
        }
        
        .status-ready {
            background: #e8f5e8;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }
        
        .status-testing {
            background: #fff3e0;
            color: #f57c00;
            border: 2px solid #ff9800;
        }
        
        .status-active {
            background: #e3f2fd;
            color: #1976d2;
            border: 2px solid #2196f3;
        }
        
        .call-controls {
            display: none;
            gap: 15px;
            justify-content: center;
            margin: 25px 0;
        }
        
        .call-timer {
            font-size: 2em;
            font-weight: bold;
            color: #ff6b35;
            margin: 15px 0;
            padding: 10px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 15px 0;
            font-weight: bold;
            text-align: center;
            display: none;
        }
        
        .error-message {
            background: #ffebee;
            color: #c62828;
            border-left: 4px solid #c62828;
        }
        
        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            border-left: 4px solid #2e7d32;
        }
        
        .info-message {
            background: #e3f2fd;
            color: #1976d2;
            border-left: 4px solid #1976d2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🥭 Test Audio VoIP</h1>
        
        <div class="user-info">
            <h3>Compte de Test</h3>
            <div class="user-id" id="userId">Chargement...</div>
            <div><strong>Statut:</strong> <span id="statusText">Prêt</span></div>
        </div>
        
        <div class="controls">
            <button id="newAccountBtn" class="btn-primary">🔄 Nouveau Compte</button>
            <button id="testMicBtn" class="btn-success">🎤 Test Micro</button>
            <button id="simulateCallBtn" class="btn-success">📞 Simuler Appel</button>
        </div>
        
        <div id="errorMessage" class="message error-message"></div>
        <div id="successMessage" class="message success-message"></div>
        <div id="infoMessage" class="message info-message"></div>
        
        <div class="audio-visualizer">
            <h3>🎵 Visualiseur Audio</h3>
            <div>
                <strong>🎤 Audio Local:</strong>
                <div class="audio-bar">
                    <div class="audio-level" id="localAudioLevel"></div>
                    <div class="audio-percentage" id="localAudioPercentage">0%</div>
                </div>
            </div>
            <div>
                <strong>📞 Audio Distant (Simulé):</strong>
                <div class="audio-bar">
                    <div class="audio-level" id="remoteAudioLevel"></div>
                    <div class="audio-percentage" id="remoteAudioPercentage">0%</div>
                </div>
            </div>
        </div>
        
        <div id="callStatus" class="status-display status-ready">
            🎯 Prêt pour les tests
        </div>
        
        <div id="callControls" class="call-controls">
            <button id="answerBtn" class="btn-success">✅ Répondre</button>
            <button id="hangupBtn" class="btn-danger">❌ Raccrocher</button>
        </div>
        
        <div id="callTimer" class="call-timer" style="display: none;">
            00:00
        </div>
    </div>

    <script>
        // Variables globales
        let currentUserId = null;
        let localStream = null;
        let audioContext = null;
        let analyser = null;
        let dataArray = null;
        let animationId = null;
        let callStartTime = null;
        let callTimerInterval = null;
        let isInCall = false;
        let isAudioTesting = false;
        
        // État de l'appel
        let callState = {
            status: 'idle', // idle, calling, connected, incoming
            caller: null,
            callee: null,
            callId: null
        };
        
        // Sons de notification (simulés)
        const notificationSound = {
            incoming: null,
            outgoing: null,
            connected: null
        };
        
        // Initialisation
        document.addEventListener('DOMContentLoaded', function() {
            generateNewAccount();
            setupEventListeners();
            createNotificationSounds();
        });
        
        // Créer des sons de notification (utilisant Web Audio API)
        function createNotificationSounds() {
            try {
                // Son d'appel entrant (bip bip)
                notificationSound.incoming = () => {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.2);
                    
                    // Répéter le son
                    setTimeout(() => {
                        if (callState.status === 'incoming') {
                            notificationSound.incoming();
                        }
                    }, 1000);
                };
                
                // Son d'appel sortant (bip continu)
                notificationSound.outgoing = () => {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(400, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.2, audioContext.currentTime);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.5);
                    
                    // Répéter le son
                    setTimeout(() => {
                        if (callState.status === 'calling') {
                            notificationSound.outgoing();
                        }
                    }, 1000);
                };
                
                // Son de connexion (ding)
                notificationSound.connected = () => {
                    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    oscillator.frequency.setValueAtTime(600, audioContext.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
                    
                    oscillator.start();
                    oscillator.stop(audioContext.currentTime + 0.3);
                };
                
            } catch (error) {
                console.log('Impossible de créer les sons de notification:', error);
            }
        }
        
        // Générer un nouveau compte utilisateur
        function generateNewAccount() {
            currentUserId = 'demo-' + Math.random().toString(36).substr(2, 8);
            document.getElementById('userId').textContent = currentUserId;
            showSuccess(`Nouveau compte créé: ${currentUserId}`);
            
            // Réinitialiser l'état
            endCall();
            stopAudioTesting();
        }
        
        // Tester le microphone
        async function testMicrophone() {
            if (isAudioTesting) {
                stopAudioTesting();
                return;
            }
            
            try {
                showInfo('Demande d\'accès au microphone...');
                
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    } 
                });
                
                localStream = stream;
                isAudioTesting = true;
                
                // Créer le contexte audio pour l'analyse
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                const source = audioContext.createMediaStreamSource(stream);
                source.connect(analyser);
                
                analyser.fftSize = 512;
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                document.getElementById('testMicBtn').textContent = '🔇 Arrêter Test';
                document.getElementById('testMicBtn').className = 'btn-danger';
                
                showSuccess('✅ Microphone activé avec succès! Parlez pour voir le niveau audio.');
                startAudioAnalysis();
                
            } catch (error) {
                console.error('❌ Erreur d\'accès au microphone:', error);
                showError('Impossible d\'accéder au microphone. Vérifiez les permissions du navigateur.');
            }
        }
        
        // Analyser l'audio en temps réel
        function startAudioAnalysis() {
            function updateAudioLevel() {
                if (!analyser || !dataArray || !isAudioTesting) return;
                
                analyser.getByteFrequencyData(dataArray);
                
                // Calculer le niveau RMS (Root Mean Square)
                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) {
                    sum += dataArray[i] * dataArray[i];
                }
                const rms = Math.sqrt(sum / dataArray.length);
                
                // Convertir en pourcentage (0-100%)
                const percentage = Math.min(100, (rms / 128) * 100);
                
                // Mettre à jour l'affichage
                document.getElementById('localAudioLevel').style.width = percentage + '%';
                document.getElementById('localAudioPercentage').textContent = Math.round(percentage) + '%';
                
                // Simuler l'audio distant si en appel
                if (isInCall) {
                    const remotePercentage = Math.random() * 40 + 20; // 20-60%
                    document.getElementById('remoteAudioLevel').style.width = remotePercentage + '%';
                    document.getElementById('remoteAudioPercentage').textContent = Math.round(remotePercentage) + '%';
                }
                
                animationId = requestAnimationFrame(updateAudioLevel);
            }
            
            updateAudioLevel();
        }
        
        // Arrêter le test audio
        function stopAudioTesting() {
            isAudioTesting = false;
            
            if (animationId) {
                cancelAnimationFrame(animationId);
                animationId = null;
            }
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
            
            // Réinitialiser l'affichage
            document.getElementById('localAudioLevel').style.width = '0%';
            document.getElementById('localAudioPercentage').textContent = '0%';
            document.getElementById('remoteAudioLevel').style.width = '0%';
            document.getElementById('remoteAudioPercentage').textContent = '0%';
            
            document.getElementById('testMicBtn').textContent = '🎤 Test Micro';
            document.getElementById('testMicBtn').className = 'btn-success';
            
            showInfo('Test audio arrêté');
        }
        
        // Simuler un appel entre deux comptes
        function simulateCall() {
            if (!localStream) {
                showError('Veuillez d\'abord tester le microphone pour activer l\'audio');
                return;
            }
            
            if (isInCall) {
                endCall();
                return;
            }
            
            // Créer un appel simulé
            const targetUser = currentUserId + '-client';
            const callId = 'call-' + Date.now();
            
            callState = {
                status: 'calling',
                caller: currentUserId,
                callee: targetUser,
                callId: callId
            };
            
            isInCall = true;
            
            // Simuler le son d'appel sortant
            if (notificationSound.outgoing) {
                notificationSound.outgoing();
            }
            
            updateCallStatus(`📞 Appel vers ${targetUser}...`);
            document.getElementById('simulateCallBtn').textContent = '❌ Raccrocher';
            document.getElementById('simulateCallBtn').className = 'btn-danger';
            
            showInfo(`Appel simulé vers ${targetUser}`);
            
            // Simuler la réponse après 3 secondes
            setTimeout(() => {
                if (callState.status === 'calling' && isInCall) {
                    // Arrêter le son d'appel
                    // Jouer le son de connexion
                    if (notificationSound.connected) {
                        notificationSound.connected();
                    }
                    
                    callState.status = 'connected';
                    callStartTime = new Date();
                    startCallTimer();
                    
                    updateCallStatus(`✅ Connecté avec ${targetUser}`);
                    showSuccess('Appel connecté! Vous pouvez maintenant parler.');
                    
                    // Continuer l'analyse audio
                    if (isAudioTesting) {
                        startAudioAnalysis();
                    }
                }
            }, 3000);
        }
        
        // Simuler un appel entrant (pour tester dans un autre onglet)
        function simulateIncomingCall() {
            if (!localStream) {
                showError('Veuillez d\'abord tester le microphone');
                return;
            }
            
            if (isInCall) {
                showError('Vous êtes déjà en appel');
                return;
            }
            
            const caller = 'vendeur-' + Math.random().toString(36).substr(2, 6);
            const callId = 'incoming-' + Date.now();
            
            callState = {
                status: 'incoming',
                caller: caller,
                callee: currentUserId,
                callId: callId
            };
            
            // Simuler le son d'appel entrant
            if (notificationSound.incoming) {
                notificationSound.incoming();
            }
            
            updateCallStatus(`📞 Appel entrant de ${caller}`);
            document.getElementById('callControls').style.display = 'flex';
            
            showInfo(`Appel entrant de ${caller}`);
        }
        
        // Répondre à un appel
        function answerCall() {
            if (callState.status !== 'incoming') {
                return;
            }
            
            isInCall = true;
            callState.status = 'connected';
            callStartTime = new Date();
            
            // Jouer le son de connexion
            if (notificationSound.connected) {
                notificationSound.connected();
            }
            
            startCallTimer();
            updateCallStatus(`✅ Connecté avec ${callState.caller}`);
            
            document.getElementById('callControls').style.display = 'none';
            showSuccess('Appel accepté! Vous pouvez maintenant parler.');
            
            // Continuer l'analyse audio
            if (isAudioTesting) {
                startAudioAnalysis();
            }
        }
        
        // Raccrocher
        function hangUp() {
            if (callState.status === 'incoming') {
                // Refuser l'appel
                showInfo('Appel refusé');
            } else {
                // Raccrocher
                showInfo('Appel terminé');
            }
            
            endCall();
        }
        
        // Terminer l'appel
        function endCall() {
            isInCall = false;
            
            callState = {
                status: 'idle',
                caller: null,
                callee: null,
                callId: null
            };
            
            callStartTime = null;
            stopCallTimer();
            
            updateCallStatus('🎯 Prêt pour les tests');
            document.getElementById('callControls').style.display = 'none';
            
            document.getElementById('simulateCallBtn').textContent = '📞 Simuler Appel';
            document.getElementById('simulateCallBtn').className = 'btn-success';
            
            // Réinitialiser les barres audio distantes
            if (!isAudioTesting) {
                document.getElementById('localAudioLevel').style.width = '0%';
                document.getElementById('localAudioPercentage').textContent = '0%';
            }
            document.getElementById('remoteAudioLevel').style.width = '0%';
            document.getElementById('remoteAudioPercentage').textContent = '0%';
        }
        
        // Mettre à jour le statut de l'appel
        function updateCallStatus(message) {
            const statusDiv = document.getElementById('callStatus');
            statusDiv.textContent = message;
            
            // Mettre à jour la classe CSS
            statusDiv.className = 'status-display';
            if (callState.status === 'calling') {
                statusDiv.classList.add('status-active');
            } else if (callState.status === 'connected') {
                statusDiv.classList.add('status-active');
            } else if (callState.status === 'incoming') {
                statusDiv.classList.add('status-testing');
            } else {
                statusDiv.classList.add('status-ready');
            }
        }
        
        // Démarrer le minuteur d'appel
        function startCallTimer() {
            callTimerInterval = setInterval(() => {
                if (callStartTime) {
                    const elapsed = Math.floor((new Date() - callStartTime) / 1000);
                    const minutes = Math.floor(elapsed / 60);
                    const seconds = elapsed % 60;
                    const timeString = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                    document.getElementById('callTimer').textContent = timeString;
                    document.getElementById('callTimer').style.display = 'block';
                }
            }, 1000);
        }
        
        // Arrêter le minuteur d'appel
        function stopCallTimer() {
            if (callTimerInterval) {
                clearInterval(callTimerInterval);
                callTimerInterval = null;
            }
            document.getElementById('callTimer').style.display = 'none';
        }
        
        // Configurer les écouteurs d'événements
        function setupEventListeners() {
            document.getElementById('newAccountBtn').addEventListener('click', generateNewAccount);
            document.getElementById('testMicBtn').addEventListener('click', testMicrophone);
            document.getElementById('simulateCallBtn').addEventListener('click', simulateCall);
            document.getElementById('answerBtn').addEventListener('click', answerCall);
            document.getElementById('hangupBtn').addEventListener('click', hangUp);
            
            // Ajouter un bouton pour simuler un appel entrant (Ctrl+I)
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'i') {
                    e.preventDefault();
                    simulateIncomingCall();
                }
            });
        }
        
        // Fonctions d'affichage des messages
        function showError(message) {
            hideAllMessages();
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => errorDiv.style.display = 'none', 5000);
        }
        
        function showSuccess(message) {
            hideAllMessages();
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => successDiv.style.display = 'none', 3000);
        }
        
        function showInfo(message) {
            hideAllMessages();
            const infoDiv = document.getElementById('infoMessage');
            infoDiv.textContent = message;
            infoDiv.style.display = 'block';
            setTimeout(() => infoDiv.style.display = 'none', 3000);
        }
        
        function hideAllMessages() {
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('successMessage').style.display = 'none';
            document.getElementById('infoMessage').style.display = 'none';
        }
        
        // Afficher les instructions
        function showInstructions() {
            showInfo('💡 Astuce: Utilisez Ctrl+I pour simuler un appel entrant');
        }
        
        // Initialiser
        setupEventListeners();
        
        // Afficher les instructions après 2 secondes
        setTimeout(showInstructions, 2000);
    </script>
</body>
</html>

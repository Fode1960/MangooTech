# ============================================================
#  Mangoo Connect+ — reverse proxy nginx
#  ------------------------------------------------------------
#  - Termine le TLS public (port 443) avec un vrai certificat.
#  - Relaie vers le backend en HTTPS (port 8443, cert interne).
#  - Le backend voit donc une connexion chiffrée et conserve
#    son forçage HTTPS admin actif (FORCE_HTTPS_ADMIN=true).
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirection HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # Certificat public de production (monté depuis ./certs/)
    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 50m;

    location / {
        # Le backend écoute en HTTPS sur 8443 (cert interne auto-signé)
        proxy_pass https://mangoo:8443;
        proxy_ssl_verify off;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket (signalisation WebRTC)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Diagnostic notifications</title>
<style>
  :root { --ok:#16a34a; --bad:#dc2626; --warn:#d97706; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; }
  * { box-sizing: border-box; }
  body { margin:0; background:#f8fafc; color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:600px; margin:0 auto; padding:20px 16px 40px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--mut); font-size:13px; margin:0 0 18px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:14px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid #f1f5f9; }
  .row:last-child { border-bottom:0; }
  .k { color:var(--mut); font-size:13px; }
  .v { font-size:14px; font-weight:600; text-align:right; word-break:break-all; }
  .v.ok { color:var(--ok); } .v.bad { color:var(--bad); } .v.warn { color:var(--warn); }
  .pill { display:inline-block; padding:2px 8px; border-radius:999px; font-size:11px; font-weight:700; }
  .pill.ok { background:#dcfce7; color:var(--ok); } .pill.bad { background:#fee2e2; color:var(--bad); } .pill.warn { background:#fef3c7; color:var(--warn); }
  .actions { display:flex; flex-wrap:wrap; gap:8px; }
  button { flex:1; min-width:120px; border:0; border-radius:10px; padding:12px 14px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn-ok { background:var(--ok); color:#fff; } .btn-ghost { background:#fff; border:1px solid var(--line); color:#334155; }
  .btn-bad { background:#fff; border:1px solid #fecaca; color:var(--bad); }
  .status { padding:12px; border-radius:10px; font-size:13px; line-height:1.5; margin-bottom:14px; }
  .status.ok { background:#dcfce7; color:#166534; } .status.bad { background:#fee2e2; color:#991b1b; } .status.warn { background:#fef3c7; color:#92400e; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Diagnostic notifications</h1>
  <p class="sub">À ouvrir depuis l'appareil à tester (ici : Android / DAN Boutique).</p>
  <div id="status" class="status" style="display:none;"></div>
  <div class="card" id="rows"><div class="row"><span class="k">Analyse…</span><span class="v">—</span></div></div>
  <div class="actions">
    <button class="btn-ok" id="btn-enable">S'abonner</button>
    <button class="btn-bad" id="btn-disable">Se désabonner</button>
    <button class="btn-ghost" id="btn-refresh">Recharger</button>
  </div>
</div>
<script src="../assets/mangoo-push.js"></script>
<script>
  var P = window.MangooPush;
  function el(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
  function storedKey(){ try { return localStorage.getItem("mgt_push_vapid_key_v1") || ""; } catch(e){ return ""; } }
  function pill(ok){ return ok ? "<span class=\"pill ok\">OUI</span>" : "<span class=\"pill bad\">NON</span>"; }
  function valClass(ok){ return ok ? "v ok" : "v bad"; }
  function row(k, v, cls){ return "<div class=\"row\"><span class=\"k\">"+esc(k)+"</span><span class=\""+(cls||"v")+"\">"+v+"</span></div>"; }
  function render(d, serverKey){
    var html = "";
    html += row("Contexte sécurisé (HTTPS)", d.secureContext ? "Oui" : "Non", valClass(d.secureContext));
    html += row("Push supporté", d.supported ? "Oui" : "Non", valClass(d.supported));
    var perm = d.permission || "";
    var permCls = (perm === "granted") ? "v ok" : ((perm === "denied") ? "v bad" : "v warn");
    html += row("Permission notifications", perm, permCls);
    html += row("Jeton de session présent", d.token ? "Oui" : "Non", valClass(!!d.token));
    html += row("Rôle local", esc(d.role || "(aucun)"), (d.role ? "v" : "v warn"));
    html += row("Identifiant de routage", esc(d.routingId || "(vide)"), (d.routingId ? "v" : "v warn"));
    html += row("Service Worker enregistré", d.hasSwRegistration ? "Oui" : "Non", valClass(!!d.hasSwRegistration));
    html += row("Abonnement push existant", d.hasSubscription ? "Oui" : "Non", valClass(!!d.hasSubscription));
    var localKey = storedKey();
    var keyMatch = !!(serverKey && localKey && serverKey === localKey);
    html += row("Clé VAPID : serveur vs local", keyMatch ? "Correspondent" : "DIFFÉRENTES", valClass(keyMatch));
    if (serverKey) html += row("Clé serveur (début)", esc(serverKey.slice(0,20)) + "…", "v");
    if (localKey) html += row("Clé locale (début)", esc(localKey.slice(0,20)) + "…", "v");
    el("rows").innerHTML = html;
  }
  function statusBox(msg, kind){ var s = el("status"); s.style.display = "block"; s.className = "status " + (kind||"warn"); s.textContent = msg; }
  function run(){
    if (!P) { el("rows").innerHTML = row("Erreur", "mangoo-push.js non chargé", "v bad"); return; }
    fetch("/push/vapid-public-key").then(function(r){ return r.json(); }).then(function(j){ return (j && j.publicKey) || ""; }).catch(function(){ return ""; }).then(function(serverKey){
      if (!P.diagnose) { el("rows").innerHTML = row("Erreur", "diagnose indisponible", "v bad"); return; }
      Promise.resolve(P.diagnose()).then(function(d){ render(d, serverKey); });
    });
  }
  function enable(){
    if (!P) return;
    statusBox("Demande de permission en cours…", "warn");
    P.enable().then(function(res){
      if (res && res.granted && !res.error) { statusBox("Abonnement réussi. Recharge le dashboard prestataire puis teste.", "ok"); }
      else if (res && res.reason === "denied") { statusBox("Permission refusée. Autorise les notifications via le cadenas du navigateur.", "bad"); }
      else if (res && res.error) { statusBox("Échec : " + (res.error || "inconnu"), "bad"); }
      else { statusBox("Permission non accordée.", "warn"); }
      run();
    });
  }
  function disable(){
    if (!P) return;
    P.disable().then(function(){ statusBox("Désabonnement effectué.", "warn"); run(); });
  }
  el("btn-enable").addEventListener("click", enable);
  el("btn-disable").addEventListener("click", disable);
  el("btn-refresh").addEventListener("click", run);
  run();
</script>
</body>
</html>

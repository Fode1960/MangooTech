<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛍️ Live Shopping WebRTC - SIMPLE & FONCTIONNEL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .status {
            padding: 10px 20px;
            border-radius: 25px;
            font-weight: bold;
            text-align: center;
            margin: 10px 0;
            transition: all 0.3s ease;
        }

        .status.connected {
            background: rgba(76, 175, 80, 0.8);
            border: 2px solid #4CAF50;
        }

        .status.connecting {
            background: rgba(255, 152, 0, 0.8);
            border: 2px solid #FF9800;
        }

        .status.disconnected {
            background: rgba(244, 67, 54, 0.8);
            border: 2px solid #F44336;
        }

        .video-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .video-box {
            flex: 1;
            min-width: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .video-box h3 {
            margin-bottom: 15px;
            text-align: center;
            font-size: 1.2em;
        }

        video {
            width: 100%;
            height: 250px;
            background: #000;
            border-radius: 10px;
            object-fit: cover;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: linear-gradient(45deg, #FF6B6B, #FF8E8E);
            color: white;
        }

        .btn-secondary {
            background: linear-gradient(45deg, #4ECDC4, #44A08D);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(45deg, #FF416C, #FF4B2B);
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .audio-meter {
            margin-top: 15px;
            text-align: center;
        }

        .audio-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }

        .audio-fill {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            width: 0%;
            transition: width 0.1s ease;
        }

        .chat-container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .chat-messages {
            height: 200px;
            overflow-y: auto;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            background: rgba(0, 0, 0, 0.1);
        }

        .chat-input {
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            padding: 12px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 14px;
        }

        .chat-input input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .logs {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.4;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 3px 0;
        }

        .private-call-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .available-users {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .user-card {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .user-card:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .user-card.selected {
            background: rgba(76, 175, 80, 0.3);
            border: 2px solid #4CAF50;
        }

        .user-card .user-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .user-card .user-role {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.8);
        }

        .call-mode-section {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            text-align: center;
        }

        .mode-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin: 15px 0;
        }

        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin: 15px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .selected-info {
            margin-top: 15px;
            padding: 10px;
            background: rgba(76, 175, 80, 0.2);
            border-radius: 8px;
            font-weight: bold;
        }

        .user-selection {
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .video-container {
                flex-direction: column;
            }
            
            .controls {
                flex-direction: column;
                align-items: center;
            }
            
            button {
                width: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🛍️ Live Shopping WebRTC</h1>
            <div id="userInfo" class="status"></div>
        </div>

        <div id="connectionStatus" class="status disconnected">
            Déconnecté
        </div>

        <div class="video-container">
            <div class="video-box">
                <h3>Votre vidéo</h3>
                <video id="localVideo" autoplay muted playsinline></video>
                <div class="audio-meter">
                    <div>Votre audio</div>
                    <div class="audio-bar">
                        <div id="localAudioLevel" class="audio-fill"></div>
                    </div>
                </div>
            </div>
            <div class="video-box">
                <h3>Vidéo du vendeur</h3>
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="audio-meter">
                    <div>Audio entrant</div>
                    <div class="audio-bar">
                        <div id="remoteAudioLevel" class="audio-fill"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="startCamera" class="btn-secondary">🎤 Activer caméra/micro</button>
            <button id="connect" class="btn-primary">🔗 Se connecter</button>
            <button id="call" class="btn-primary">📞 Appeler Groupe</button>
            <button id="callPrivate" class="btn-primary">🔒 Appel Privé</button>
            <button id="answer" class="btn-primary">📱 Répondre</button>
            <button id="hangup" class="btn-danger">📴 Raccrocher</button>
            <button id="disconnect" class="btn-danger">🔌 Déconnecter</button>
            <button id="audioDiagnostic" class="btn-secondary">🔍 Diagnostic Audio</button>
        </div>

        <div id="callModeSelection" class="call-mode-section hidden">
            <h3>🎯 Mode d'appel</h3>
            <div class="mode-buttons">
                <button id="groupCallBtn" class="btn-primary">📞 Appel GROUPE (tous)</button>
                <button id="privateCallBtn" class="btn-secondary">🔒 Appel PRIVÉ (1 personne)</button>
            </div>
            <div id="userSelectionDiv" class="user-selection hidden">
                <h4>👥 Sélectionnez une personne :</h4>
                <div id="availableUsersList" class="users-grid"></div>
                <div id="selectedUserInfo" class="selected-info"></div>
            </div>
        </div>

        <div class="chat-container">
            <h3>💬 Chat en direct</h3>
            <div id="chatMessages" class="chat-messages"></div>
            <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Tapez votre message..." />
                <button id="sendChat" class="btn-primary">📤 Envoyer</button>
            </div>
        </div>

        <div class="logs" id="logs">
            <div class="log-entry">🚀 Système Live Shopping WebRTC démarré</div>
        </div>
    </div>

    <script>
        // Configuration WebRTC - VERSION SIMPLE & FONCTIONNELLE
        let localStream = null;
        let remoteStream = null;
        let peerConnection = null;
        let audioContext = null;
        let localAnalyser = null;
        let remoteAnalyser = null;
        let localDataArray = null;
        let remoteDataArray = null;
        let isConnected = false;
        let currentRoom = null;
        let userRole = null;
        let userId = null;
        let callMode = null; // 'group' ou 'private'
        let targetUserId = null; // Pour appels privés

        // Récupération des paramètres URL
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('roomId') || 'default-room';
        userId = urlParams.get('userId') || 'user-' + Math.random().toString(36).substr(2, 9);
        userRole = urlParams.get('role') || 'viewer';

        // Éléments DOM
        const localVideo = document.getElementById('localVideo');
        const remoteVideo = document.getElementById('remoteVideo');
        const connectionStatus = document.getElementById('connectionStatus');
        const userInfo = document.getElementById('userInfo');
        const logs = document.getElementById('logs');

        // Configuration WebRTC
        const peerConnectionConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Système de signaling via localStorage
        const signaling = {
            broadcast: (type, data) => {
                const message = {
                    type: type,
                    from: userId,
                    data: data,
                    timestamp: Date.now(),
                    roomId: roomId
                };
                
                const key = `webrtc-${roomId}-${type}-${Date.now()}`;
                localStorage.setItem(key, JSON.stringify(message));
                
                // Nettoyer les anciens messages après 30 secondes
                setTimeout(() => {
                    try {
                        localStorage.removeItem(key);
                    } catch (e) {}
                }, 30000);
            },
            
            send: (targetUserId, type, data) => {
                const message = {
                    type: type,
                    from: userId,
                    to: targetUserId,
                    data: data,
                    timestamp: Date.now(),
                    roomId: roomId
                };
                
                const key = `webrtc-${roomId}-private-${targetUserId}-${type}-${Date.now()}`;
                localStorage.setItem(key, JSON.stringify(message));
                
                setTimeout(() => {
                    try {
                        localStorage.removeItem(key);
                    } catch (e) {}
                }, 30000);
            },

            on: (type, callback) => {
                const checkMessages = () => {
                    for (let i = 0; i < localStorage.length; i++) {
                        const key = localStorage.key(i);
                        if (key && key.startsWith(`webrtc-${roomId}-`)) {
                            try {
                                const message = JSON.parse(localStorage.getItem(key));
                                
                                // Vérifier si c'est un message privé destiné à nous
                                if (key.includes('private-')) {
                                    if (message.to !== userId) continue;
                                }
                                
                                // Vérifier que ce n'est pas notre propre message
                                if (message.from === userId) continue;
                                
                                // Vérifier la room
                                if (message.roomId !== roomId) continue;
                                
                                // Vérifier le type
                                if (message.type === type) {
                                    // Vérifier que le message n'est pas trop vieux
                                    if (Date.now() - message.timestamp < 25000) {
                                        callback(message);
                                    }
                                }
                            } catch (e) {
                                // Ignorer les erreurs de parsing
                            }
                        }
                    }
                };
                
                // Vérifier les messages toutes les 500ms
                setInterval(checkMessages, 500);
            }
        };

        // Fonctions utilitaires
        function log(message) {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = 'log-entry';
            logEntry.textContent = `[${timestamp}] ${message}`;
            logs.appendChild(logEntry);
            logs.scrollTop = logs.scrollHeight;
            console.log(message);
        }

        function updateConnectionStatus(status, message) {
            connectionStatus.className = `status ${status}`;
            connectionStatus.textContent = message;
            isConnected = (status === 'connected');
            updateButtonStates();
        }

        function updateButtonStates() {
            const hasLocalStream = !!localStream;
            const hasRemoteStream = !!remoteStream;
            const hasPeerConnection = !!peerConnection;

            document.getElementById('startCamera').disabled = hasLocalStream;
            document.getElementById('connect').disabled = !hasLocalStream || isConnected;
            document.getElementById('call').disabled = !hasLocalStream || isConnected;
            document.getElementById('callPrivate').disabled = !hasLocalStream || isConnected || userRole !== 'vendor';
            document.getElementById('answer').disabled = !hasPeerConnection || isConnected;
            document.getElementById('hangup').disabled = !isConnected;
            document.getElementById('disconnect').disabled = !hasLocalStream;
        }

        // Initialisation
        function init() {
            userInfo.textContent = `👤 ${userId} (${userRole}) - Room: ${roomId}`;
            log(`🚀 Initialisation - User: ${userId}, Role: ${userRole}, Room: ${roomId}`);
            
            setupSignaling();
            setupEventListeners();
            updateButtonStates();
        }

        function setupEventListeners() {
            document.getElementById('startCamera').onclick = startCamera;
            document.getElementById('connect').onclick = connect;
            document.getElementById('call').onclick = call;
            document.getElementById('callPrivate').onclick = callPrivate;
            document.getElementById('answer').onclick = answer;
            document.getElementById('hangup').onclick = hangup;
            document.getElementById('disconnect').onclick = disconnect;
            document.getElementById('audioDiagnostic').onclick = audioDiagnostic;
            document.getElementById('sendChat').onclick = sendChatMessage;
            
            document.getElementById('chatInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') sendChatMessage();
            });

            // Écouteurs pour les nouveaux boutons
            const groupCallBtn = document.getElementById('groupCallBtn');
            const privateCallBtn = document.getElementById('privateCallBtn');
            
            if (groupCallBtn) {
                groupCallBtn.onclick = () => {
                    callMode = 'group';
                    document.getElementById('callModeSelection').classList.add('hidden');
                    performCall();
                };
            }
            
            if (privateCallBtn) {
                privateCallBtn.onclick = () => {
                    document.getElementById('userSelectionDiv').classList.remove('hidden');
                };
            }
        }

        function setupSignaling() {
            // Écouter les offres WebRTC
            signaling.on('offer', async (message) => {
                log(`📞 Offre reçue de ${message.from}`);
                await handleOffer(message.data);
            });

            // Écouter les réponses WebRTC
            signaling.on('answer', async (message) => {
                log(`📱 Réponse reçue de ${message.from}`);
                await handleAnswer(message.data);
            });

            // Écouter les candidats ICE
            signaling.on('ice-candidate', async (message) => {
                log(`🧊 Candidat ICE reçu de ${message.from}`);
                await handleIceCandidate(message.data);
            });

            // Écouter les messages de chat
            signaling.on('chat', (message) => {
                addChatMessage(message.from, message.data);
            });

            // Écouter les demandes de connexion
            signaling.on('connect-request', (message) => {
                log(`🔗 Demande de connexion de ${message.from}`);
                if (userRole === 'vendor') {
                    // Le vendeur accepte automatiquement
                    signaling.send(message.from, 'connect-accept', { roomId: roomId });
                }
            });

            // Écouter les acceptations de connexion
            signaling.on('connect-accept', (message) => {
                log(`✅ Connexion acceptée par ${message.from}`);
                updateConnectionStatus('connected', 'Connexion établie');
            });
        }

        async function startCamera() {
            try {
                log('📹 Démarrage de la caméra et du microphone...');
                
                const constraints = {
                    video: {
                        width: { ideal: 1280 },
                        height: { ideal: 720 },
                        facingMode: 'user'
                    },
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true,
                        sampleRate: 48000,
                        channelCount: 2
                    }
                };

                localStream = await navigator.mediaDevices.getUserMedia(constraints);
                localVideo.srcObject = localStream;
                
                log('✅ Caméra et microphone activés');
                
                // Configurer l'analyse audio
                setupAudioAnalysis();
                
                // Mettre à jour l'état des boutons
                updateButtonStates();
                
            } catch (error) {
                log(`❌ Erreur lors de l'activation de la caméra: ${error.message}`);
                alert(`Erreur: ${error.message}. Vérifiez les permissions.`);
            }
        }

        function setupAudioAnalysis() {
            if (!localStream) return;

            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                // Analyse audio locale
                const localSource = audioContext.createMediaStreamSource(localStream);
                localAnalyser = audioContext.createAnalyser();
                localAnalyser.fftSize = 256;
                localSource.connect(localAnalyser);
                localDataArray = new Uint8Array(localAnalyser.frequencyBinCount);

                // Analyse de l'audio distant (quand disponible)
                if (remoteVideo.srcObject) {
                    const remoteSource = audioContext.createMediaStreamSource(remoteVideo.srcObject);
                    remoteAnalyser = audioContext.createAnalyser();
                    remoteAnalyser.fftSize = 256;
                    remoteSource.connect(remoteAnalyser);
                    remoteDataArray = new Uint8Array(remoteAnalyser.frequencyBinCount);
                }

                // Démarrer la mise à jour des niveaux audio
                updateAudioLevels();
                
            } catch (error) {
                log(`⚠️ Erreur configuration analyse audio: ${error.message}`);
            }
        }

        function updateAudioLevels() {
            if (localAnalyser && localDataArray) {
                localAnalyser.getByteFrequencyData(localDataArray);
                const localRMS = Math.sqrt(localDataArray.reduce((sum, value) => sum + value * value, 0) / localDataArray.length);
                const localPercent = Math.min(100, (localRMS / 128) * 100);
                document.getElementById('localAudioLevel').style.width = localPercent + '%';
            }

            if (remoteAnalyser && remoteDataArray && remoteVideo.srcObject) {
                remoteAnalyser.getByteFrequencyData(remoteDataArray);
                const remoteRMS = Math.sqrt(remoteDataArray.reduce((sum, value) => sum + value * value, 0) / remoteDataArray.length);
                const remotePercent = Math.min(100, (remoteRMS / 128) * 100);
                document.getElementById('remoteAudioLevel').style.width = remotePercent + '%';
            }

            requestAnimationFrame(updateAudioLevels);
        }

        async function connect() {
            if (!localStream) {
                alert('Veuillez d\'abord activer la caméra et le microphone');
                return;
            }

            log('🔗 Connexion à la room...');
            updateConnectionStatus('connecting', 'Connexion en cours...');

            // Envoyer une demande de connexion
            signaling.broadcast('connect-request', { roomId: roomId });
            
            setTimeout(() => {
                if (!isConnected) {
                    updateConnectionStatus('disconnected', 'Aucun vendeur disponible');
                    log('⏰ Timeout: aucun vendeur trouvé');
                }
            }, 10000);
        }

        async function call() {
            if (!localStream) {
                alert('Veuillez d\'abord activer la caméra et le microphone');
                return;
            }

            log('📞 Appel en cours...');
            
            // Afficher le menu de sélection du mode
            document.getElementById('callModeSelection').classList.remove('hidden');
            updateConnectedUsersList();
        }

        function updateConnectedUsersList() {
            const usersList = document.getElementById('availableUsersList');
            usersList.innerHTML = '';
            
            // Obtenir la liste des utilisateurs connectés via localStorage
            const connectedUsers = [];
            for (let i = 0; i < localStorage.length; i++) {
                const key = localStorage.key(i);
                if (key && key.startsWith(`webrtc-${roomId}-`) && key.includes('user-')) {
                    try {
                        const data = JSON.parse(localStorage.getItem(key));
                        if (data.userId && data.userId !== userId) {
                            connectedUsers.push({
                                userId: data.userId,
                                role: data.role || 'viewer'
                            });
                        }
                    } catch (e) {
                        // Ignorer les erreurs de parsing
                    }
                }
            }
            
            if (connectedUsers.length === 0) {
                usersList.innerHTML = '<p>Aucun autre utilisateur connecté</p>';
                return;
            }
            
            connectedUsers.forEach(user => {
                const userCard = document.createElement('div');
                userCard.className = 'user-card';
                userCard.innerHTML = `
                    <div class="user-name">${user.userId}</div>
                    <div class="user-role">${user.role}</div>
                `;
                userCard.onclick = () => selectUserForCall(user.userId, user.role);
                usersList.appendChild(userCard);
            });
        }

        function selectUserForCall(selectedUserId, selectedUserRole) {
            // Mettre à jour l'affichage de la sélection
            document.querySelectorAll('.user-card').forEach(card => {
                card.classList.remove('selected');
            });
            event.target.closest('.user-card').classList.add('selected');
            
            document.getElementById('selectedUserInfo').innerHTML = `
                <p>👤 Sélectionné: <strong>${selectedUserId}</strong> (${selectedUserRole})</p>
                <button onclick="startPrivateCall('${selectedUserId}')" class="btn-primary">📞 Appeler ${selectedUserId}</button>
            `;
        }

        async function startPrivateCall(selectedUserId) {
            log(`🔒 Appel privé vers ${selectedUserId}`);
            callMode = 'private';
            targetUserId = selectedUserId;
            
            document.getElementById('callModeSelection').classList.add('hidden');
            performCall();
        }

        async function callPrivate() {
            if (!localStream) {
                alert('Veuillez d\'abord activer la caméra et le microphone');
                return;
            }

            log('🔒 Sélection du client pour appel privé...');
            
            // Afficher la liste des utilisateurs connectés
            document.getElementById('callModeSelection').classList.remove('hidden');
            updateConnectedUsersList();
        }

        async function performCall() {
            if (!localStream) {
                alert('Veuillez d\'abord activer la caméra et le microphone');
                return;
            }

            log('📞 Création de la connexion WebRTC...');
            
            // Créer la connexion WebRTC
            peerConnection = new RTCPeerConnection(peerConnectionConfig);
            
            // Ajouter le stream local
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // Gérer l'arrivée du stream distant
            peerConnection.ontrack = (event) => {
                log('📹 Stream distant reçu');
                remoteVideo.srcObject = event.streams[0];
                remoteStream = event.streams[0];
                
                // Configurer l'analyse audio pour le stream distant
                if (audioContext && remoteStream) {
                    try {
                        const remoteSource = audioContext.createMediaStreamSource(remoteStream);
                        remoteAnalyser = audioContext.createAnalyser();
                        remoteAnalyser.fftSize = 256;
                        remoteSource.connect(remoteAnalyser);
                        remoteDataArray = new Uint8Array(remoteAnalyser.frequencyBinCount);
                    } catch (error) {
                        log(`⚠️ Erreur configuration analyse audio distant: ${error.message}`);
                    }
                }
            };

            // Gérer les candidats ICE
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    log('🧊 Envoi du candidat ICE');
                    if (callMode === 'private' && targetUserId) {
                        signaling.send(targetUserId, 'ice-candidate', event.candidate);
                    } else {
                        signaling.broadcast('ice-candidate', event.candidate);
                    }
                }
            };

            // Créer et envoyer l'offre
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                
                log('📤 Envoi de l\'offre');
                if (callMode === 'private' && targetUserId) {
                    signaling.send(targetUserId, 'offer', offer);
                } else {
                    signaling.broadcast('offer', offer);
                }
                
                updateConnectionStatus('connecting', 'Appel en cours...');
            } catch (error) {
                log(`❌ Erreur lors de la création de l'offre: ${error.message}`);
            }
        }

        async function handleOffer(offer) {
            if (!localStream) {
                log('⚠️ Stream local non disponible pour accepter l\'offre');
                return;
            }

            log('📞 Traitement de l\'offre...');
            
            peerConnection = new RTCPeerConnection(peerConnectionConfig);
            
            // Ajouter le stream local
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            // Gérer l'arrivée du stream distant
            peerConnection.ontrack = (event) => {
                log('📹 Stream distant reçu');
                remoteVideo.srcObject = event.streams[0];
                remoteStream = event.streams[0];
                
                // Configurer l'analyse audio
                if (audioContext && remoteStream) {
                    try {
                        const remoteSource = audioContext.createMediaStreamSource(remoteStream);
                        remoteAnalyser = audioContext.createAnalyser();
                        remoteAnalyser.fftSize = 256;
                        remoteSource.connect(remoteAnalyser);
                        remoteDataArray = new Uint8Array(remoteAnalyser.frequencyBinCount);
                    } catch (error) {
                        log(`⚠️ Erreur configuration analyse audio distant: ${error.message}`);
                    }
                }
            };

            // Gérer les candidats ICE
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    log('🧊 Envoi du candidat ICE');
                    signaling.broadcast('ice-candidate', event.candidate);
                }
            };

            try {
                await peerConnection.setRemoteDescription(offer);
                log('✅ Offre définie comme description distante');
                
                // Créer et envoyer la réponse
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);
                
                log('📤 Envoi de la réponse');
                signaling.broadcast('answer', answer);
                
                updateConnectionStatus('connected', 'Appel accepté');
            } catch (error) {
                log(`❌ Erreur lors du traitement de l'offre: ${error.message}`);
            }
        }

        async function handleAnswer(answer) {
            if (!peerConnection) {
                log('⚠️ Aucune connexion pour traiter la réponse');
                return;
            }

            log('📱 Traitement de la réponse...');
            
            try {
                await peerConnection.setRemoteDescription(answer);
                log('✅ Réponse définie comme description distante');
                updateConnectionStatus('connected', 'Appel connecté');
            } catch (error) {
                log(`❌ Erreur lors du traitement de la réponse: ${error.message}`);
            }
        }

        async function handleIceCandidate(candidate) {
            if (!peerConnection) {
                log('⚠️ Aucune connexion pour ajouter le candidat ICE');
                return;
            }

            try {
                await peerConnection.addIceCandidate(candidate);
                log('✅ Candidat ICE ajouté');
            } catch (error) {
                log(`❌ Erreur lors de l'ajout du candidat ICE: ${error.message}`);
            }
        }

        function answer() {
            log('📱 Réponse à l\'appel...');
            // La réponse est automatique via handleOffer
        }

        function hangup() {
            log('📴 Raccrochage...');
            
            if (peerConnection) {
                peerConnection.close();
                peerConnection = null;
            }
            
            remoteVideo.srcObject = null;
            remoteStream = null;
            
            resetPrivateCall();
            updateConnectionStatus('disconnected', 'Déconnecté');
            updateButtonStates();
        }

        function disconnect() {
            log('🔌 Déconnexion complète...');
            hangup();
            
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }
            
            localVideo.srcObject = null;
            updateButtonStates();
        }

        function resetPrivateCall() {
            callMode = null;
            targetUserId = null;
            document.getElementById('callModeSelection').classList.add('hidden');
            document.getElementById('userSelectionDiv').classList.add('hidden');
            document.getElementById('selectedUserInfo').innerHTML = '';
        }

        function addChatMessage(from, message) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.innerHTML = `<strong>${from}:</strong> ${message}`;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function sendChatMessage() {
            const input = document.getElementById('chatInput');
            const message = input.value.trim();
            
            if (message) {
                signaling.broadcast('chat', message);
                addChatMessage(userId, message);
                input.value = '';
            }
        }

        async function audioDiagnostic() {
            log('🔍 Diagnostic audio en cours...');
            
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
            
            // Tester le contexte audio
            log(`📊 État du contexte audio: ${audioContext.state}`);
            log(`🎯 Sample rate: ${audioContext.sampleRate} Hz`);
            log(`⏱️ Current time: ${audioContext.currentTime.toFixed(2)} s`);
            
            // Tester les périphériques audio
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(device => device.kind === 'audioinput');
                const audioOutputs = devices.filter(device => device.kind === 'audiooutput');
                
                log(`🎤 Microphones trouvés: ${audioInputs.length}`);
                audioInputs.forEach((device, index) => {
                    log(`   ${index + 1}. ${device.label || 'Microphone sans nom'}`);
                });
                
                log(`🔊 Haut-parleurs trouvés: ${audioOutputs.length}`);
                audioOutputs.forEach((device, index) => {
                    log(`   ${index + 1}. ${device.label || 'Haut-parleur sans nom'}`);
                });
                
                // Tester la fonction setSinkId
                if ('setSinkId' in HTMLMediaElement.prototype) {
                    log('✅ setSinkId est supporté - Audio peut être dirigé vers le casque');
                } else {
                    log('⚠️ setSinkId non supporté - Audio passera par les haut-parleurs par défaut');
                }
                
            } catch (error) {
                log(`❌ Erreur lors de l'énumération des périphériques: ${error.message}`);
            }
            
            // Tester l'audio local
            if (localStream) {
                const audioTracks = localStream.getAudioTracks();
                if (audioTracks.length > 0) {
                    const track = audioTracks[0];
                    log(`🎤 Piste audio locale: ${track.label}`);
                    log(`   État: ${track.readyState}`);
                    log(`   Activé: ${track.enabled}`);
                    log(`   Volume: ${track.getSettings().volume || 'N/A'}`);
                } else {
                    log('⚠️ Aucune piste audio locale trouvée');
                }
            }
            
            // Tester l'audio distant
            if (remoteStream) {
                const audioTracks = remoteStream.getAudioTracks();
                if (audioTracks.length > 0) {
                    const track = audioTracks[0];
                    log(`🔊 Piste audio distante: ${track.label}`);
                    log(`   État: ${track.readyState}`);
                    log(`   Activé: ${track.enabled}`);
                } else {
                    log('⚠️ Aucune piste audio distante trouvée');
                }
            }
            
            log('✅ Diagnostic audio terminé');
        }

        // Démarrer l'application
        init();
    </script>
</body>
</html>
